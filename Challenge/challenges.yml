# Registry of Lean Pool challenges: open statements awaiting a proof.
#
# One entry per challenge. `statements` (and the optional `definitions`) name
# the declarations that may be left as `sorry` in the entry module; every other
# declaration in that file must be closed. `informal` is the natural-language
# statement the Lean is judged against — keep the two saying the same thing.
#
# Regenerate the cards after editing:
#   cd python && uv run python -m lean_pool.quality --repo .. --write-challenge-cards
challenges:
  - slug: odlyzko-root-discriminant-bound
    title: Odlyzko bound for root discriminants
    summary: >-
      Prove that a totally complex number field of degree at least 18 has
      absolute discriminant at least 8.25 raised to the degree — equivalently,
      root discriminant at least 8.25. Minkowski's elementary bound is too weak;
      the result comes from analysing the zeros of the Dedekind zeta function of
      the field, and follows from equation 26 and the table on p17 of Poitou's
      1977 "Sur les petits discriminants". The Fermat's Last Theorem project
      assumes it as FLT.Assumptions.Odlyzko_statement (tracking issue #458,
      which also links Thomas Browning's notes on an approach); Kevin Buzzard
      calls it one of the easiest of the results it assumes, and it is not on
      the project's own formalization plan. The line estimate is a guess at the
      analytic machinery needed — an explicit formula for the Dedekind zeta
      function and the resulting inequality — not at the write-up of the
      finished argument.
    branch: algebraic number theory
    entry_module: Challenge.Odlyzko
    proposers:
      - Kevin Buzzard
      - Vasily Ilin
    source:
      title: Sur les petits discriminants
      authors:
        - Georges Poitou
      url: https://www.numdam.org/item/SDPP_1976-1977__18_1_A6_0/
    license: Apache-2.0
    provenance: human
    status: solved
    solution:
      module: Solution.Odlyzko
      authors:
        - The FLT Project
        - √2
      project: odlyzko-bound
    estimated_lines: 5000
    statements:
      - declaration: Challenge.Odlyzko.abs_discr_ge
        informal: >-
          For a totally complex number field K whose degree over the rationals
          is at least 18, the absolute value of the discriminant of K is at
          least 8.25 raised to the power of that degree.
    tags:
      - number-theory
      - discriminants
      - number-fields
      - flt-assumption
    msc:
      - "11R29"
      - "11R42"
  - slug: mazur-torsion-bound
    title: Mazur's bound on the torsion of an elliptic curve over the rationals
    summary: >-
      Prove that the torsion subgroup of the group of rational points of an
      elliptic curve over the rationals has at most 16 elements. This is the
      numerical consequence of Mazur's 1977 classification of the possible
      torsion subgroups — cyclic of order at most 10 or of order 12, and
      Z/2Z x Z/nZ for n = 2, 4, 6, 8 — proved in "Modular curves and the
      Eisenstein ideal" by descent on the Eisenstein quotient of the Jacobian
      of a modular curve of prime level. Every known proof of Fermat's Last
      Theorem uses it, and the FLT project assumes it as
      FLT.Assumptions.Mazur_statement (tracking issue #477); it is not on the
      project's own formalization plan. The line estimate reflects that Mathlib
      has none of the modular-curve machinery a proof needs, so it is an
      estimate of a programme rather than of a single development; a solution
      via the winding quotient and known partial results towards
      Birch-Swinnerton-Dyer may be shorter than Mazur's own route.
    branch: arithmetic geometry
    entry_module: Challenge.Mazur
    proposers:
      - Kevin Buzzard
      - Vasily Ilin
    source:
      title: Modular curves and the Eisenstein ideal
      authors:
        - Barry Mazur
      doi: "10.1007/BF02684339"
      url: https://www.numdam.org/item/?id=PMIHES_1977__47__33_0
    license: Apache-2.0
    provenance: human
    status: open
    estimated_lines: 50000
    statements:
      - declaration: Challenge.Mazur.torsion_ncard_le
        informal: >-
          For every elliptic curve E over the rationals, the torsion subgroup of
          the group of rational points of E, viewed as a set, has at most 16
          elements. Set.ncard returns 0 on an infinite set, so the statement
          reads "at most 16, or infinite"; that is the form the FLT project
          assumes, since finiteness of the torsion subgroup is classical and far
          easier.
    tags:
      - elliptic-curves
      - torsion
      - modular-curves
      - flt-assumption
    msc:
      - "11G05"
      - "11G18"
  - slug: mckay-conjecture
    title: The McKay conjecture
    summary: >-
      Prove the McKay conjecture: for every finite group G, every prime p, and
      every Sylow p-subgroup P of G, the number of irreducible complex
      characters of G of degree not divisible by p equals the same count for
      the normalizer of P in G. Conjectured by McKay in 1972 and proved in
      full by Cabanes and Späth (Annals of Mathematics, 2026) by completing
      the Isaacs–Malle–Navarro programme: the conjecture reduces to the
      inductive McKay condition for quasisimple groups, whose verification
      rests on the classification of finite simple groups and on
      Deligne–Lusztig theory. Irreducible characters are counted as character
      functions of simple finite-dimensional complex representations, which
      identifies exactly the isomorphism classes. The line estimate is a
      guess at that programme — the character theory Mathlib is missing, the
      reduction theorem, the classification, and the case-by-case
      verification — not at any single write-up.
    branch: group theory
    entry_module: Challenge.McKay
    proposers:
      - Vasily Ilin
    source:
      title: The McKay Conjecture on character degrees
      authors:
        - Marc Cabanes
        - Britta Späth
      arxiv: "2410.20392"
      doi: "10.4007/annals.2026.203.3.5"
    license: Apache-2.0
    provenance: AI
    status: open
    estimated_lines: 1000000
    statements:
      - declaration: Challenge.McKay.card_pPrimeCharacters_eq
        informal: >-
          For every finite group G, every prime p, and every Sylow p-subgroup
          P of G, the set of character functions of simple finite-dimensional
          complex representations of G whose dimension p does not divide has
          the same cardinality as the corresponding set for the normalizer of
          P in G. Two simple representations have equal characters exactly
          when they are isomorphic, so both sets are in bijection with the
          sets Irr_p'(G) and Irr_p'(N_G(P)) that the McKay conjecture counts.
    tags:
      - group-theory
      - representation-theory
      - character-theory
      - mckay-conjecture
    msc:
      - "20C15"
      - "20D20"
  - slug: diameter-heptagon-e2-six-distances
    title: Six distances from the E2 diameter-heptagon pattern
    summary: >-
      Seven planar points of diameter 1 whose diameter graph is exactly the
      7-cycle {i, i+3 mod 7}, with boundary-edge pattern (C, B, B, C, A, A, A)
      and B < A < C, realize at least six distinct pairwise distances. This is
      the repaired E2 step of Theorem 4 of Wei-Li-Cong-Gao (2014), the result
      the classification of 11-point 5-distance sets (Wei, Ars Combin. 102,
      2011) depends on at m = 7 — a chain a line audit found to carry five
      omitted proofs. The published proof handles E2 by a value-swap appeal
      ("the proof is similar"); the audit found that on this pattern the
      intended strict comparison is an exact equality on a reachable
      configuration, so the published argument does not close the case. An
      exact computational repair — the seven undetermined diagonals collapse
      into three algebraic classes, one forced between the C-edge and the
      diameter, and every five-distance label assignment dies by a unit
      Gröbner ideal over the rationals — establishes the statement
      (certificates and audit: https://github.com/lyfar/erdos132-wei-certificates).
      The bound is sharp: the configuration family generically realizes seven
      distinct distances and drops to exactly six at three isolated
      configurations, never five. A Lean proof would put the repaired step of
      the E11(5) classification — which Marchetto's n = 11 and n = 12 results
      for Erdős #132 cite directly — on formal ground. The line estimate
      covers the diameter-graph structure theory (odd cycles of unit
      diameters, absent from Mathlib), the one-parameter reduction, and three
      polynomial-identity certificates.
    branch: discrete geometry
    entry_module: Challenge.WeiLiCongGao
    proposers:
      - Egor Lyfar
    source:
      title: Distance sets with diameter graph being cycle
      authors:
        - Xianglin Wei
        - Zhengyu Li
        - Meiqin Cong
        - Yan Gao
      doi: "10.11650/tjm.18.2014.4030"
      url: https://github.com/lyfar/erdos132-wei-certificates
    license: Apache-2.0
    provenance: AI
    status: open
    estimated_lines: 4000
    statements:
      - declaration: Challenge.WeiLiCongGao.e2_pattern_six_distances
        informal: >-
          Take seven points in the plane, indexed by i = 0..6, with all
          pairwise distances at most 1, such that the distance between points
          i and i+3 (mod 7) is exactly 1 for every i, and every other pair is
          at strictly smaller distance. Suppose the seven boundary edges
          d(i, i+1 mod 7) satisfy e0 = e3, e1 = e2, e4 = e5 = e6, and
          e1 < e4 < e0. Then the number of distinct values among the pairwise
          distances of the seven points is at least six.
    tags:
      - discrete-geometry
      - distance-sets
      - diameter-graph
      - erdos-132
    msc:
      - "52C10"
      - "05C62"
