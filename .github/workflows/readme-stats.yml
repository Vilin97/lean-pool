name: README stats

on:
  push:
    branches:
      - main
    # Run after every main update so an open generated PR stays current.
    # Its own merge starts one no-op run, which exits without another commit.
  workflow_dispatch:

concurrency:
  group: readme-stats
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: main
          # A PAT-authored branch update starts the pull-request workflows.
          # Updates made with GITHUB_TOKEN intentionally do not.
          token: ${{ secrets.REBASE_TOKEN }}

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true

      - name: Install dependencies
        run: cd python && uv sync --locked

      - name: Refresh README stats
        run: cd python && uv run python -m lean_pool.stats --repo ..

      - name: Publish a generated update PR
        id: publish
        env:
          BRANCH: automation/readme-stats
          GH_TOKEN: ${{ secrets.REBASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README stats already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "chore: refresh README stats"

          pushed=false
          for _ in 1 2 3; do
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git fetch origin "$BRANCH"
              remote_tip="$(git rev-parse FETCH_HEAD)"
              if git push --force-with-lease="refs/heads/$BRANCH:$remote_tip" \
                  origin "HEAD:$BRANCH"; then
                pushed=true
                break
              fi
            elif git push origin "HEAD:$BRANCH"; then
              pushed=true
              break
            fi
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Could not update the automation-owned $BRANCH branch."
            exit 1
          fi

          body="$(printf '%s\n' \
            'Automated refresh of the generated statistics in README.md.' \
            '' \
            'Generated by .github/workflows/readme-stats.yml.')"
          owner="${REPO%%/*}"
          number="$(gh api --method GET "repos/$REPO/pulls" \
            -f state=open -f head="$owner:$BRANCH" \
            --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh api --method PATCH "repos/$REPO/pulls/$number" \
              -f title='chore: refresh README stats' -f body="$body" >/dev/null
          else
            number="$(gh api --method POST "repos/$REPO/pulls" \
              -f base=main -f head="$BRANCH" \
              -f title='chore: refresh README stats' -f body="$body" \
              --jq .number)"
          fi
          {
            echo "changed=true"
            echo "number=$number"
          } >> "$GITHUB_OUTPUT"
          echo "Generated PR #$number." >> "$GITHUB_STEP_SUMMARY"

      - name: Merge after required checks pass
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REBASE_TOKEN }}
          NUMBER: ${{ steps.publish.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ready=false
          # The Build project gate appears only after its dependency jobs, so
          # poll merge state rather than assuming all contexts exist up front.
          for _ in $(seq 1 660); do
            read -r state checked_head < <(gh pr view "$NUMBER" --repo "$REPO" \
              --json headRefOid,mergeStateStatus \
              --jq '[.mergeStateStatus, .headRefOid] | join(" ")')
            case "$state" in
              CLEAN|UNSTABLE)
                if gh pr checks "$NUMBER" --repo "$REPO" --required; then
                  ready=true
                  break
                fi
                ;;
              DIRTY)
                echo "::error::Generated PR #$NUMBER conflicts with main."
                exit 1
                ;;
            esac
            sleep 15
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Required checks did not pass within 165 minutes."
            exit 1
          fi
          gh pr merge "$NUMBER" --repo "$REPO" --merge --delete-branch \
            --match-head-commit "$checked_head"
