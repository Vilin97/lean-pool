name: Cache Probe
# Temporary diagnostic: which run contexts allow Actions cache writes on
# this repo. Removed after use.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  default-read:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/cache-probe')
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe" > probe.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: probe.txt
          key: cache-probe-ic-default-${{ github.run_id }}
  actions-write:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/cache-probe')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - run: echo "probe" > probe.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: probe.txt
          key: cache-probe-ic-actionsw-${{ github.run_id }}
  checkout-pr-head:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/cache-probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2a844394c691a4738b46a2083b863fc9127db98d
          fetch-depth: 0
          persist-credentials: false
      - run: echo "probe" > probe.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: probe.txt
          key: cache-probe-ic-checkout-${{ github.run_id }}
