name: Claude auth check

# Verifies that CLAUDE_CODE_OAUTH_TOKEN still works, in about a minute.
#
# The token generated by `claude setup-token` expires. When it does, the only
# thing that breaks is the repair fan-out in mathlib-bump.yml -- `detect`,
# `pin`, `probe` and `triage` all keep passing, so the nightly bump looks
# healthy while its expensive half is silently dead. This canary makes that
# failure loud and cheap to diagnose: without it, the same answer costs a full
# probe build (~40 minutes) before the first repair job even starts.
#
# `show_full_output` is safe here and nowhere else in this repository: the
# prompt is trivial, no tools are allowed, and the job touches no secrets
# beyond the token itself, which the action masks. Never set it on a job that
# runs Bash -- these logs are public.

on:
  schedule:
    # Weekly, off-peak and off the hour.
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # The action exchanges an OIDC token unless `github_token` is supplied.
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    name: Verify the Claude subscription token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Ping Claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: "Reply with exactly: AUTH_OK"
          claude_args: >-
            --max-turns 1
            --model claude-sonnet-5

      - name: Report
        if: always()
        run: |
          echo "If the step above failed, regenerate the token with" \
            "\`claude setup-token\` and update the" \
            "CLAUDE_CODE_OAUTH_TOKEN repository secret." >> "$GITHUB_STEP_SUMMARY"
