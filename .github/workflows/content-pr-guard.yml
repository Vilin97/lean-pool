name: PR Separation Guard

# PRs must not mix pooled formalization content with repository infrastructure.
# Content files are:
#   - LeanPool.lean
#   - LeanPool/**/*.lean
#   - LeanPool/projects.yml
#   - Challenge/**/*.lean
#   - Challenge/challenges.yml
#   - Solution/**/*.lean
# Challenge statements and their solutions count as content: they are
# formalization material reviewed on their mathematics, and a PR that solves a
# challenge legitimately adds a pooled project alongside the registry flip.
# `Challenge.lean` and `Solution.lean` are neutral — generated indexes with no
# mathematics in them, which have to exist before anything can be added to
# those libraries — so they may accompany either category.
# One extra rule applies here: a PR may not edit a challenge statement and a
# solution together; see the check below.
# A PR may touch only content files, or only non-content files (.github/,
# python/, scripts/, docs, lakefile.toml, lean-toolchain, etc.). Mixing both
# categories fails this gate, except for Lean/lake version-bump metadata.
#
# Version-bump exemption: a Lean/Mathlib bump is inherently both content
# (LeanPool/**/*.lean API repairs) and infra (toolchain + manifest), and
# neither half builds without the other, so it cannot satisfy the split. A PR
# may therefore carry content alongside ONLY these bump files:
#   - lean-toolchain
#   - lake-manifest.json
#   - lakefile.toml
#   - docbuild/lean-toolchain
#   - docbuild/lake-manifest.json
#   - docbuild/lakefile.toml
#   - scripts/challenge/pins.env
#   - .github/workflows/content-pr-guard.yml
# (scripts/challenge/pins.env pins lean4export to this repository's
# toolchain, so a toolchain bump has to move it in the same PR.)
# Any other non-content file alongside content still fails the gate.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to guard (re-triggers the gate without a push)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # On a workflow_dispatch the pull_request context is empty, so fall back to
  # the input PR number; otherwise group by the live PR number as before.
  group: >-
    content-pr-guard-${{ github.event.pull_request.number ||
      inputs.pr_number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    name: Content / non-content separation
    steps:
      - name: Reject mixed content and non-content changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
          echo "Files changed in this PR:"
          printf '%s\n' "$files" | sed 's/^/  /'
          echo

          # Content: the pool index, any .lean under LeanPool/, Challenge/ or
          # Solution/, and the two registries.
          content_re='^(LeanPool\.lean|LeanPool/.+\.lean|LeanPool/projects\.yml|Challenge/.+\.lean|Challenge/challenges\.yml|Solution/.+\.lean)$'

          # Neutral: the generated indexes of the challenge libraries. They are
          # `lake exe mk_all` output with no mathematics in them, and the
          # libraries have to exist — with empty indexes — before any statement
          # can be added to them, so they may accompany either category.
          neutral_re='^(Challenge\.lean|Solution\.lean)$'
          files="$(printf '%s\n' "$files" | { grep -vE "$neutral_re" || true; })"

          # A solution PR may not edit the statement it claims to solve: the
          # merged statement is the text comparator judges against, and
          # changing it in the same PR is how a hard problem quietly becomes
          # an easy one. Land statement repairs separately.
          edited_statements="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | select(.status == "modified") | .filename' \
            | { grep -E '^Challenge/.+\.lean$' || true; })"
          touched_solutions="$(printf '%s\n' "$files" | { grep -E '^Solution/.+\.lean$' || true; })"
          if [ -n "$edited_statements" ] && [ -n "$touched_solutions" ]; then
            echo "::error::This PR edits a challenge statement and a solution together."
            echo "Statements are the text solutions are judged against; edit them in"
            echo "their own PR so the change is reviewed on its own terms."
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "::error file=$f::challenge statement modified alongside a solution"
            done <<< "$edited_statements"
            exit 1
          fi
          content="$(printf '%s\n' "$files" | { grep -E "$content_re" || true; })"
          non_content="$(printf '%s\n' "$files" | { grep -vE "$content_re" || true; })"

          if [ -n "$content" ] && [ -n "$non_content" ]; then
            bump_metadata_re='^(lean-toolchain|lakefile\.toml|lake-manifest\.json|docbuild/(lean-toolchain|lakefile\.toml|lake-manifest\.json)|scripts/challenge/pins\.env|\.github/workflows/content-pr-guard\.yml)$'
            non_bump_metadata="$(printf '%s\n' "$non_content" | { grep -vE "$bump_metadata_re" || true; })"
            bump_metadata="$(printf '%s\n' "$non_content" | { grep -E "$bump_metadata_re" || true; })"

            if [ -n "$bump_metadata" ] && [ -z "$non_bump_metadata" ]; then
              echo "✓ Content plus Lean/lake version-bump metadata."
              echo "Allowed bump metadata files:"
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                echo "  - $f"
              done <<< "$bump_metadata"
              exit 0
            fi

            echo "::error::This PR mixes content and non-content changes."
            echo "Content files may be changed only in content-only PRs:"
            echo "  - LeanPool.lean"
            echo "  - LeanPool/**/*.lean"
            echo "  - LeanPool/projects.yml"
            echo "  - Challenge/**/*.lean"
            echo "  - Challenge/challenges.yml"
            echo "  - Solution/**/*.lean"
            echo "(Challenge.lean and Solution.lean are generated indexes and"
            echo " may accompany either category.)"
            echo "(Exception: a version bump may also touch lean-toolchain,"
            echo " lake-manifest.json, and lakefile.toml.)"
            echo
            echo "Lean/lake bump PRs may additionally change only:"
            echo "  - lean-toolchain"
            echo "  - lakefile.toml"
            echo "  - lake-manifest.json"
            echo "  - docbuild/lean-toolchain"
            echo "  - docbuild/lakefile.toml"
            echo "  - docbuild/lake-manifest.json"
            echo "  - scripts/challenge/pins.env"
            echo
            echo "Content files in this PR:"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "  - $f"
            done <<< "$content"
            echo
            echo "Non-content files in this PR:"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "  - $f"
              echo "::error file=$f::mixed with LeanPool content; split content and non-content changes into separate PRs"
            done <<< "$non_bump_metadata"
            exit 1
          fi
          if [ -n "$content" ] && [ -n "$non_content" ]; then
            echo "✓ Version-bump PR: content alongside toolchain/manifest only."
          elif [ -n "$content" ]; then
            echo "✓ Content-only PR."
          else
            echo "✓ Non-content-only PR."
          fi
