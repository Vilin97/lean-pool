name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'LeanPool/projects.yml'
      - 'Challenge/challenges.yml'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'docbuild/**'
      - 'python/lean_pool/exposition/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.lean'
      - 'LeanPool/projects.yml'
      - 'Challenge/challenges.yml'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'docbuild/**'
      - 'python/lean_pool/exposition/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  # Runs in parallel with the doc-gen4 build; its (small) artifact is merged
  # into the Pages tree by the `build` job just before deployment. Restores
  # the same cache as `build` but never saves it — `build` owns cache writes.
  exposition:
    runs-on: ubuntu-latest
    name: Build exposition site
    steps:
      - name: Checkout project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore caches
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
            docbuild/.lake/build
          key: Docs-Lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json', 'LeanPool.lean') }}-${{ github.sha }}
          restore-keys: |
            Docs-Lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json', 'LeanPool.lean') }}-
            Docs-Lake-${{ runner.os }}-

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install Mathlib cache
        run: |
          if [ ! -d ".lake/packages/mathlib" ]; then
            ~/.elan/bin/lake exe cache get
          else
            echo "Mathlib already present from cache"
          fi

      - name: Build pool
        run: ~/.elan/bin/lake build LeanPool

      - name: Extract declarations
        # Per-project environments (see extract-all.sh); 2-way parallel to
        # stay inside the runner's memory.
        env:
          LEAN_CMD: /home/runner/.elan/bin/lean
          EXTRACT_JOBS: "2"
        run: >-
          ~/.elan/bin/lake env bash scripts/exposition/extract-all.sh
          exposition-dump.jsonl exposition-commands.jsonl

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true

      - name: Generate site
        run: |
          cd python
          uv sync --locked
          uv run python -m lean_pool.exposition \
            --dump ../exposition-dump.jsonl \
            --commands ../exposition-commands.jsonl \
            --repo-root .. \
            --out ../exposition-site \
            --commit ${{ github.sha }}

      - name: Upload exposition artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exposition-site
          path: exposition-site
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    name: Build doc-gen4 site
    steps:
      - name: Checkout project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore caches
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
            docbuild/.lake/build
          key: Docs-Lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json', 'LeanPool.lean') }}-${{ github.sha }}
          # The doc tree builds incrementally per module, so unchanged Mathlib
          # modules are reused from cache and only changed/new modules re-render.
          # Both PR and main fall back to the latest doc cache and build only the
          # delta, so adding a project no longer triggers a full Mathlib re-render
          # on main (the previous exact-key-only behaviour cost ~4h per merge).
          restore-keys: |
            Docs-Lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json', 'LeanPool.lean') }}-
            Docs-Lake-${{ runner.os }}-

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install Mathlib cache
        run: |
          if [ ! -d ".lake/packages/mathlib" ]; then
            ~/.elan/bin/lake exe cache get
          else
            echo "Mathlib already present from cache"
          fi

      # The challenge board is documented alongside the pool: each statement's
      # card carries the informal statement it is judged against, which is
      # worth reading on the docs site. `Solution:docs` is deliberately not
      # built — a solution restates its challenge's declarations under the same
      # names, so rendering both into one doc tree would produce two pages
      # claiming the same declaration.
      - name: Build documentation
        id: build
        run: cd docbuild && ~/.elan/bin/lake build LeanPool:docs Challenge:docs

      - name: Remove cached exposition
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: rm -rf docbuild/.lake/build/doc/exposition

      - name: Upload documentation artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-site
          path: docbuild/.lake/build/doc
          retention-days: 3

      - name: Save caches
        # Only persist the doc cache when the build step actually succeeded.
        # A cancelled or failed build (common when a merge train supersedes an
        # in-progress run) would otherwise save a partial .lake/build tree that
        # the next run restores via restore-keys, poisoning downstream builds.
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
            docbuild/.lake/build
          key: Docs-Lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'docbuild/lake-manifest.json', 'LeanPool.lean') }}-${{ github.sha }}

  # The two expensive sites build in parallel. Let the Actions dependency
  # graph join them instead of racing one job against a polling timeout.
  # If either build fails, no incomplete Pages tree replaces the live site.
  deploy:
    needs:
      - exposition
      - build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: documentation-site
          path: site

      - name: Download exposition artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exposition-site
          path: site/exposition

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
