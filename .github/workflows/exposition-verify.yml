name: Exposition Verify

# Compiles a minimal Lean file for every project card's main_declarations
# (the exposition's "Minimal Lean file" feature) and fails if any does not
# elaborate. Runs weekly, on demand, and on PRs touching the exposition
# pipeline — not on every content merge (the docs.yml exposition job stays
# fast; this is the correctness gate for the builder itself).

on:
  schedule:
    - cron: '40 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'python/lean_pool/exposition/**'
      - 'python/lean_pool/ci_artifacts.py'
      - 'scripts/exposition/**'
      - '.github/workflows/exposition-verify.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify minimal Lean files
    steps:
      - name: Checkout project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Match Lean Action CI's cache lookup exactly. This workflow only needs
      # compiled Lean artifacts; restoring doc-gen output here used to make a
      # broad fallback pull an incompatible cache after every toolchain bump.
      - name: Restore Lean dependencies
        id: dependency-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.elan
            .lake/packages
          key: LeanDependencies-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Restore pool build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .lake/build
          key: LeanPoolBuild-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            LeanPoolBuild-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install Mathlib cache
        run: |
          set -euo pipefail
          ~/.elan/bin/lake exe cache get
          expected=$(jq -r '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)
          actual=$(git -C .lake/packages/mathlib rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Mathlib checkout $actual does not match lake-manifest.json ($expected)."
            exit 1
          fi

      - name: Reuse matching Lean CI build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_EVENT: ${{ github.event_name }}
        run: >-
          PYTHONPATH=python python3 -m lean_pool.ci_artifacts restore
          --head "$BUILD_HEAD" --event "$BUILD_EVENT"

      - name: Build pool
        run: ~/.elan/bin/lake build LeanPool

      - name: Build Mathlib aggregate
        run: ~/.elan/bin/lake build Mathlib

      - name: Restore project extraction cache
        id: extraction-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .lake/exposition-cache/v1
          key: Exposition-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'scripts/exposition/**', 'python/lean_pool/exposition/extract.py', 'python/lean_pool/exposition/source_text.py') }}-${{ github.sha }}
          restore-keys: |
            Exposition-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'scripts/exposition/**', 'python/lean_pool/exposition/extract.py', 'python/lean_pool/exposition/source_text.py') }}-

      - name: Extract declarations
        env:
          LEAN_CMD: /home/runner/.elan/bin/lean
          EXTRACT_JOBS: "2"
        run: >-
          ~/.elan/bin/lake env bash scripts/exposition/extract-all.sh
          exposition-dump.jsonl exposition-commands.jsonl

      - name: Save project extraction cache
        if: steps.extraction-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .lake/exposition-cache/v1
          key: ${{ steps.extraction-cache.outputs.cache-primary-key }}

      - name: Upload extraction timings and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exposition-extraction-diagnostics
          path: |
            .lake/exposition-timings.json
            .lake/exposition-cache/v1/**/extract.log
            .lake/exposition-cache/v1/**/failed.log
          include-hidden-files: true
          retention-days: 7

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true

      - name: Generate site data
        run: |
          cd python
          uv sync --locked
          uv run python -m lean_pool.exposition \
            --dump ../exposition-dump.jsonl \
            --commands ../exposition-commands.jsonl \
            --repo-root .. \
            --out ../exposition-site \
            --commit ${{ github.sha }}

      - name: Verify minimal files
        run: |
          # `lake env` must run from the workspace root; from python/ it
          # resolves no workspace and hands `lean` an empty LEAN_PATH, which
          # fails every target at `import Mathlib`.
          LEAN_PATH="$(~/.elan/bin/lake env printenv LEAN_PATH)"
          export LEAN_PATH
          cd python
          uv run python -m lean_pool.exposition.verify \
            --site ../exposition-site \
            --repo-root .. \
            --out ../exposition-verify \
            --jobs 2 \
            --lean /home/runner/.elan/bin/lean \
            --baseline 214

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exposition-verify-report
          path: |
            exposition-verify/report.json
          retention-days: 30
