      - declaration: QuadraticOrder.prime_inert_iff
        informal: Proves that for an odd rational prime p and a valid discriminant d, the ideal (p) is maximal in the quadratic order O_d exactly when the Legendre symbol (d/p) is -1.
        source_ref: "C. Geiger, Singular Moduli and the Ideal Class Group, Section 3.2, Proposition 3.2.1."
      - declaration: QuadraticOrder.prime_ramified_iff
        informal: Proves that for an odd rational prime p and a valid discriminant d, the ideal (p) is not radical in O_d exactly when p divides d.
