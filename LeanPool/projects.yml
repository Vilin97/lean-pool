    summary: >-
      Formalizes the planar Hopf--Pannwitz diameter bound and proves the
      fourteen-point low-multiplicity conclusion conditional on exactly two
      remaining published interfaces: the known maximum-cardinality bound for
      planar sets with at most six distances and the Szöllősi--Östergård
