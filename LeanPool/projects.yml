  - slug: erdos-97-convex-octagon
    title: The Convex-Octagon Case of Erdős Problem 97
    summary: >-
      Proves that among eight labelled points in the Euclidean plane in convex position, at least
      one point has no four other points at a common distance. The development reduces a geometric
      counterexample to a finite incidence model, classifies normalized row patterns up to symmetry,
      proves geometric and algebraic obstructions, and excludes seven canonical first-row masks with
      a kernel-audited exhaustive search over the remaining legal row masks and checked geometric
      obstruction witnesses. This is the modern four-equidistant formulation; Erdős's 1946 paper
      posed the stronger three-equidistant version. This is the convex-octagon case only; the
      general Erdős Problem 97 remains open.
