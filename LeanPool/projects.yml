  - slug: erdos132-convex-k3
    title: Convex Three-Distance Degree-Six Theorem and Exceptional-Word Closures
    summary: >-
      Proves that every finite cyclically strictly convex planar configuration
      has a vertex incident to at most six edges from its three largest
      distance classes. The proof selects a maximal-gap vertex and coordinated
      majorants, closes all exceptional inner branches, performs the five-row
      enumeration, and transports all thirteen canonical cover words to four
      shared full-two-rung, anti-saturation, terminal-cage, and four-edge-cage
      predicates. It also proves exceptional-count rigidity and an explicit
      heptagon refutation of a tempting stronger majorant claim, with rational
      regression witnesses. This settles the all-n k=3 instance of the paper's
      suggested degree-2k convex bound; Morić--Pritchard proved the corresponding
      top-three edge bound for sufficiently large n. It does not settle the
      general-k suggestion or the general Erdős problem 132.
    branch: discrete geometry
    entry_module: LeanPool.Erdos132ConvexK3
    authors:
      - Egor Lyfar
    source:
      title: On the Graph of Large Distances
      authors:
