  - slug: moser-lattice-colorings
    title: Geometric Four-Colorings of the Moser Lattice and Ring
    summary: >-
      Formalizes the two explicit parity colorings from Dúcz's 2026 note on the
      Moser lattice. The development derives the exact quadratic norm formula,
      proves that the integer-coordinate embedding is faithful, proves both
      colorings proper and geometric on the entire lattice, and descends them
      through localization by powers of three to the Moser ring. As a structural
      corollary, every unit-distance graph realized entirely in the Moser ring is
      four-colorable. The uniqueness classification of geometric four-colorings
      and the chromatic number of the full Euclidean plane are not claimed.
