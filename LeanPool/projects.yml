        informal: Proves uniqueness of the minimal replay of a log - any two minimal replays compatible with the log reach the same configuration.
      - declaration: EventStructures.Trace.TraceMonoid
        informal: Defines the trace monoid as lists of events quotiented by the congruence generated by swapping adjacent concurrent events; paths in the configuration graph are quotiented by the same trace equivalence to form asynchronous paths.
