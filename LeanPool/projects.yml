  - slug: distance-geometry
    title: Euclidean Distance Geometry
    summary: >-
      Develops the basepoint-centered Gram approach to finite Euclidean distance geometry.
      Proves both directions of Schoenberg's characterization, including a
      rank-controlled factorization of positive-semidefinite matrices; proves that
      three affinely independent centers in Euclidean three-space determine at most
      two points with prescribed distances; and verifies the Cayley--Menger
