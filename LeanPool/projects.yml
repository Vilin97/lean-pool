  - slug: stationary-harmonic-maps
    title: Monotonicity Formula for Stationary Harmonic Maps
    summary: >-
      Formalizes the monotonicity formula for stationary `W^{1,2}_{loc}` maps with Euclidean
      target. The proof is target independent: it uses only the displayed weak gradient and a
      vanishing domain first variation, so no target-manifold structure enters the argument.
      From a bundled stationary Sobolev witness `StationaryW12LocMap u Omega` it proves, for
      `0 < s <= r < R0`, that the normalized energy `Theta(Du, a, rho) = rho^(2-n) * integral
      over B(a, rho) of |Du|^2` is monotone: `weakTheta Du a s <= weakTheta Du a r`, together
      with the exact increment formula `weakTheta Du a r - weakTheta Du a s = weakMonotonicityRhs
      Du a s r`. The Sobolev layer is project-defined from Mathlib's `MemLp`, weak-derivative
      identities, Bochner integration, and Euclidean measure theory, following the De
      Giorgi-Nash-Moser engineering choice; the internal proof routes through a radial
      vector-field first variation, a coarea/Radon-Nikodym radius representation, smooth radial
      cutoffs, and an absolute-continuity boundary step.
    branch: analysis
    entry_module: LeanPool.LeanStationaryHarmonicMaps
    authors:
      - Wei Wang
    source:
      title: "Theorems on Regularity and Singularity of Energy Minimizing Maps"
      authors:
