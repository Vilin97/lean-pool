      - declaration: EventStructures.Rollback.rollback_correctness_finite
        informal: Proves that the original configuration is reachable from the rollback of an event when the configuration is finitely representable.
        source_ref: "Causal-consistent reversibility in the sense of V. Danos, J. Krivine, Reversible communicating systems, CONCUR 2004, LNCS 3170, Springer, 2004, 292-307, doi:10.1007/978-3-540-28644-8_19."
      - declaration: EventStructures.Rollback.rollback_causal_safety
        informal: Proves causal safety of rollback - events causally after the rolled-back event are removed.
