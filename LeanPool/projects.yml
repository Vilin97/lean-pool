  - slug: compact-spectral
    title: Spectral theorem for compact self-adjoint operators
    summary: >-
      Formalizes the spectral theorem for compact self-adjoint operators on a Hilbert space: such
      an operator admits a Hilbert basis of eigenvectors. The development passes from weak
      compactness of Hilbert closed balls and Rayleigh-quotient extrema to an eigenvector at the
      operator norm, finiteness of the point spectrum outside any neighbourhood of zero, finite-rank
      cutoff approximation, and finally the orthogonal decomposition into eigenspaces.
    branch: functional analysis
    entry_module: LeanPool.CompactSpectral
    authors:
      - Adam Benenson
    source:
      title: Advanced Real Analysis
      authors:
        - Anthony W. Knapp
      doi: "10.3792/euclid/9781429799911-2"
      github_repo: abenenson/compact-spectral
