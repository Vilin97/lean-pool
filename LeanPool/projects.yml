      - declaration: QuadraticOrder.cardSqrts_prime_pow_even_val
        informal: Counts roots of x^2 = p^(2r) u modulo p^n for odd prime p, p not dividing u, and 2r < n, reducing to the coprime case and multiplying by p^r.
