      - declaration: QuadraticOrder.prime_split_iff
        informal: Proves that for an odd rational prime p and a valid discriminant d, the ideal (p) is radical but not maximal exactly when the Legendre symbol (d/p) is 1.
        source_ref: "C. Geiger, Singular Moduli and the Ideal Class Group, Section 3.2, Proposition 3.2.1."
      - declaration: QuadraticOrder.cardSqrts_prime_pow_coprime
        informal: Counts roots of x^2 = c modulo p^n for odd prime p and p not dividing c, giving two roots when the Legendre symbol is 1 and none otherwise.
