    summary: Formalizes coinductive interaction trees as the M-type of a polynomial functor (via Mathlib QPFs), proving the lawful functor and monad structure, a bisimulation equality coinciding with propositional equality, and iteration and effect-handler interpretation combinators, supported by a vendored parameterized-coinduction (Paco) library.
