      - "11K06"
  - slug: sundogcert
    title: Sundog certificates
    summary: >-
      A referee-free, axiom-clean Lean development of coding-theory certificates: syndrome
      decoding soundness and lossiness bounds for GF(2) parity-check schemes (with a
      Reed–Solomon evaluation-dual variant), and a fully machine-checked correctness proof of
