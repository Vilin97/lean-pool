  - slug: channel-capacity
    title: Uniqueness of Shannon Capacity-Achieving Priors
    summary: >-
      Formalizes uniqueness of the capacity-achieving input distribution for a
      Markov-kernel channel in three aligned layers: a finite-alphabet theorem
      (compactness, continuity, and strict concavity of mutual information on
      Mathlib's weak topology for `ProbabilityMeasure`), a concrete discharged
      theorem for compact-Polish channels with a common strictly positive
      jointly continuous density, and a general measure-theoretic packaging that
      isolates the abstract well-conditioning hypotheses, plus a counterexample
      showing pairwise-distinct rows do not give an injective prior pushforward
      (the non-degeneracy required for uniqueness).
