    summary: >-
      Formalizes the repaired E2 case in the diameter-seven-cycle analysis of
      Wei, Li, Cong, and Gao. Seven planar points whose unit-distance diameter
      graph is the step-three 7-cycle and whose boundary edges have ordered
      classes B < A < C realize at least six distinct pairwise distances. The
