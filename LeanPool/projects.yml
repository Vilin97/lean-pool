  - slug: chudnovsky
    title: A Detailed Proof of the Chudnovsky Formula
    summary: >-
      Formalizes the Chudnovsky brothers' rapidly convergent series for 1/π,
      proving Mathlib's `chudnovskySum = π⁻¹`. Follows Milla's elementary
      complex-analytic proof: Weierstrass and Eisenstein theory, Liouville and
      parallelogram-residue calculus, the Kummer hypergeometric bridge and the
      main modular identity relating the j-invariant to the lattice periods,
      Baker's division-value machinery, and the singular-moduli inputs at the CM
      point τ = (1 + √-163)/2 — integrality of j(τ) via modular polynomials and
      Kronecker's congruence, and rationality of the Weierstrass s₂ invariant
      via Masser's Appendix A.1.
