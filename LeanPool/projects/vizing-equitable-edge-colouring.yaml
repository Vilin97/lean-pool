slug: vizing-equitable-edge-colouring
title: Vizing's theorem and equitable edge colourings
summary: Proves the maximum-degree-plus-one edge-colouring bound for finite simple graphs by fans and
  Kempe exchanges. A separate component-swapping argument equitably rebalances any finite proper edge
  colouring on its original palette. Together they give equitable proper edge colourings on any palette
  of at least maximum degree plus one colours, with every class bounded by the ceiling of the average
  class size. Extracted from the published Paper IV formalization; these are classical colouring results,
  not a claim to new mathematics or to the paper's clique-partition bound.
