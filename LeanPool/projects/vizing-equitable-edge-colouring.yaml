main_results:
- declaration: LeanPool.Vizing.lineGraph_colorable
  informal: The line graph of a finite simple graph G is colourable with maximum degree of G plus one
    colours.
  source_ref: Vizing's theorem for finite simple graphs; Vizing (1964).
- declaration: SimpleGraph.lineGraph_chromaticNumber_le_maxDegree_succ
  informal: The chromatic number of the line graph of a finite simple graph G is at most maximum degree
    of G plus one.
- declaration: LeanPool.Vizing.Equitable.exists_equitable_colouring
  informal: Every proper edge colouring of a finite simple graph with a finite palette admits a proper
    recolouring on the same palette in which any two colour classes differ in size by at most one.
- declaration: LeanPool.Vizing.exists_equitable_edge_colouring
  informal: For every finite simple graph G and natural c at least maximum degree of G plus one, there
    is an equitable proper edge colouring with c colours; each colour class has at most ceiling(|E(G)|/c)
    edges.
