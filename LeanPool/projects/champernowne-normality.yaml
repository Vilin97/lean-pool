slug: champernowne-normality
title: Champernowne normality in every base
summary: 'Proves that concatenating the base-b digits of the positive integers gives a normal digit sequence
  for every integer base b at least 2: every nonempty length-k word of digits below b has limiting frequency
  b^(-k). This is a discrete, all-base generalization of D. G. Champernowne''s 1933 base-ten result, without
  a real-number expansion bridge. Includes reusable substring-counting inequalities, a digit-string equivalence,
  exact cohort counts, and quantitative prefix bounds used to establish the frequency limit.'
