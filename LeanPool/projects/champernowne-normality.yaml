main_results:
- declaration: Champernowne.champernowne_normal
  informal: 'For every integer base b at least 2, the sequence formed by concatenating the base-b digits
    of 1, 2, 3, and so on is normal: each nonempty word w of digits below b has limiting occurrence frequency
    1 / b^(length w), counting overlapping occurrences.'
- declaration: Champernowne.champernowne_normal_ten
  informal: The decimal digit sequence 123456789101112... is normal in base ten.
- declaration: Champernowne.sum_countOccurrences_cohort
  informal: For a nonempty length-k word of base-b digits with nonzero first digit and k at most m, its
    total occurrences inside all m-digit positive integers equal b^(m-k) + (m-k)(b-1)b^(m-k-1), with natural
    subtraction in the exponents.
- declaration: Champernowne.sum_countOccurrences_cohort_zero
  informal: For a nonempty length-k word of base-b digits starting with zero and k at most m, its total
    occurrences inside all m-digit positive integers equal (m-k)(b-1)b^(m-k-1), with natural subtraction
    in the exponent.
