main_results:
- declaration: genus_eq_zero_iff_homeo
  informal: A compact connected Riemann surface has genus zero if and only if it is homeomorphic to the
    2-sphere.
- declaration: Jacobian.ofCurve_inj
  informal: 'The Abel-Jacobi map of a compact Riemann surface of positive genus is injective: two points
    with the same image coincide.'
- declaration: Jacobian.pushforward_pullback
  informal: For a non-constant holomorphic map between compact Riemann surfaces, the pushforward composed
    with the pullback on Jacobians is multiplication by the degree of the map.
