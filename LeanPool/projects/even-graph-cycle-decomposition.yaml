main_results:
- declaration: Finset.exists_cycleDecomp
  informal: Every finite loopless edge set whose degree is even at every vertex is the edge-disjoint union
    of simple cycles of length at least three.
- declaration: Finset.exists_edge_pairing_of_even
  informal: If every vertex has even degree, then the incident edges at every vertex admit a simultaneous
    fixed-point-free involutive pairing.
