main_results:
- declaration: ThreeGap.EuclideanRecords.sharp_attained
  informal: Exhibits a base point on the 2-torus with an irrational coordinate and an N whose Euclidean
    nearest-neighbour distances realize exactly five distinct values, showing the Euclidean five-distance
    bound is sharp.
  source_ref: A. Haynes and J. Marklof, A five distance theorem for Kronecker sequences, International
    Mathematics Research Notices 2022(24):19747-19789, doi:10.1093/imrn/rnab205, arXiv:2009.08444.
- declaration: ThreeGap.LinftyRecords.sharp_attained
  informal: Exhibits a base point on the 2-torus with an irrational coordinate and an N whose sup-norm
    nearest-neighbour distances realize exactly five distinct values, showing the sup-norm gap bound is
    sharp in dimension two.
- declaration: ThreeGap.LinftyRecords3.nine_attained
  informal: Exhibits a base point on the 3-torus with an irrational coordinate and an N whose sup-norm
    nearest-neighbour distances realize at least nine distinct values, showing the sup-norm gap bound
    is sharp in dimension three.
