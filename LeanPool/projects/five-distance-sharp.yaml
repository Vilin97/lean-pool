slug: five-distance-sharp
title: Sharp Five-Distance and Sup-Norm Gap Theorems
summary: 'Formalizes sharp gap theorems for Kronecker sequences on tori: the Euclidean five-distance theorem
  on the 2-torus and the sup-norm gap bound, together with explicit arithmetic witnesses realizing the
  extremal cases - five distinct nearest-neighbour distances for the Euclidean and sup-norm metrics in
  dimension two, and nine distinct sup-norm distances in dimension three (Haynes-Marklof-Ramirez), via
  exact modular arithmetic on best simultaneous Diophantine approximations.'
branch: number theory
