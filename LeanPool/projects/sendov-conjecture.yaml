slug: sendov-conjecture
title: Sendov's conjecture and the Phelps–Rodriguez conjecture
summary: 'Proves Sendov''s conjecture in full generality: if every zero of a complex polynomial of degree
  at least two lies in the closed unit disk, then every zero has a critical point within distance one.
  Also proves the Phelps–Rodriguez strengthening, with strict inequality unless the zero lies on the unit
  circle and the polynomial is a scalar multiple of z^n - a^n, and recovers Rubinstein''s boundary theorem.
  Formalizes Tao''s digestion of Lech Mazur''s proof: the problem is reduced to a numerical inequality
  in the degree and one real parameter, settled by exact rational Bernstein certificates for degrees up
  to one hundred and by an analytic large-degree reduction beyond. Includes the top case of Maclaurin''s
  inequality and multiset AM–GM, a defect inequality on the closed unit disk, a sharp bound on log(sinh
  h / h), kernel-checked polynomial certificate infrastructure, and a packed-exponentiation bridge for
  exact moment integrals.'
