slug: stallings-folding
title: Verified Stallings folding for finitely generated subgroups of F2
summary: Constructs a finite inverse automaton recognizing the subgroup generated by any finite list of
  signed words in the rank-two free group. Proves exact subgroup preservation and correctness of canonical
  reduced-word membership testing. Reusable infrastructure includes inverse-automaton walks, reduction-compatible
  traversal, finite fold congruences, coset potentials, flower graphs, and basis roses. Folding uses exhaustive
  finite search over Boolean relations; no complexity bound, core pruning, subgroup basis, intersection,
  or index algorithm is claimed.
branch: computational group theory
entry_module: LeanPool.StallingsFolding
