main_results:
- declaration: Stallings.folded_recognizer_exists
  informal: For every finite list S of signed words on two generators, there exist a finite type of states,
    a base state, and a partial transition table with inverse-labelled reverse edges, such that traversing
    the canonical reduced word of any g in FreeGroup (Fin 2) returns to the base exactly when g lies in
    the subgroup generated by the word values in S. The witness is the computed flower-graph fold.
  source_ref: Upstream Solution.lean, completeStatement and folded_recognizer_exists.
- declaration: Stallings.foldWords_loopSubgroup_eq_generatorSubgroup
  informal: For every finite input list of signed words in the rank-two free group, the based-loop subgroup
    of the computed folded flower graph equals the subgroup generated by the input words.
  source_ref: Upstream Stallings/Flower.lean.
- declaration: Stallings.foldedMembershipTest_eq_true_iff
  informal: For any finite generating list S and any rank-two free-group element g, the executable folded-automaton
    test returns true if and only if g belongs to the subgroup generated by S. There is no efficiency
    guarantee for constructing the automaton.
  source_ref: Upstream Stallings/Flower.lean.
