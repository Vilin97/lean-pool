  mathematical_source: John R. Stallings, Topology of Finite Graphs, Inventiones Mathematicae 71 (1983),
    551-565, doi:10.1007/BF02095993. This is the rank-two finite-recognizer special case, implemented
    through least congruences rather than a sequence of local folds.
  background: Ilya Kapovich and Alexei Myasnikov, Stallings Foldings and Subgroups of Free Groups, Journal
    of Algebra 248 (2002), 608-668, doi:10.1006/jabr.2001.9033.
  scope: All four Stallings library modules and the proved finite-recognizer endpoint from Solution.lean.
    The standalone challenge placeholder, statement-audit tooling, and CI files are omitted. Mathlib is
    the only dependency.
  port_extensions: Flower vertices now contain exactly the internal positions of each word, instead of
    padding all words to a common maximum length. The new Restriction module proves preservation when
    folding an edge-closed finite vertex set containing the basepoint; its potential is required only
    on the selected set. These AI-assisted port extensions are not attributed to the upstream release.
  provenance_note: Upstream formalization.yaml records human-directed GPT-6 Codex proof development. Lean
    Pool porting, cleanup, and optimization were also performed by OpenAI Codex. Author attribution follows
    upstream.
