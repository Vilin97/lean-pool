main_results:
- declaration: LehmerE10.main_theorem
  informal: Lehmer's polynomial L(x) = x^10 + x^9 - x^7 - x^6 - x^5 - x^4 - x^3 + x + 1 is irreducible
    over the integers, and the characteristic polynomial of a Coxeter element of the E10 Weyl group equals
    L.
- declaration: LehmerE10.lehmer_mahlerMeasure
  informal: The Mahler measure of L equals its Salem root mu, with the unconditional bounds 1 < M(L) <
    7/5.
