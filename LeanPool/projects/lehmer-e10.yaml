slug: lehmer-e10
title: Lehmer's Polynomial and the E10 Coxeter Element
summary: 'Proves that Lehmer''s degree-10 polynomial — the integer polynomial of smallest known Mahler
  measure above 1 — is irreducible over the integers, and that it is the characteristic polynomial of
  a Coxeter element of the E10 Weyl group (the rank-10 instance of McMullen). Against Mathlib''s Mahler-measure
  API it computes M(L) exactly as the Salem root with the unconditional bounds 1 < M(L) < 7/5, states
  Lehmer''s conjecture as a defined Prop (never assumed) with the strong form implying the gap form, and
  contrasts the E8 Coxeter element (order exactly 30) with the E10 element (infinite order in GL(10,Z)):
  the E-series crosses from torsion to a Salem matrix at rank 10, and the crossing value is Lehmer''s
  number.'
branch: number theory
