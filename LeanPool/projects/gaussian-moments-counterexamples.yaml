  announcement: https://github.com/long-mathematics/gaussian-moments-counterexamples/pull/2
  completion_date: '2026-09-17T15:47:31Z'
  notes: Imports the completed Gaussian core and related moment infrastructure. The July manuscript predates
    the September Lean proof release. Five and six term counts refer to the natural complex coordinates;
    total degrees four and three also hold in the original real coordinates. The separate Jacobian-map
    and route-arithmetic files are excluded. No general inversion, Jacobian-reduction route, or resolution
    of the two-dimensional conjecture is claimed. Upstream MIT notice is retained in the project entry
    module. Upstream Lean authorship is inferred from the public codex/lean-formalization branch; its
    exact proof-authoring model and extent of human editing are unreported. This port and optimization
    are Codex-authored.
