main_results:
- declaration: GaussianMomentsCounterexamples.not_GMC_of_three_le
  informal: 'For every n at least three, the Gaussian Moments Conjecture fails: some complex polynomial
    has all positive pure Gaussian moments zero, while a polynomial multiplier prevents eventual mixed-moment
    vanishing.'
- declaration: GaussianMomentsCounterexamples.master_three
  informal: For every complex univariate polynomial A and positive m, the expectation of A(Q3) times P3
    to power m equals m! times the degree-m coefficient of A(X) times (1+X) to power m-1. The explicit
    P3 has degree four and five terms in its natural complex coordinates.
- declaration: GaussianMomentsCounterexamples.master_four
  informal: The analogous arbitrary-A coefficient identity for the explicit four-variable polynomial P4,
    of degree three and six terms in its natural complex coordinates, gives an independent counterexample.
