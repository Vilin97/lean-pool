slug: gaussian-moments-counterexamples
title: Gaussian Moments Conjecture counterexamples
summary: Proves explicit complex polynomial counterexamples to the Gaussian Moments Conjecture in every
  dimension at least three, using genuine expectations under finite products of standard real Gaussian
  measures. Retains reusable polynomial integrability, Stein identities, complex contractions, coefficient
  formulas, injective-coordinate marginals, and related moment results.
branch: probability and polynomial algebra
