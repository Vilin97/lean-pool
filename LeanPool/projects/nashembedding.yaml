slug: nashembedding
title: Nash's smooth isometric embedding theorem
summary: 'A Lean 4 / Mathlib formalization of Nash''s C^∞ isometric embedding theorem for closed manifolds:
  every compact smooth manifold without boundary, equipped with a smooth Riemannian metric, admits a smooth
  injective map into some Euclidean space ℝ^q whose differential pulls the Euclidean inner product back
  to the given metric. The proof formalized is Günther''s (1989), which replaces the Nash-Moser iteration
  by an elliptic fixed-point argument, following the presentation in A. J. Wassermann''s Cambridge Part
  III lecture notes as the primary source. The development has two layers. The first proves the theorem
  for the flat torus: a self-contained Sobolev toolkit on 𝕋ⁿ (weighted ℓ² Sobolev spaces on ℤⁿ, Rellich
  compactness, the Sobolev sup bound, three multiplication theorems, mollifiers, periodization, Fourier
  inversion and Parseval), the approximation of smooth metrics by realizable ones, Günther''s perturbation
  theorem proved by a contraction in Hˢ, and their assembly into the statement that every smooth 2π-periodic
  positive-definite matrix field on ℝⁿ is the pullback metric of a smooth periodic immersion that is injective
  modulo 2πℤⁿ. The second layer reduces the closed-manifold case to the torus: a Whitney embedding from
  Mathlib is extended to the ambient space, the metric is extended by a pseudo-inverse construction, cut
  off, symmetrized and periodized, and the torus theorem is applied. No bound on the embedding dimension
  is claimed. Concrete instances (round spheres of every dimension, products of spheres, the flat torus
  𝕊¹ × 𝕊¹) are derived, and the flat-torus instance is shown to reproduce the torus theorem''s conclusion,
  tying the two layers together. Nothing here is claimed to be new.'
