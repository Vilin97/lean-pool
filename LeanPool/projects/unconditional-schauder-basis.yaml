main_results:
- declaration: UnconditionalCriterion.exists_unconditionalSchauderBasis_of_finiteSignBound
  informal: 'Finite sign criterion for sequences: if `x : ℕ → E` has dense closed linear span, every `x
    n` is nonzero, and finite sign changes are uniformly bounded by `C`, then `x` is the basis sequence
    of an unconditional Schauder basis.'
  source_ref: J. Lindenstrauss and L. Tzafriri, Classical Banach Spaces I and II, Chapter 1, Section c,
    unconditional bases, doi:10.1007/978-3-662-53294-2.
- declaration: UnconditionalCriterion.exists_unconditionalSchauderBasisAbstractIndex_of_finiteSignBound
  informal: 'Abstract-index form of the finite sign criterion: under the same dense span, nonzero, and
    uniform finite sign bound hypotheses for an arbitrarily indexed family, there is an abstractly indexed
    unconditional Schauder basis whose basis family is exactly `x`.'
  source_ref: J. Lindenstrauss and L. Tzafriri, Classical Banach Spaces I and II, Chapter 1, Section c,
    unconditional bases, doi:10.1007/978-3-662-53294-2.
