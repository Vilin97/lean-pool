slug: unconditional-schauder-basis
title: Unconditional Schauder Bases
summary: 'Develops an API for Schauder bases and unconditional Schauder bases of complete normed spaces,
  including ordered partial-sum convergence, rearrangement criteria for unconditionality, and an arbitrary-index
  variant built on unconditional summability, then proves a finite sign criterion: a family with dense
  closed span, nonzero vectors, and a uniform finite sign bound is the basis of an unconditional Schauder
  basis.'
