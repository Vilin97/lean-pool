slug: local-complex-geometry
title: Foundational local complex-analytic geometry
summary: 'Develops a common Lean foundation for several classical local theorems in several complex variables:
  complex-analytic Weierstrass preparation with full germ uniqueness, Noetherianity of holomorphic-germ
  rings, finite projection for hypersurface germs, the holomorphic constant-rank normal form, and the
  finite-family local analytic Nullstellensatz. The imported development also exposes the arbitrary-ideal
  Nullstellensatz and regular level-set, submersion, and immersion consequences.'
