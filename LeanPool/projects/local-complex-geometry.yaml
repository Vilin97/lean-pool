main_results:
- declaration: LocalComplexGeometry.localAnalyticNullstellensatz
  informal: If a finite family of functions analytic at the origin has common zero set locally contained
    in the zero set of another analytic function, then a positive power of the latter is locally an analytic
    linear combination of the family.
- declaration: LocalComplexGeometry.holomorphicGerm_isNoetherian
  informal: For every finite complex dimension, including dimension zero, the local ring of holomorphic
    germs at the origin is Noetherian.
- declaration: LocalComplexGeometry.hypersurface_finiteProjection
  informal: A nonzero hypersurface germ vanishing at the origin admits a linear coordinate change whose
    local quotient is finite free over the base germ ring, together with an explicit prepared equation
    and a proper, surjective finite-fiber projection of the local zero set.
- declaration: LocalComplexGeometry.holomorphic_constantRank_normalForm
  informal: An analytic map of locally constant complex rank is locally equivalent, through analytic source
    and target coordinates, to the standard rank projection.
- declaration: ClassicalComplexWPT.classicalComplexWeierstrassPreparation
  informal: A complex-analytic germ of exact order in one distinguished variable factors uniquely into
    a nonvanishing analytic unit and a monic Weierstrass polynomial whose analytic coefficient germs vanish
    at the origin.
  source_ref: BochaoKong/classical-complex-wpt, commit b4a7273fe5c9752753c52e10494097569089642d (2026-08-28).
- declaration: LocalComplexGeometry.analyticNullstellensatz_ideal
  informal: For every ideal of the local holomorphic-germ ring, the ideal of germs vanishing on its local
    zero set equals its radical.
- declaration: LocalComplexGeometry.holomorphic_regularLevelSet_parametrization
  informal: Near a regular point, the level set of a holomorphic map admits an analytic parametrization
    with an analytic local inverse on the level set.
