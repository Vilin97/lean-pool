main_results:
- declaration: TriangleInflation.Graph.classification_NW
  informal: For finite binary pair-source graphs without isolated vertices, some finite order of the Navascués–Wolfe
    hierarchy characterizes compatibility with finite latent alphabets exactly for double-star forests;
    order two suffices there.
- declaration: TriangleInflation.no_finite_characterizing_orderM
  informal: At every positive inflation order, a triangle law passes both the AI and NW tests but has
    no compatible model over any measurable latent probability spaces.
