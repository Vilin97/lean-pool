slug: inflation-termination
title: Inflation termination for classical pair-source networks
summary: 'For finite binary pair-source networks without isolated vertices, classifies when the inflation
  hierarchy characterizes compatibility with finite latent alphabets: precisely forests of double stars,
  where order two suffices. Also proves triangle nontermination for arbitrary measurable latent probability
  spaces, quantitative obstructions, finite and measurable Finner inequalities, and graph witnesses.'
