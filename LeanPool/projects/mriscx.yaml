slug: mriscx
title: MRiscX
summary: A Hoare logic for verifying unstructured RISC-V-like assembly in Lean, following Lundberg et
  al. (SEFM 2020), with a certified interpreter, proved structural Hoare rules, per-instruction specifications,
  custom elaborators and tactics, and a complete One-Time-Pad correctness proof.
branch: program verification
entry_module: LeanPool.MRiscX
authors:
- Julius Marx
source:
  doi: 10.1007/978-3-030-58768-0_11
  url: https://github.com/JulsDE/MRiscX
  github_repo: JulsDE/MRiscX
license: Apache-2.0
status: verified
provenance: human
main_declarations:
- hoareTripleUp
- S_SEQ
- proof_otp
main_results:
- declaration: hoareTripleUp
  informal: Defines the MRiscX Hoare triple, asserting that from any state satisfying the precondition
    the code reaches a successor state satisfying the postcondition while respecting the line whitelist
    and blacklist.
  source_ref: D. Lundberg, R. Guanciale, A. Lindner, M. Dam, Hoare-Style Logic for Unstructured Programs,
    SEFM 2020, doi:10.1007/978-3-030-58768-0_11.
- declaration: S_SEQ
  informal: Proves the sequencing Hoare rule, peeling off the last instruction of a code block.
  source_ref: D. Lundberg, R. Guanciale, A. Lindner, M. Dam, Hoare-Style Logic for Unstructured Programs,
    SEFM 2020, doi:10.1007/978-3-030-58768-0_11.
- declaration: PRE_STR
  informal: Proves the precondition-strengthening rule for MRiscX Hoare triples.
- declaration: POST_WEAK
  informal: Proves the postcondition-weakening rule for MRiscX Hoare triples.
- declaration: specification_LoadImmediate
  informal: Proves the per-instruction Hoare specification of the load-immediate instruction.
- declaration: proof_otp
  informal: Proves the full correctness of a One-Time-Pad implementation written in MRiscX assembly.
tags:
