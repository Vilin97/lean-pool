slug: compactness-and-degeneracy
title: Counterexamples to graph compactness and two-degenerate extremal bounds
summary: Formalizes two counterexamples in extremal graph theory. The first gives a finite family of connected
  bipartite cyclic graphs whose family extremal number grows strictly slower than every member's extremal
  number, disproving the Erdős--Simonovits compactness conjecture. The second constructs a connected bipartite
  two-degenerate graph with extremal number at least c n^(3/2+ε), disproving the proposed universal n^(3/2)
  upper bound under the stated bipartition degree condition.
