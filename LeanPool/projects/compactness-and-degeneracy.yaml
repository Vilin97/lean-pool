main_results:
- declaration: CompactnessConjecture.quantitativeCompactnessCounterexample
  informal: There is a nonempty finite family of connected bipartite cyclic graphs such that every member
    has a uniform positive n^(4/3)-scale extremal lower bound, while every family-free host on n vertices
    has its sixteenth power of the edge count bounded by a constant times n^21. Consequently the family
    is not compact and the Erdős--Simonovits compactness conjecture is false.
- declaration: TwoDegenerateGraphs.twoDegenerateExtremalCounterexample
  informal: There is a connected bipartite two-degenerate finite graph H such that each side of every
    two-coloring has a vertex of degree greater than two, yet ex(n,H) is eventually at least c n^(3/2+ε)
    for some positive constants c and ε.
