slug: gkp-density-one
title: Density-One GKP Divisibility and Its Carry-Language Characterization
summary: Proves that the exponents k satisfying the Graham--Knuth--Patashnik divisibility condition have
  natural density one. The proof gives an exact all-depth modular sieve, quantitative bounds for possible
  failures in initial intervals, and a density-zero limit for the failure proportion. It also develops
  the Kummer digit-sum bridge, the binary-popcount reduction, and a verified ternary carry automaton.
  The universal GKP conjecture remains open because the possible density-zero failure set may be nonempty.
