slug: nemytskii-lebesgue
title: Nemytskii operators on Lebesgue spaces
summary: 'Develops superposition operators induced by Caratheodory functions: measurability, Lp-to-Lq
  growth bounds and sequential continuity, Lipschitz estimates, monotonicity and coercivity, and Frechet
  remainder estimates. For Lebesgue measure on the real line and finite-dimensional real fibers, characterizes
  when every Lp input has an Lq output by the standard integrable-envelope growth condition, for 1 <=
  p,q < infinity. First-order remainder estimates on arbitrary measure spaces assume a Caratheodory derivative
  with the stated Holder-compatible growth. The integral-functional result bounds the integrated remainder
  and proves integrability of the linearized integrand; it does not assert integrability of the original
  integrand without its separate growth hypotheses. Caratheodory here requires strongly measurable sections
  and almost-everywhere continuity in the fiber variable.'
