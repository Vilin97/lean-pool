main_results:
- declaration: NemytskiiLebesgue.IsCaratheodory.memLp_nemytskii_volume_iff_growth
  informal: For f from R times R^m to R^k with strongly measurable sections and almost-everywhere continuous
    fibers, and 1 <= p,q < infinity, every Lp input gives an Lq output if and only if there exist an Lq
    real envelope a and a nonnegative constant C such that almost everywhere, simultaneously for every
    fiber vector xi, norm(f(x,xi)) <= abs(a(x)) + C * norm(xi)^(p/q).
  source_ref: Upstream NemytskiiLebesgue/ConverseImplication.lean.
- declaration: NemytskiiLebesgue.IsCaratheodory.nemytskii_seqContinuous_of_memLp_of_growth_real
  informal: On any measure space, the same Caratheodory and growth assumptions imply that a sequence of
    Lp functions converging in Lp to an Lp function has superposition images converging in Lq, for finite
    exponents p,q at least one and finite-dimensional real fibers.
  source_ref: Upstream NemytskiiLebesgue/Continuity.lean.
- declaration: NemytskiiLebesgue.IsCaratheodory.eLpNorm_frechet_remainder_le_ofReal_mul_eLpNorm
  informal: On a measure space, suppose f and its fiber derivative f' are Caratheodory, f' is the Frechet
    derivative at every fiber point almost everywhere, p,r >= 1 satisfy 1/q = 1/r + 1/p, and f' is bounded
    by b + C * norm(xi)^(p/r) with nonnegative b in Lr and C > 0. At each Lp function u, the Lq integral
    quantity (a quasi-norm when q < 1) of the first-order remainder is at most epsilon times the Lp norm
    of l whenever l is in Lp and its Lp norm is sufficiently small.
  source_ref: Upstream NemytskiiLebesgue/Frechet.lean; generalized in this port by removing an unused
    finite-measure assumption.
- declaration: NemytskiiLebesgue.IsCaratheodory.integralFunctional_frechet_deriv
  informal: On a measure space with finite-dimensional real inputs, under Caratheodory assumptions on
    f and its fiber derivative f', conjugate exponents p,q, and derivative growth b + C*norm(xi)^(p-1)
    with nonnegative b in Lq and C > 0, the linearized integrand is integrable for every Lp perturbation.
    The norm of the integral of the first-order remainder is at most epsilon times the Lp norm of the
    perturbation when that norm is sufficiently small.
  source_ref: Upstream NemytskiiLebesgue/IntegralFunctional.lean; generalized in this port by removing
    an unused finite-measure assumption.
