slug: zeta-five-irrational
title: Irrationality of the Riemann zeta function at five
summary: Proves that Mathlib's Riemann zeta function at five is an irrational real number, following Aabir
  Fauzan's September 2026 preprint. Constructs integer polynomials of degree 37n with positive values
  at zeta(5) that decay exponentially in n squared. Includes a general integer-polynomial irrationality
  criterion, Hankel determinant and moment-integral identities, logarithmic-energy estimates, prime-adic
  integrality bounds, and kernel-checked rational certificates. The formalization uses a different normalizer
  and a positive decay constant in place of the paper's specific constant 139/5. Reuses the prime number
  theorem infrastructure already in the MooreBound project.
