main_results:
- declaration: Zeta5Irrational.irrational_five
  informal: There exists an irrational real number x whose complex coercion equals Mathlib's Riemann zeta
    function evaluated at five.
  source_ref: Fauzan, zeta(5) is irrational, Theorem 1.1, September 17, 2026, https://doi.org/10.5281/zenodo.22826419;
    upstream Apery/Main.lean. The completed formalization was released on September 23, 2026.
- declaration: Zeta5Irrational.main_estimate
  informal: There is a positive real c such that, for all sufficiently large n, an integer polynomial
    Q of degree 37n is a positive rational multiple of the constructed determinant polynomial and satisfies
    0 < Q(zeta(5)) < exp(-c*n^2).
  source_ref: Upstream Apery/MainEstimate.lean; variant of the paper's Theorem 2.1 with c = -800*(Aeff
    + U) instead of 139/5.
- declaration: Zeta5Irrational.irrational_of_eventually_exists_int_poly
  informal: A real xi is irrational if, eventually, integer polynomials of degree at most d(n) have positive
    values at xi bounded by epsilon(n), and b^d(n)*epsilon(n) tends to zero for every positive natural
    b.
  source_ref: Upstream Apery/Criterion.lean; the paper's Section 1.1.
