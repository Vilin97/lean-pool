slug: minimum-degree-matchings
title: BKLO simultaneous perfect matchings and spread matchings
summary: 'Formalizes the r = 2 specialization of the simultaneous factor-selection step in BKLO Lemma
  10.7: under quantitative parity, minimum-degree, codegree, and incidence hypotheses, a linearly sized,
  overlapping family of neighbourhood graphs admits perfect matchings whose edge sets are pairwise disjoint.
  The proof replaces the published randomized greedy process by a deterministic pessimistic-estimator
  sweep. Supporting results develop perfect, near-perfect, edge-disjoint, and quantitatively weighted
  spread matchings from sharp minimum-degree hypotheses.'
