main_results:
- declaration: BKLOK2.lemma107K2_holds
  informal: 'Specializes BKLO Lemma 10.7 to r = 2 in its apex-neighbourhood configuration: for every sufficiently
    large admissible configuration, all indexed neighbourhood graphs admit perfect matchings whose edge
    sets are pairwise disjoint. The proof is deterministic.'
- declaration: SimpleGraph.exists_isPerfectMatching_of_minDegree
  informal: Every finite simple graph of even order whose minimum degree is at least half its order has
    a perfect matching.
- declaration: SimpleGraph.exists_isMatching_compl_singleton_of_minDegree
  informal: Every finite simple graph of odd order n and minimum degree at least (n - 1) / 2 has a matching
    whose vertex set is the complement of a singleton.
- declaration: SimpleGraph.exists_involutions_pairwise_ne
  informal: If every vertex of a finite even vertex set has at least half the set size plus t neighbors
    inside the set, then the graph contains t + 1 pairwise edge-disjoint perfect matchings of that set,
    represented by an indexed family of partner involutions. These involutions are pairwise distinct when
    the vertex set is nonempty.
- declaration: SimpleGraph.exists_spread_involution
  informal: Under the same minimum-degree condition with slack t, every nonnegative edge-weight function
    admits a perfect matching whose weight is at most 1 / (t + 1) times the total weight over ordered
    pairs in the vertex set.
