slug: monsky
title: Monsky's Theorem
summary: Formalizes Monsky's theorem that a square can be dissected into n triangles of equal area if
  and only if n is nonzero and even, via a 2-adic valuation, a three-coloring of the unit square, and
  a rainbow-triangle argument.
