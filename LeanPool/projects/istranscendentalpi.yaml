license: Apache-2.0
status: verified
provenance: human
main_declarations:
- IsTranscendentalPi
- IsTranscendentalPiReal
main_results:
- declaration: IsTranscendentalPi
  informal: Proves that the complex number π is transcendental over ℚ.
- declaration: IsTranscendentalPiReal
  informal: Proves that the real number π is transcendental over ℚ.
- declaration: isAlgebraic_I_mul_pi_of_isAlgebraic_pi
  informal: Shows that if π is algebraic over ℚ then so is iπ.
- declaration: exists_monic_rat_poly_aeval_Ipi_eq_zero
  informal: Produces a monic rational polynomial vanishing at iπ when iπ is algebraic.
