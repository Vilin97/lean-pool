slug: istranscendentalpi
title: The transcendence of π
summary: Formalizes a self-contained proof, following Niven's 1939 argument, that the real and complex
  number π is transcendental over the rationals.
branch: number theory
entry_module: LeanPool.IsTranscendentalPi
authors:
- James Huang
- Samuël Borza
source:
