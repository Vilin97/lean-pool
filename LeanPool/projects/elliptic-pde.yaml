main_results:
- declaration: EllipticPdes.Sobolev.FullEllipticOp.weak_solution_L2_of_nonneg_zeroth_of_bounded
  informal: On a bounded domain in positive dimension, a bounded measurable uniformly elliptic operator
    with zero drift and nonnegative zeroth-order coefficient has a unique H₀¹ weak solution for every
    L² datum, with a datum-independent norm bound.
- declaration: EllipticPdes.Regularity.interior_H2_estimate
  informal: In positive dimension, on an open measurable domain, an H₀¹ weak solution of a bounded measurable
    uniformly elliptic divergence-form operator with globally Lipschitz principal coefficients and an
    L² datum has interior L² second weak derivatives, with an estimate whose constant is chosen before
    the solution and datum.
- declaration: EllipticPdes.Regularity.higher_interior_regularity
  informal: In positive dimension, for a uniformly elliptic divergence-form operator with bounded measurable
    coefficients, globally Lipschitz principal-coefficient representatives in W^{k+1,∞}(ℝ^d), and lower-order
    coefficients in W^{k,∞}(ℝ^d), every H₀¹ weak solution on an open measurable domain with an H^k datum
    has interior H^{k+2} regularity. On each compact subset the iterated L² derivative bounds have a constant
    chosen before the solution, datum and its H^k bound. The pointwise Lipschitz hypothesis is separate
    from the weak-derivative bundles.
- declaration: EllipticPdes.Sobolev.embL2_isCompact
  informal: The inclusion H₀¹(Ω) → L²(Ω) is compact for bounded measurable Euclidean domains, discharging
    the compactness input to the Fredholm and spectral results.
- declaration: EllipticPdes.Extension.exists_extW12
  informal: In positive dimension, bounded open Euclidean domains with C¹ boundary admit a bounded linear
    H¹ extension operator with compact support control.
