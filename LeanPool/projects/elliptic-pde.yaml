slug: elliptic-pde
title: 'Linear elliptic PDE: solvability, regularity and spectral theory'
summary: 'A reusable analytic development of linear uniformly elliptic divergence-form PDE on Euclidean
  domains: Hilbert graph models of H¹ and H₀¹, bounded coefficient operators, Poincaré inequalities, zero-drift/nonnegative-potential
  Dirichlet existence and uniqueness, Gårding and Fredholm theory for general drift, interior H² and higher
  Sobolev regularity, smooth classical representatives, Sobolev and Hölder embeddings, C¹-domain extension
  and compactness, variational eigenvalues, and maximum principles. AI-generated proofs with human mathematical
  design and transcription; announced in arXiv:2609.32561 on 2026-09-26. The unfinished boundary-H² program
  is outside this completed dependency closure.'
