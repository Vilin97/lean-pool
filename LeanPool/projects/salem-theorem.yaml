main_results:
- declaration: SalemTheorem.salem_theorem
  informal: Every Pisot number is approached by Salem numbers from both below and above.
- declaration: SalemTheorem.salem_construction_two_sided
  informal: For the nondegenerate Pisot polynomial pattern, reciprocal-family polynomials have Salem roots
    arbitrarily near the Pisot root from either side.
- declaration: SalemTheorem.salem_quadratic_unit
  informal: The quadratic-unit family supplies Salem roots approaching each reciprocal quadratic Pisot
    unit from either side.
