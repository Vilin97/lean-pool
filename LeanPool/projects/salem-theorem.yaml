slug: salem-theorem
title: Every Pisot number is a two-sided limit of Salem numbers
summary: Proves Salem’s two-sided approximation theorem for Pisot numbers, preserving both the polynomial
  reciprocal-family construction and the exceptional quadratic-unit construction.
