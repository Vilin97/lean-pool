main_results:
- declaration: MooreBound.DegreeDiameter.theorem_1_1
  informal: For each positive natural k, n(k,d)/d^k tends to 1 as the natural degree bound d tends to
    infinity. Here n(k,d) is the maximum number of vertices of a finite simple graph with maximum degree
    at most d and extended diameter at most k.
- declaration: MooreBound.DegreeDiameter.corollary_1_2
  informal: For each natural ell at least 2, the lower limit of h(ell,d)/d^ell is at least 1. Here h(ell,d)
    is one plus the maximum number of edges of a finite simple graph with maximum degree at most d whose
    line graph has extended diameter at most ell.
- declaration: MooreBound.DegreeDiameter.proposition_3_1
  informal: For every positive k and prime power q, the concrete halved-flag graph is regular, has order
    [2k+1]_q!/(q+1)^k, degree at most (q+1)^k((q+1)^k-1), and extended diameter exactly k. Along all prime
    powers q tending to infinity, its actual degree divided by this cap and its order divided by the kth
    power of its actual degree both tend to 1.
- declaration: MooreBound.DegreeDiameter.alternating_route
  informal: Any two complete flags in an n-dimensional vector space over a division ring admit an n-step
    route that changes only ranks of the prescribed alternating parity at each step.
- declaration: MooreBound.prime_between
  informal: For every positive real epsilon, every sufficiently large real x admits a prime strictly between
    x and (1+epsilon)x.
