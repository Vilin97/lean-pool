slug: asymptotic-moore-bound
title: Asymptotically attaining the Moore bound
summary: Proves that, for each fixed positive diameter k, the largest order of a finite simple graph with
  maximum degree at most d and extended diameter at most k is asymptotic to d^k as d tends to infinity.
  Constructs regular halved-flag graphs over every finite field, with exact order and diameter, a sharp
  degree cap, and matching asymptotics through all prime powers. Also proves the corresponding lower-limit
  bound for the edge extremum defined using line-graph diameter. Reusable infrastructure includes common
  bases for complete flags, odd-even sorting routes, exact flag enumeration, projective-line completion
  counts, and bipartite graph expansion. The analytic bridge retains the Wiener-Ikehara and prime-counting
  dependency closure from the Apache-2.0 PrimeNumberTheoremAnd project. The paper describes AI-assisted
  formalization supervised by the human authors.
