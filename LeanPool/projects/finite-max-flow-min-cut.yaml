main_results:
- declaration: Contrib.MaxFlowMinCut.maxflow_eq_mincut
  informal: Every finite network with real nonnegative capacities and distinct source and sink admits
    a feasible flow and a source-sink cut whose flow value equals the cut capacity.
- declaration: Contrib.MaxFlowMinCut.value_le_capacity
  informal: The value of every feasible flow is at most the capacity of every source-sink cut.
- declaration: Contrib.MaxFlowMinCut.max_flow_exists
  informal: Every finite network with real nonnegative capacities admits a maximum-value feasible flow.
