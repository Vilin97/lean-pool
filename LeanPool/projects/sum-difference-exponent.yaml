slug: sum-difference-exponent
title: The optimal exponent relating sumsets and difference sets
summary: For a finite integer set A with at least two elements, proves that C(A) = log(|A+A|/|A|) / log(|A-A|/|A|)
  is strictly below 2, while explicit finite sets have exponents tending to 2. Thus 2 is the supremum
  and is never attained. Also gives an explicit witness within 10^(-999) of 2. This imports the upstream
  base-39 row-and-column variant, not the paper's base-12 automaton construction or its quantitative cardinality
  estimates. Supporting infrastructure includes injective digit expansions and the strict Pluennecke-Petridis
  equality argument for finite integer sets.
