main_results:
- declaration: SumDifferenceExponent.growthExponent_lt_two
  informal: For every finite set A of integers with at least two elements, log(|A+A|/|A|) / log(|A-A|/|A|)
    is strictly less than 2.
- declaration: SumDifferenceExponent.tendsto_growthExponent_approximatingSet
  informal: The growth exponents of the explicit finite integer sets approximatingSet l converge to 2
    as l tends to infinity; these sets have at least two elements whenever l is positive.
- declaration: SumDifferenceExponent.isLUB_admissibleExponents
  informal: The number 2 is the least upper bound of the growth exponents of all finite integer sets with
    at least two elements.
- declaration: SumDifferenceExponent.sSup_admissibleExponents
  informal: The supremum of the growth exponents of all finite integer sets with at least two elements
    equals 2.
- declaration: SumDifferenceExponent.supremum_not_attained
  informal: No finite integer set with at least two elements has growth exponent equal to 2.
- declaration: SumDifferenceExponent.quantitative_example
  informal: The explicitly defined finite integer set quantitativeSet has growth exponent strictly between
    2 - 10^(-999) and 2.
