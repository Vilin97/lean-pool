slug: dross-fractional-triangle-decomposition
title: Dross's fractional triangle decomposition theorem
summary: Formalizes the exact nine-tenths minimum-degree threshold for fractional triangle decomposition
  of finite graphs. The proof uses a finite max-flow/min-cut argument and induction that peels high-degree
  triangles.
