title: Beyond the Bethe approximation of the permanent
summary: Constructs a deterministic polynomial-time approximation algorithm for the permanent of every
  nonnegative rational matrix, with exponential base strictly smaller than the square root of two. The
  development includes stable-polynomial inequalities, rational convex optimization, finite-precision
  arithmetic, and a Turing-machine complexity proof.
branch: theoretical computer science
provenance: AI
main_declarations:
- BeyondBethe.theoremOne
main_results:
- declaration: BeyondBethe.theoremOne
  informal: There is a fixed rational algorithm approximating the permanent of every nonnegative rational
    n-by-n matrix within c^n for an absolute c below sqrt(2), with a deterministic polynomial-time Turing-machine
    implementation.
