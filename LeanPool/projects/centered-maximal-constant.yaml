slug: centered-maximal-constant
title: Bounds for the centered Hardy-Littlewood maximal constant
summary: Proves that the weak type (1,1) constant c_2 of the centered maximal operator over axis-parallel
  squares is at least the explicit radical phi, approximately 1.68551, using a weighted periodic lattice
  and integrable approximations. Also proves c_d <= 2^d in every natural dimension and 1.685 < phi < 1.686.
  The operator acts on real-valued integrable functions, with Lebesgue outer measure of strict level sets.
  Includes the maximal-function API, a Vitali covering argument, lattice witnesses, smearing estimates,
  and the limiting lower bound. No optimality of phi is claimed.
branch: harmonic analysis
