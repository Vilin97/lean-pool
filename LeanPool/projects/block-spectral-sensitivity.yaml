main_results:
- declaration: BSLambda.Final.exists_bs_gt_lam_rpow
  informal: There exists a total Boolean function on ZMod 14011 times Fin 144 whose block sensitivity
    strictly exceeds its spectral sensitivity raised to the real exponent 2.12.
  source_ref: Upstream Main.lean; bs_lambda.txt Sections 5-12 and 14.
- declaration: BSLambda.Final.exists_counterexample
  informal: There exists a gate labelling whose certificate-union indicator f has bs(f) at least 14011,
    lambda(f)^2 at most U = 7149 + 2 sqrt(150108), and lambda(f)^alpha at most bs(f), where alpha = 2
    log(14011)/log(U) > 2.
  source_ref: Upstream Main.lean; bs_lambda.txt Sections 5-12 and 14.
- declaration: BSLambda.Final.exists_ratio_blowup
  informal: A single gate labelling yields, for every natural m, an m-fold self-composition F_m satisfying
    (14011/U)^m * lambda(F_m)^2 <= bs(F_m). The auxiliary theorem ratio_gt proves 14011/U > 1.768.
  source_ref: Upstream Main.lean; bs_lambda.txt Section 14, division-free bound.
- declaration: BSLambda.lam_comp
  informal: For any Boolean functions on finite coordinate types, spectral sensitivity of their block
    composition equals the product of their spectral sensitivities, including the degenerate cases.
  source_ref: Upstream Spectral/Multiplicative.lean; composition theorem used in Section 14.
- declaration: BSLambda.LLL.pr_avoid_pos
  informal: In a finite uniform product of nonempty alphabets, events supported on specified coordinate
    sets have positive probability of all being avoided if each event probability is at most its weight
    times the product of one minus the weights of its dependent neighbours, with every weight strictly
    between zero and one.
  source_ref: Upstream LLL/Asymmetric.lean; asymmetric local lemma in Section 10.
