slug: block-spectral-sensitivity
title: Block sensitivity can exceed spectral sensitivity squared
summary: Constructs a total Boolean function on 14011 blocks of 144 bits with block sensitivity at least
  14011 and squared spectral sensitivity at most U = 7149 + 2 sqrt(150108). Proves the strict separation
  lambda(f)^2.12 < bs(f), multiplicativity of spectral sensitivity under arbitrary block composition,
  and an exponential lower bound with factor 14011/U > 1.768 for the self-composed family. Includes reusable
  finite product probability, an asymmetric Lovasz local lemma, partial Boolean assignments, certificate-family
  spectral bounds, and a Paley doubly regular tournament. The formalized explicit exponent is 2.12; the
  exact logarithmic exponent is also retained.
