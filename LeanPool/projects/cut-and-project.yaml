slug: cut-and-project
title: Period Lengths of Rational Cut-and-Project Gap Sequences
summary: 'Formalizes the closed-form minimal periods of one-dimensional rational cut-and-project gap sequences
  at the level of the paper''s residue model, plus a fully geometric aperiodicity theorem for irrational
  slopes. For coprime α, β ∈ ℕ and window parameter ω ≥ 0, write N = ⌊ωα⌋ + ⌊ωβ⌋ + 1 and D = α² + β².
  The strip-to-residue reduction of the paper — sorting the hits of the length-N progression twisted by
  the geometric multiplier −αβ⁻¹ (mod D) — is taken as the definition of the gap sequence rather than
  derived from the lattice; for it, the multiset convention has minimal period N/D when D ∣ N and N otherwise,
  and the set convention (multiplicities flattened to {0,1}) has minimal period 1 when N ≥ D and N otherwise.
  The irrational case is geometric from first principles: for positive irrational slope and ω > 0, the
  accepted points of ℤ² sorted by the physical projection have a gap sequence with no finite period, via
  injectivity of the projection and Kronecker density of the internal image.'
