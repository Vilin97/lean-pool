main_results:
- declaration: CutAndProject.main_theorem_geometric_concrete
  informal: The gap sequence of the residue model of the rational cut-and-project multiset (sorted hits
    of the length-N progression under the multiplier −αβ⁻¹ mod D) has minimal period N/D if D divides
    N and N otherwise, where N = ⌊ωα⌋ + ⌊ωβ⌋ + 1 and D = α² + β².
- declaration: CutAndProject.set_main_theorem_geometric_concrete
  informal: The set-convention residue-model gap sequence (multiplicities flattened to {0,1}) has minimal
    period 1 if N ≥ D and N otherwise.
- declaration: CutAndProject.Irrational.prop_irrational
  informal: For positive irrational slope and window parameter ω > 0, the projected gap sequence has no
    finite period.
