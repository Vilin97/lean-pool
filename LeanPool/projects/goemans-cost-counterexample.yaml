slug: goemans-cost-counterexample
title: Counterexample to Goemans' unsplittable-flow cost conjecture
summary: Refutes Goemans' cost conjecture for single-source unsplittable flow, Conjecture 1.3 of Traub,
  Vargas Koch, and Zenklusen's paper. A simple, loopless, acyclic graph with seven vertices and nine arcs
  admits a splittable flow of cost 58, but every unsplittable routing within the additive maximum-demand
  capacity bound costs at least 60, attained by an explicit routing. The development proves completeness
  of the walk enumeration and transfers the refutation from integers to any linearly ordered commutative
  ring, including the rationals and reals. Jason Hickey directed Claude's formal verification of the counterexample
  discovered by Dmitry Rybin with GPT-5.6 Pro; upstream also acknowledges Katherine Schlitz. Planarity
  is not part of the formalized claim.
