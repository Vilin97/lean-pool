main_results:
- declaration: GoemansFlow.goemans_cost_conjecture_false
  informal: The rational form of Goemans' cost conjecture is false, even for simple, loopless, acyclic
    finite digraphs with explicit capacities, positive demands, and distinct terminals different from
    the source.
  source_ref: Conjecture 1.3 of arXiv:2308.02651v1
- declaration: GoemansFlow.not_GoemansCostConjectureFull
  informal: The same cost conjecture is false over every linearly ordered commutative ring, by transfer
    of the integer counterexample.
- declaration: GoemansFlow.optimum_is_sixty
  informal: On the explicit seven-vertex, nine-arc instance, the minimum cost among unsplittable routings
    satisfying the additive maximum-demand capacity bound is exactly 60.
- declaration: GoemansFlow.fractional_cost
  informal: The given splittable flow on the counterexample instance costs exactly 58.
- declaration: GoemansFlow.path_complete
  informal: For each of the three terminals, the lists of arcs giving a walk from the source are exactly
    the two explicitly exhibited paths.
