slug: lean-snumbers
title: Pietsch s-numbers and the maximal difference theorem
summary: Formalizes the five classical s-number sequences, their comparison inequalities, the maximal
  difference theorem, compact-operator singular value decomposition, John ellipsoids, entropy numbers,
  and compactness characterizations.
branch: functional analysis
