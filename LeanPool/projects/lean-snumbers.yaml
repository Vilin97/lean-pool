main_declarations:
- SNumbers.approximationNumber_le_e_mul_hilbertNumber
main_results:
- declaration: SNumbers.approximationNumber_le_e_mul_hilbertNumber
  informal: For a bounded operator, its nth approximation number is at most e times (n+1) times its nth
    Hilbert number.
- declaration: SNumbers.allSNumbers_eq_on_HilbertSpace
  informal: Every s-number sequence agrees with the approximation numbers on operators between Hilbert
    spaces.
- declaration: John.john_decomposition
  informal: In John position, the identity decomposes into a positive weighted sum of rank-one operators
    from contact points.
