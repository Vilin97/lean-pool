main_results:
- declaration: generalizedResidueTheorem
  informal: Proves the Hungerbühler-Wasem generalized residue theorem for piecewise-C1 curves through
    poles.
- declaration: generalizedResidueTheorem_simplePoles
  informal: Specializes the generalized residue theorem to the simple-pole case.
- declaration: valence_formula_textbook_orbit_finsum
  informal: Proves the valence formula for modular forms on the modular group.
