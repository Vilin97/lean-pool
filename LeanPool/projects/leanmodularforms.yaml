slug: leanmodularforms
title: Modular forms and the generalized residue theorem
summary: Formalizes the Hungerbühler-Wasem generalized residue theorem for Cauchy principal value integrals
  through poles and applies it to the valence formula for modular forms on the modular group.
branch: complex analysis
