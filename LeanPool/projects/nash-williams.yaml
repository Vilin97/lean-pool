slug: nash-williams
title: Nash-Williams fronts and 2-better-quasi-orders
summary: Formalizes Nash-Williams fronts through their well-founded prefix trees and ordinal ranks, proves
  the finite-color Nash-Williams theorem, and derives the infinite Ramsey theorem for arbitrary finite
  arity. The order-theoretic development proves that 2-better-quasi-orders are well-quasi-orders and establishes
  closure under finite products, lexicographic sums, domination of subsets, and pointwise embedding of
  sequences. Throughout, TwoBQO r is the good-triple property of an arbitrary binary relation r (every
  pair-sequence has m < n < l with f(m,n) related to f(n,l)); it assumes no reflexivity or transitivity
  of r.
