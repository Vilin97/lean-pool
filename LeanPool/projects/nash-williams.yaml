main_results:
- declaration: Front.IsFront.nash_williams
  informal: Every two-coloring of a Nash-Williams front on an infinite set has an infinite restriction
    whose front is monochromatic.
- declaration: Front.IsFront.nash_williams_fin
  informal: Every finite coloring of a Nash-Williams front has an infinite restriction whose front is
    monochromatic.
- declaration: infinite_ramsey
  informal: Every finite coloring of the r-element subsets of an infinite set of natural numbers is constant
    on all r-element subsets of some infinite subset.
- declaration: TwoBQO.wellQuasiOrdered
  informal: Every 2-better-quasi-order is a well-quasi-order.
- declaration: TwoBQO.lexSigmaQO
  informal: 'The 2-BQO good-triple property is preserved by lexicographic sums: if the index relation
    and every fibre relation have it, so does the lexicographic-sum relation on the sigma type. This asserts
    nothing about reflexivity or transitivity of the sum; those are proved separately (LexSumRelQO.refl
    and LexSumRelQO.trans) under the corresponding order hypotheses on the index and fibres.'
- declaration: TwoBQO.embedForAll_wqo
  informal: If a preorder is a 2-better-quasi-order, then its infinite sequences are well-quasi-ordered
    by the relation admitting a strictly monotone reindexing along which corresponding terms are related.
