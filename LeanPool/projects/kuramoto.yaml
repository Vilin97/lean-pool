  github_repo: velvetmonkey/kuramoto-lean
license: MIT
status: verified
provenance: AI
main_declarations:
- kuramotoR_norm_le_one
- weighted_lyapunov_descent
main_results:
- declaration: kuramotoR_norm_le_one
  informal: The Kuramoto order parameter has norm at most one for any phase configuration.
- declaration: weighted_lyapunov_descent
  informal: The weighted Kuramoto potential is non-increasing along the gradient flow, since the sum of
    force times potential-derivative over all oscillators is at most zero.
- declaration: allToAll_convergence_to_synchrony
  informal: Under all-to-all coupling with positive strength and initial phases in an open semicircle,
    the order parameter norm tends to one, i.e. the oscillators synchronize.
