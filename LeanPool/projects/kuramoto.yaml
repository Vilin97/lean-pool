slug: kuramoto
title: Finite-N Kuramoto Synchronization
summary: 'Formalizes the finite-N Kuramoto model of coupled phase oscillators: the order parameter and
  its unit bound, the potential/force gradient identities, smoothness and local Lipschitz continuity of
  the vector field with ODE existence and uniqueness, Lyapunov descent along trajectories, pairwise and
  semicircle contraction estimates, Hebbian phase/weight dynamics, and full convergence to synchrony under
  all-to-all coupling from initial phases in an open semicircle.'
branch: dynamical systems
entry_module: LeanPool.Kuramoto
authors:
- Ben Cassie
source:
  title: 'Finite-N Kuramoto synchronization: order-parameter bounds and Lyapunov descent'
  authors:
  - Ben Cassie
