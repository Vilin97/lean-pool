slug: granville-moore
title: Integer Moore determinants and iterated Fermat quotients
summary: Proves Granville's integrality and congruence formulas for iterated Fermat quotients at odd primes,
  including the exceptional order p - 1. For 1 ≤ d ≤ p and integers x_j prime to p, it proves that the
  nonzero integer Moore determinant det(x_j^(p^i)) is divisible by p^C(d+1,3), and that the next power
  does not divide it exactly when the Fermat quotients q_p(x_j) are pairwise distinct modulo p. The development
  supplies polynomial coefficient identities, denominator-clearing and valuation estimates, a determinant
  reduction ladder, and weighted Vandermonde formulas over general commutative rings.
