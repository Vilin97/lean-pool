main_results:
- declaration: GranvilleMoore.exists_intCast_iteratedFermatQuot
  informal: For an odd prime p, an integer x not divisible by p, any j ≤ p - 1, and any k, the iterated
    Fermat quotient F^(j)_k(x) is an integer.
  source_ref: Upstream README, first main result; attributed there to Granville.
- declaration: GranvilleMoore.dvd_factorial_mul_sub_mul_pow
  informal: Under the same prime and unit hypotheses, for j ≤ p - 2 and any k, j! F^(j)_k(x) is congruent
    to x q_p(x)^j modulo p, where q_p(x) = (x^(p-1) - 1)/p.
  source_ref: Upstream README, second main result.
- declaration: GranvilleMoore.dvd_factorial_mul_sub_exceptional
  informal: For an odd prime p and an integer x not divisible by p, (p-1)! F^(p-1)_0(x) is congruent to
    x q_p(x)^(p-1) - x q_p(x) modulo p.
  source_ref: Upstream README, exceptional congruence.
- declaration: GranvilleMoore.pow_dvd_det_mooreMatrix
  informal: For an odd prime p, 1 ≤ d ≤ p, and integers x_j not divisible by p with nonzero Moore determinant,
    p^C(d+1,3) divides det(x_j^(p^i)).
  source_ref: Upstream README, Moore determinant lower bound, in divisibility form.
- declaration: GranvilleMoore.not_pow_succ_dvd_det_mooreMatrix_iff
  informal: Under those determinant hypotheses, its p-adic valuation is exactly C(d+1,3) if and only if
    the integer Fermat quotients q_p(x_j) have pairwise distinct residues modulo p. The Lean statement
    expresses exactness as failure of divisibility by p^(C(d+1,3)+1).
  source_ref: Upstream README, equality criterion, including d = p.
