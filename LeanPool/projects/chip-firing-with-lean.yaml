- declaration: ChipFiring.Propositions.riemann_roch
  informal: For a finite connected graph, the ranks of a divisor and its canonical complement satisfy
    the graph Riemann–Roch formula.
- declaration: ChipFiring.Propositions.clifford
  informal: For a special divisor on a finite connected graph, its rank is at most half its degree.
