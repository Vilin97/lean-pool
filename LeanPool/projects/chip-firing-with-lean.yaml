slug: chip-firing-with-lean
title: Chip-Firing with Lean 4
summary: A Lean 4 / Mathlib formalization of Baker and Norine's Riemann-Roch theorem for finite graphs.
  Chip configurations on a finite graph, modulo chip-firing moves, form an abelian group analogous to
  the group of line bundles on a compact Riemann surface. Each class can be assigned a rank, analogous
  to the dimension of a linear series. These ranks then satisfy a formula of the form r(D) - r(K-D) =
  deg D + 1 - g, in exact analogy to Riemann surfaces. This formula is formalized, along with the analog
  of Clifford's theorem for finite graphs.
