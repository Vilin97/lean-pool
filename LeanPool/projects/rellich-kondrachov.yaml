slug: rellich-kondrachov
title: Rellich–Kondrachov compact embedding theorem
summary: 'Formalizes the Rellich–Kondrachov compact embedding theorem: the Sobolev embedding H¹ → L² is
  a compact operator on compact Riemannian manifolds. The proof builds the Euclidean core (compactness
  of the H¹ → L² inclusion on a fixed compact support via the Fréchet–Kolmogorov criterion and the H¹
  translation estimate ‖τₐu − u‖₂ ≤ ‖a‖ · ‖∇u‖₂), glues chart contributions over a finite atlas, and specializes
  to the Levi-Civita Riemannian volume measure.'
