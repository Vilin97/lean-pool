  informal: On a compact Riemannian manifold, the Sobolev inclusion H¹ → L² for the Levi-Civita volume
    measure is a compact operator.
- declaration: RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.isCompactOperator_h1OnToL2
  informal: 'Euclidean Rellich–Kondrachov compactness: on a fixed compact support K, the H¹ → L² inclusion
    restricted to functions supported in K is a compact operator.'
- declaration: RellichKondrachov.Geometry.Manifold.Sobolev.exists_riemannianFiniteChartData
  informal: On a compact Riemannian manifold there exists finite chart data equipped with explicit Lipschitz
    neighborhoods and a subordinate partition of unity, the input to the manifold Rellich glue.
