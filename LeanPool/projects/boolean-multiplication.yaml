main_results:
- declaration: UnrestrictedBooleanMul.mc_mul_zero
  informal: The empty polynomial multiplication map needs zero AND gates.
  source_ref: Proposition 2.3; the n = 0 target has no output coordinates.
- declaration: UnrestrictedBooleanMul.mc_mul_one
  informal: Multiplying two one-coefficient binary polynomials needs exactly one AND gate.
  source_ref: Proposition 2.3.
- declaration: UnrestrictedBooleanMul.mc_mul_two
  informal: Multiplying two two-coefficient binary polynomials needs exactly three AND gates.
  source_ref: Proposition 2.3.
- declaration: UnrestrictedBooleanMul.mc_mul_three
  informal: Multiplying two three-coefficient binary polynomials needs exactly six AND gates.
  source_ref: Proposition 2.4; the lower bound is proved internally.
- declaration: UnrestrictedBooleanMul.N4.mc_mul_four
  informal: Multiplying two four-coefficient binary polynomials needs exactly nine AND gates, allowing
    free XOR, constants, and unrestricted nonlinear reuse.
  source_ref: Theorem 9.1.
- declaration: UnrestrictedBooleanMul.N4.no_eight_gate_circuit
  informal: No eight-AND circuit with free XOR, constants, and arbitrary nonlinear reuse computes all
    seven output coefficients of the product of two four-coefficient binary polynomials.
  source_ref: Theorem 9.1, lower bound.
