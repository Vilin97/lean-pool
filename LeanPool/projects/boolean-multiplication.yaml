slug: boolean-multiplication
title: Exact Boolean multiplicative complexity of four-term polynomial multiplication
summary: Proves that multiplying two binary polynomials with n coefficients needs exactly 0, 1, 3, 6,
  and 9 AND gates for n = 0, 1, 2, 3, and 4, with XOR and constants free and arbitrary reuse of earlier
  nonlinear wires. The main lower bound excludes every eight-gate circuit for n = 4. Develops Boolean
  algebraic normal forms equivalent to all Boolean functions, a general circuit model, dimension bounds,
  circuit rewiring, a Reed-Muller minimum-weight theorem, and exterior-algebra and jet arguments controlling
  nonlinear feedback.
