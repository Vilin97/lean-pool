main_results:
- declaration: LeanPool.Besicovitch.sigmaOne_plane_le_barS
  informal: The planar one-dimensional rectifiability threshold is at most 6934/10000, improving the published
    upper bound 7/10.
- declaration: LeanPool.Besicovitch.forcesOneRectifiability_plane_of_barS_lt
  informal: Every threshold strictly above 6934/10000 forces countable one-rectifiability in the plane.
- declaration: LeanPool.Besicovitch.Example.one_half_le_sigmaOne_plane
  informal: The planar threshold is at least one half, witnessed by Besicovitch's purely unrectifiable
    example.
- declaration: LeanPool.Besicovitch.weightedPairScore_le_of_separated
  informal: Thirty exact rational Gram certificates prove the weighted six-point score is at most -1/2000
    for every separated admissible pair in the unit ball.
