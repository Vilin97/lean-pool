slug: besicovitchs-1-2
title: A machine-checked bound of 0.6934 for Besicovitch's 1/2-problem
summary: Proves the planar Besicovitch threshold is at most 6934/10000, improving the published 7/10 record.
  The development formalizes the finite six-point reduction, thirty rational Gram certificates, the endpoint
  isolation argument, and Besicovitch's classical lower-bound example.
