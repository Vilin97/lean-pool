main_results:
- declaration: DistanceGeometry.schoenberg
  informal: For n at least one, a symmetric hollow n-by-n matrix is a squared-distance matrix of points
    in k-dimensional Euclidean space exactly when its basepoint-centered Gram matrix is positive semidefinite
    and has rank at most k.
- declaration: DistanceGeometry.encard_setOf_forall_dist_eq_le_two
  informal: In a finite-dimensional real inner-product affine space, prescribed distances to centers whose
    affine span has codimension one admit at most two solutions.
- declaration: DistanceGeometry.trilateration_le_two
  informal: Three affinely independent centers in three-dimensional Euclidean space admit at most two
    points with any prescribed triple of distances.
- declaration: DistanceGeometry.cayleyMenger_det_heron
  informal: The Cayley--Menger determinant of three planar points equals minus sixteen times the squared
    area of their triangle.
