slug: semicircle-catalan
title: Genus-Zero Pairings and Catalan Numbers
summary: 'Formalizes the finite combinatorics behind the genus-zero term of the Wigner semicircle law:
  a pairing of Fin (2n), viewed as a fixed-point-free involution, has genus zero (total cycle count of
  the rotation product maximal) exactly when it is noncrossing, and these genus-zero pairings are counted
  by the Catalan number Cₙ. The Catalan recurrence is obtained from an explicit equivalence decomposing
  a noncrossing pairing by the partner of vertex 0 into independent inside and outside pairings.'
