main_results:
- declaration: PalomarClarkOcone.generated_clark_ocone
  informal: For a generating pre-Brownian process on a separable real Gaussian Banach space whose coordinates
    are pointwise represented by continuous linear functionals, constructs a time realization of the Malliavin
    derivative and an Itô isometry for the natural filtration, with martingale representation for every
    terminal L² variable. For pairs in the closed Malliavin graph, the Clark–Ocone formula identifies
    the derivative's predictable projection with its conditional-expectation sections for almost every
    positive time.
