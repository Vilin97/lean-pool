slug: lean-malliavin
title: Malliavin calculus and the Clark–Ocone representation
summary: Constructs the Malliavin derivative, Gaussian integration by parts, closability, Wiener chaos,
  Brownian Itô integration and martingale representation. The Clark–Ocone endpoint uses a generating pre-Brownian
  process with continuous linear coordinates on a separable real Gaussian Banach space, its natural filtration,
  and pairs in the closed Malliavin graph; the conditional-expectation sections agree almost everywhere
  at positive times.
