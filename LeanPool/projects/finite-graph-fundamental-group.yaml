main_results:
- declaration: FiniteGraphFreeGroup.graphTopologicalFundamentalGroupEquiv
  informal: For a finite weakly connected directed multigraph, the topological fundamental group of its
    interval-cell quotient realization at any vertex is explicitly isomorphic to the free group on E +
    1 - V generators.
- declaration: FiniteGraphFreeGroup.graphCombinatorialToTopologicalEquiv
  informal: The endomorphism group at a vertex in the graph's free groupoid is explicitly isomorphic to
    the topological fundamental group of the interval-cell realization.
- declaration: FiniteGraphFreeGroup.graphCoverProjection_isCovering
  informal: The canonical path-lifting projection from rooted free-groupoid paths to graph vertices is
    a quiver covering, with bijective maps on every incoming and outgoing edge star.
- declaration: FiniteGraphFreeGroup.graphRealization_tree_simplyConnected
  informal: The interval-cell realization of a directed arborescence is simply connected, via an explicit
    continuous contraction to its root.
- declaration: FiniteGraphFreeGroup.graphFundamentalGroup_subsingleton_iff_cycleRank_zero
  informal: The combinatorial fundamental group is trivial exactly when the graph's cycle rank E + 1 -
    V is zero.
- declaration: FiniteGraphFreeGroup.graphFundamentalGroupFreeAbelianizationEquiv
  informal: The additive abelianization of the graph fundamental group is the free abelian group on E
    + 1 - V generators.
