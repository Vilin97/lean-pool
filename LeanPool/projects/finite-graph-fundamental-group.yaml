slug: finite-graph-fundamental-group
title: Fundamental groups of finite connected graphs
summary: Constructs the standard interval-cell realization of a finite connected directed multigraph and
  proves that its topological fundamental group is a free group of rank E - V + 1. The proof uses an explicit
  spanning-tree basis and develops a verified path-lifting cover, a contraction of the covering tree,
  root-change equivalences, the tree/triviality criterion, and the corresponding free-abelian result.
