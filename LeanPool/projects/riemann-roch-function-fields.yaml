slug: riemann-roch-function-fields
title: Riemann–Roch for algebraic function fields
summary: Formalizes the Riemann–Roch theorem for algebraic function fields of one variable through the
  adelic route. Divisors are indexed by intrinsic places (discrete rank-one valuation subrings containing
  the constants), with an equivalence to a two-chart coordinate model via Ostrowski's theorem. The development
  builds Riemann–Roch spaces, the genus, an intrinsic adele space, Weil differentials and the canonical
  class, and proves Riemann's inequality, the duality theorem, Riemann–Roch, Clifford's inequality, and
  the standard corollaries. As an application it shows that a Weierstrass elliptic curve has genus one
  and identifies its degree-one places with the class group of the coordinate ring compatibly with the
  group law.
