slug: tutte-path
title: Tutte’s path theorem for matroids
summary: Proves the modular-cut path theorem for finite matroids, with reusable rank-partition, hyperplane-separation,
  relative-complement, indecomposable-cover, and diamond constructions.
branch: matroid theory
