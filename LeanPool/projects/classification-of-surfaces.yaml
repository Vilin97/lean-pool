slug: classification-of-surfaces
title: Classification of Compact Surfaces
summary: Formalizes the classification of compact connected Hausdorff topological 2-manifolds with boundary
  as the sphere, an orientable normal-form quotient, or a non-orientable normal-form quotient, using triangulation
  and finite cyclic polygonal presentations.
