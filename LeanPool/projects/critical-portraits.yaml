main_results:
- declaration: CriticalPortraits.card_portraits
  informal: The number of degree-d critical portraits at level m equals C(d*m, d-1)/d.
- declaration: CriticalPortraits.Cycle.cycle_lemma
  informal: 'The Dvoretzky-Motzkin cycle lemma: a period-n integer sequence with period-sum 1 has exactly
    one good cyclic shift.'
- declaration: CriticalPortraits.T_injOn
  informal: The delete-minimum map is injective on critical portraits.
- declaration: CriticalPortraits.T_surjOn
  informal: The delete-minimum map surjects onto the level-canonical subsets.
