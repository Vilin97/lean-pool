slug: critical-portraits
title: Counting Critical Portraits
summary: Formalizes the census of degree-d critical portraits, modeled as level-canonical (d-1)-subsets
  of the cyclic group ZMod (d*m), and proves that their number equals C(d*m, d-1)/d for all d, via the
  Dvoretzky-Motzkin cycle lemma together with an explicit level-canonicalization bijection (injectivity
  and surjectivity of the delete-minimum map).
