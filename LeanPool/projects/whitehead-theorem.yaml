slug: whitehead-theorem
title: Whitehead's theorem for CW-complexes
summary: Formalizes Whitehead's theorem — a continuous map between CW-complexes that induces isomorphisms
  on all homotopy groups is a homotopy equivalence — including the supporting theory of CW-complexes,
  relative homotopy groups, the homotopy extension property, and compression of maps.
