main_results:
- declaration: SCV.cauchy_formula_polydisc
  informal: Holomorphic functions on a polydisc satisfy the iterated Cauchy integral formula.
- declaration: SeveralComplexVariables.analyticOnNhd_of_separately_analytic_locally_bounded
  informal: On an open subset of a finite complex coordinate space, a Banach-valued separately analytic
    map that is locally bounded is jointly analytic.
  source_ref: Boas (2013), Section 2.7, Theorem 7 (the classical two-variable scalar case).
- declaration: SCV.identity_theorem
  informal: Holomorphic functions on a connected domain that agree on a nonempty open subset agree throughout
    the domain.
