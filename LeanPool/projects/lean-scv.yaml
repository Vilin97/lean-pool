slug: lean-scv
title: Classical several complex variables
summary: Formalizes Cauchy and Taylor theory, Hartogs phenomena, removable singularities, analytic sets
  and germs, Weierstrass theory, holomorphic convexity, Cartan–Thullen and Bochner tube theorems, plurisubharmonic
  functions, Levi convexity, and elementary Runge-domain theory. Weierstrass preparation and coordinate-origin
  germ Noetherianity overlap LocalComplexGeometry; this development also supplies germ unique factorization
  and global extension and convexity results.
branch: complex analysis
