slug: markovprocess
title: MarkovProcess
summary: A Lean formalization of continuous-path Markov processes associated with conservative Feller
  transition semigroups on nonempty locally compact Polish spaces. A uniform Kolmogorov displacement-moment
  bound yields a unique measurable kernel from each starting point to continuous-path space, with the
  prescribed finite-dimensional distributions. The library also develops strong Markov properties, generators
  and resolvents, stopping and killing, and Brownian motion as an example.
