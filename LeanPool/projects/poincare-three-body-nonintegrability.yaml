slug: poincare-three-body-nonintegrability
title: Poincaré's Nonintegrability Theorem for the Restricted Three-Body Problem
summary: Formalizes Poincaré's classical parameter-analytic nonintegrability theorem for the planar circular
  restricted three-body problem. The development defines the rotating-frame Hamiltonian on its collision-free
  domain, proves logarithmic blow-up of the resonant disturbing average at an apoapsis collision boundary,
  and analytically propagates the resulting dense resonant obstruction to exclude an additional analytic
  first integral. The final statement is the fixed-coordinate, global uniform-domain special case of the
  planar part of Yagasaki's Theorem 1.1; his local meromorphic resonant-orbit obstruction is Theorem 3.1.
