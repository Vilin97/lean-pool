slug: puiseux
title: Puiseux's theorem
summary: Constructs Puiseux series as the bounded-denominator subfield of rational-exponent Hahn series.
  Proves that this field is algebraic over Laurent series over any coefficient field, and is an algebraic
  closure when the coefficient field is algebraically closed of characteristic zero. The Newton-Puiseux
  proof includes reusable Hensel splitting and polynomial translation lemmas. Dean Cureton directed the
  AI formalization and subsequently simplified its proofs.
