main_results:
- declaration: HadwigerNelsonBounds.hadwiger_nelson_known_bounds
  informal: The chromatic number of the unit-distance graph on the Euclidean plane lies between five and
    seven, inclusive.
- declaration: HadwigerNelsonBounds.unitDistanceGraph_not_colorable_four
  informal: The unit-distance graph on the Euclidean plane admits no proper coloring with four colors.
- declaration: HadwigerNelsonBounds.chromaticNumber_le_seven
  informal: An explicit Isbell-style coloring proves that the unit-distance graph on the Euclidean plane
    is colorable with seven colors.
