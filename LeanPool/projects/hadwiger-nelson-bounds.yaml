slug: hadwiger-nelson-bounds
title: Known Bounds for the Hadwiger-Nelson Problem
summary: Formalizes the currently known bounds 5 <= chi(R^2) <= 7 for the chromatic number of the Euclidean
  plane. The upper bound constructs an explicit Isbell-style seven-coloring. The lower bound checks Parts'
  481-vertex coloring certificate, develops a finite doubled triangular-lattice forcing gadget, proves
  its exact Euclidean embedding, and closes the four-color contradiction with a spindle construction.
  The exact chromatic number remains open.
branch: graph theory and discrete geometry
