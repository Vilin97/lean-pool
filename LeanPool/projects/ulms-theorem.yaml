main_results:
- declaration: UlmsTheorem.ulm_theorem
  informal: For any prime p and any two countable reduced abelian p-groups in the same arbitrary Lean
    universe, the groups are additively isomorphic if and only if all of their classical Ulm invariants,
    indexed by universe-zero ordinals, agree.
- declaration: UlmsTheorem.iso_of_ulm_invariants
  informal: Equal Ulm invariants at every universe-zero ordinal imply an additive equivalence between
    countable reduced abelian p-groups, via finite height-preserving partial isomorphisms and a back-and-forth
    limit.
- declaration: UlmsTheorem.ulmInvariant_iso_invariant
  informal: An additive equivalence preserves every classical Ulm invariant.
- declaration: UlmsTheorem.UlmDifferentialRegression.no_iso_44_28
  informal: The groups Z/4 x Z/4 and Z/2 x Z/8 are not additively isomorphic; the proof exercises the
    classification theorem and independently detects their different zeroth Ulm invariants.
