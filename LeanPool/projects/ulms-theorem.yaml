slug: ulms-theorem
title: Ulm's theorem for countable reduced abelian p-groups
summary: Formalizes Ulm's classification theorem for countable reduced abelian p-groups in arbitrary Lean
  universes. The development constructs the transfinite Ulm filtration and invariants, proves their invariance
  under additive equivalence, establishes Kaplansky's one-generator extension lemma, and completes the
  countable back-and-forth classification. A finite-group regression distinguishes Z/4 x Z/4 from Z/2
  x Z/8 at the zeroth Ulm invariant.
