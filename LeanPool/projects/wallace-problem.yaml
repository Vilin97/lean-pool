main_results:
- declaration: Wallace.torsionFreeAbelianGroup_mainTheorem_exact
  informal: Every torsion-free Abelian group of cardinality continuum admits a Hausdorff countably compact
    group topology with no nontrivial convergent sequences.
- declaration: Wallace.continuumRationalGroup_and_real_mainTheorem
  informal: Both the continuum-indexed rational direct sum and the additive group of real numbers admit
    such Hausdorff countably compact group topologies without nontrivial convergent sequences.
- declaration: Wallace.commutativeTychonoffWallaceCounterexampleExists
  informal: There exists a commutative Tychonoff countably compact topological semigroup with two-sided
    cancellation which is not a group.
