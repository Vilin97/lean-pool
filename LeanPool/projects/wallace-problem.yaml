slug: wallace-problem
title: The Wallace problem in ZFC
summary: Formalizes in ZFC a Hausdorff countably compact group topology without nontrivial convergent
  sequences on every torsion-free Abelian group of cardinality continuum. It specializes the construction
  to the rational direct sum and the additive real group, and derives a commutative Tychonoff countably
  compact cancellative semigroup that is not a group.
