slug: egz-formal-proof
title: Convex geometry and the Erdős–Ginzburg–Ziv problem
summary: For every fixed positive dimension d, the Erdős–Ginzburg–Ziv constant of (ZMod p)^d equals p
  times its hollow-family constant plus o(p) as p tends to infinity through primes. Includes the convex-flag
  Helly and centerpoint theorems, flag decomposition, balanced combinations, relative expansion, and the
  polynomial hollow-family bound.
