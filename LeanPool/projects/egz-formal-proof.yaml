main_results:
- declaration: EGZ.theorem_1_2
  informal: For each positive dimension d, s((F_p)^d) = p w((F_p)^d) + o(p) as p tends to infinity through
    primes.
- declaration: EGZ.main_upper_bound
  informal: For each positive d and ε > 0, sufficiently large primes satisfy s((F_p)^d) ≤ (w((F_p)^d)
    + ε) p.
