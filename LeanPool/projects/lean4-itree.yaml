slug: lean4-itree
title: Coinductive Interaction Trees using QPFs
summary: Formalizes coinductive interaction trees as the M-type of a polynomial functor (via Mathlib QPFs),
  proving the lawful functor and monad structure, a bisimulation equality coinciding with propositional
  equality, and iteration and effect-handler interpretation combinators, supported by a vendored parameterized-coinduction
  (Paco) library.
branch: coinduction and semantics
entry_module: LeanPool.Lean4Itree
authors:
- Paul Mure
- Joonhyup Lee
source:
  arxiv: '1906.00046'
  doi: 10.1145/3371119
  github_repo: mit-plv/lean4-itree
license: MIT
status: verified
provenance: human
main_declarations:
- Lean4Itree.ITree
- Lean4Itree.ITree.ieq_iff_eq
- Lean4Itree.plfp_acc
main_results:
- declaration: Lean4Itree.ITree
  informal: Defines the coinductive interaction tree as the final coalgebra (M-type) of the interaction-tree
    polynomial functor.
- declaration: Lean4Itree.ITree.IEq
  informal: Defines bisimulation equality between interaction trees as a coinductive fixed point.
- declaration: Lean4Itree.ITree.ieq_iff_eq
  informal: Proves that bisimulation equality of interaction trees coincides with propositional equality.
- declaration: Lean4Itree.ITree.bind_assoc
  informal: Proves associativity of monadic bind for interaction trees, part of the LawfulMonad instance.
- declaration: Lean4Itree.ITree.iter
  informal: Defines the iteration combinator producing an interaction tree from a step function.
- declaration: Lean4Itree.ITree.interp
  informal: Defines interpretation of an interaction tree against an effect handler into an arbitrary
    iterable monad.
- declaration: Lean4Itree.plfp_acc
  informal: Proves the accumulation principle for the parameterized least fixed point underlying the Paco
    coinduction library.
  source_ref: C.-K. Hur, G. Neis, D. Dreyer, V. Vafeiadis, The Power of Parameterization in Coinductive
    Proof, POPL 2013, doi:10.1145/2429069.2429093.
