main_results:
- declaration: ZetaH123.H1.main_theorem
  informal: Proves uniqueness of the admissible base-q decomposition maximizing the H1 power-sum weight
    functional.
- declaration: ZetaH123.H2.main
  informal: Proves the H2 unique-minimizer statement for the recursive digit/carry-free optimization problem
    defining the values s_d(k).
- declaration: ZetaH123.H3.main_theorem
  informal: Proves the H3 monotonicity statement that s_d(k) is strictly less than s_d(k+1) when p does
    not divide k.
- declaration: ZetaH123.Lem41.main
  informal: Proves the Lemma 4.1 Laurent-series expansion for S_d(k), with nonzero coefficients indexed
    by the carry-free tuples.
