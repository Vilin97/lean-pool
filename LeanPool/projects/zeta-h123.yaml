slug: zeta-h123
title: Thakur's hypotheses on power sums of F_q[t]
summary: Formalizes four components of Thakur's hypotheses on power sums over finite polynomial rings,
  including uniqueness and monotonicity results for the carry-free digit optimization problems and the
  Laurent-series expansion of finite-field power sums.
