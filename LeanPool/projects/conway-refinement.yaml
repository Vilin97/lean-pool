title: Conway refinement for omnific integers
summary: 'Proves multiplicative refinement for omnific integers: every equality ab = cd admits a two-by-two
  factor refinement. Develops factorization and refinement of generalized power-series integer parts and
  connects these to surreal-number and standalone Mathlib formulations.'
branch: ordered algebra
main_declarations:
- ConwayRefinement.Palomar.conwayRefinement
main_results:
- declaration: ConwayRefinement.Palomar.conwayRefinement
  informal: If four omnific integers satisfy ab = cd, there are omnific integers e, f, g, h with a = ef,
    b = gh, c = eg, and d = fh, including degenerate cases.
