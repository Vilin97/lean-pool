slug: composition-algebras
title: Hurwitz's Classification of Euclidean Composition Algebras
summary: 'Formalizes Hurwitz''s classification of nontrivial finite-dimensional real Euclidean composition
  algebras: every such algebra has dimension 1, 2, 4, or 8 and is real-linearly equivalent to the real
  numbers, complex numbers, quaternions, or octonions through a map preserving the unit, multiplication,
  and norm form. The development also constructs the octonions from an explicit Fano multiplication table,
  proves Degen''s eight-square identity, and shows that Cayley--Dickson doubling preserves the composition
  law for associative inputs.'
