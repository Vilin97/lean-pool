main_results:
- declaration: CompositionAlgebra.hurwitz_classification
  informal: Every nontrivial finite-dimensional real Euclidean composition algebra is linearly equivalent
    to the real numbers, complex numbers, quaternions, or octonions through a map preserving the unit,
    multiplication, and norm form.
- declaration: CompositionAlgebra.finrank_eq_one_or_two_or_four_or_eight
  informal: The real dimension of a nontrivial finite-dimensional Euclidean composition algebra is exactly
    1, 2, 4, or 8.
- declaration: CompositionAlgebra.CD.instCompositionAlgebra
  informal: The Cayley--Dickson double of a nontrivial associative Euclidean composition algebra again
    satisfies the composition law.
- declaration: Octonion.nucleus_real
  informal: Any octonion that associates in the third slot with every pair has zero imaginary coordinates
    and hence lies on the real line.
