main_results:
- declaration: FirstOrder.ZFC.ModelZF
  informal: Bundles the ZF axioms (Emptyset, Pairing, Union, Powerset, Infinity, Regularity, Comprehension,
    Replacement) into a single model class.
- declaration: FirstOrder.ZFC.ext_induction
  informal: States the principle of mathematical induction over ω externally for any bounded formula in
    LZFC.
