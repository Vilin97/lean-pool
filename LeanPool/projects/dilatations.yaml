main_results:
- declaration: CategoryTheory.Dilatations.Dila_universal_property
  informal: For a nonempty indexed center in a category C and a functor F from C to D, assume that localization
    of D at the images of the chosen denominators is faithful and that each pushed-forward numerator sieve
    lies in the sieve generated by its mapped denominator. There is a unique functor from the dilatation
    to D whose composite with the canonical functor from C is F.
  source_ref: Section 5; original Theorem 3.10.
- declaration: CategoryTheory.Dilatations.Iso315
  informal: The successive dilatation at Z and the pushforward of W is isomorphic to the dilatation at
    the combined center Z.sum W, assuming that the composite canonical functor to the successive dilatation
    is Sigma-regular for Z.sum W. This regularity is an explicit hypothesis, not a theorem of the development.
  source_ref: Section 8.2 and Appendix B; conditional original Proposition 3.15.
- declaration: CategoryTheory.Dilatations.Iso318
  informal: For two families of numerator sieves with the same denominator morphisms, dilating at their
    combined two-copy center is isomorphic to dilating at the pointwise union of the sieves.
  source_ref: Section 8.3; original Proposition 3.18.
- declaration: CategoryTheory.Dilatations.Prop51.Iso51
  informal: For any multicenter in a commutative ring A, the categorical dilatation of the multiplicative
    one-object category of A at all finitely supported exponent profiles is isomorphic to the one-object
    category of the ring dilatation A[M]. At profile nu, the denominator is the product of a_i raised
    to nu_i and the numerator ideal is the product of (M_i + (a_i)) raised to nu_i.
  source_ref: Theorem 10.1; corrected original Proposition 5.1.
- declaration: CategoryTheory.Dilatations.NaiveCenterCounterexample.no_C_compatible_equiv
  informal: For A = Z[X], ideal (X), and denominator 2, there is no equivalence from the categorical dilatation
    at the naive one-index center to the one-object category of the ring dilatation that commutes strictly
    with the canonical functors from the base category.
  source_ref: Section 10.2 and Appendix B.
- declaration: CategoryTheory.Dilatations.Fact52.no_realizing_center
  informal: The constructed category with three arrows from X to Y admits no equivalence to a dilatation
    of the base category with two such arrows that commutes strictly with the canonical base functors.
    This is an explicit counterexample, not a classification of intermediate categories up to arbitrary
    equivalence.
  source_ref: Theorem 11.1.
- declaration: CategoryTheory.Dilatations.iteratedDilatationEquiv_existsUnique
  informal: For a multicenter M in any commutative ring A and any subset K of its indices, first dilate
    along K and then along the complementary ideals and denominators mapped to the first-stage ring. There
    is exactly one isomorphism of algebras over the first-stage ring from this two-stage dilatation to
    A[M], compatible with its canonical map.
  source_ref: Appendix C, Proposition C.1 and Lemma C.2.
