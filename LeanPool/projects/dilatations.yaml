slug: dilatations
title: Dilatations of categories and commutative rings
summary: Constructs categorical dilatations from sieves of permitted numerators and denominator morphisms,
  and proves their universal property for Sigma-regular functors satisfying the sieve containment condition.
  Develops restriction and union of centers, dual codilatations, and ordinary localization as a special
  case. The composition isomorphism retains the explicit Sigma-regularity hypothesis left open in the
  original paper. For commutative rings, an exponent-profile center recovers the ring dilatation; the
  naive single-index comparison is refuted over Z[X]. A finite category example refutes a general intermediate-category
  characterization. Independent ring modules provide fraction arithmetic, a universal property, reindexing,
  and the unique isomorphism for two-stage dilatations.
