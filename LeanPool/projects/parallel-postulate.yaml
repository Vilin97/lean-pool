slug: parallel-postulate
title: Independence of Playfair's axiom via Euclidean and Klein models
summary: Constructs Euclidean and Klein models of a synthetic Hilbert plane, proving that Playfair's axiom
  is independent of incidence, Pasch order, and congruence axioms, even with Archimedes and Dedekind continuity.
  Develops reusable coordinate geometry over ordered fields, projective motions, Klein angles and metric,
  smooth-path length and distance, congruence constructions, and a coordinate curvature calculation. Dedekind
  continuity replaces Hilbert's maximal completeness axiom; their equivalence is not formalized. Curvature
  uses Brioschi's formula, and distance uses C1 paths; no identification with Mathlib's Riemannian distance
  or connection curvature is asserted.
