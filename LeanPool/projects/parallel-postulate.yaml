main_results:
- declaration: ParallelPostulate.Hilbert.playfair_independent_continuous
  informal: There exists a Hilbert plane satisfying Archimedes and Dedekind continuity and Playfair's
    axiom, and there exists another satisfying the same continuity axioms and the negation of Playfair's
    axiom. The models use real coordinate planes with bounds zero and minus one.
  source_ref: Upstream Hilbert/Independence.lean. First publicly announced 2026-09-30 01:08:53 UTC at
    https://leanprover.zulipchat.com/#narrow/channel/583339-AI-authored-projects/topic/Independence.20Parallel.20Postulate/near/627942879.
    The author's follow-up discloses mostly AI-written proofs. Pasch order and Dedekind continuity are
    the stated variants; equivalence to plane separation and maximal completeness is not proved.
- declaration: ParallelPostulate.HyperbolicPlane.hyperbolic_parallels
  informal: Over any linearly ordered field, for every negative bound and every line in the bounded coordinate
    plane, infinitely many distinct lines pass through any point of the plane outside that line without
    meeting it.
- declaration: ParallelPostulate.HyperbolicPlane.kleinDist_eq_arsinh
  informal: For every negative real bound and every pair of points in its plane, the infimum of C1-path
    lengths in Klein's coordinate metric equals arsinh of the square root of minus the bound times apart,
    divided by the square root of minus the bound.
- declaration: ParallelPostulate.HyperbolicPlane.kleinMetric_curvature
  informal: For every real bound, Brioschi's coordinate curvature formula applied to the three coefficients
    of Klein's metric equals that bound at every point of its coordinate plane.
