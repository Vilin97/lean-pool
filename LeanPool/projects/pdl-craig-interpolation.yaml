slug: pdl-craig-interpolation
title: Craig interpolation and Beth definability for propositional dynamic logic
summary: Proves Craig interpolation for full propositional dynamic logic, including tests and Kleene star,
  by constructing interpolants from uniform cyclic tableaux. Interpolants use only atomic propositions
  and atomic programs common to the two formulas. The development also proves the local Beth definability
  property for a propositional letter, and supplies reusable syntax, Kripke semantics, Fischer-Ladner
  closure, tableau soundness and completeness, finite reachability and game-theoretic infrastructure.
  The results assert existence; no executable extraction algorithm or complexity bound is claimed. Human
  contributors and Aristotle jointly developed the formalization. The completeness modules reuse the finite
  game determinacy theorem already pooled in `LeanPool.Lean4GlCoalgebras` instead of duplicating it.
