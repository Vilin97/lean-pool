main_results:
- declaration: PDL.interpolation
  informal: If the implication from PDL formula phi to psi is valid in every Kripke model, there exists
    a PDL formula theta whose atomic proposition and program vocabulary is contained in the intersection
    of theirs, such that phi implies theta and theta implies psi in every model.
- declaration: PDL.beth
  informal: If a PDL formula phi implicitly determines a propositional letter p (all two-letter substitutions
    agree wherever both substituted formulas hold), there is a formula psi using only phi's vocabulary
    other than p such that phi entails that p is equivalent to psi.
- declaration: PDL.consIffSat
  informal: A free sequent is tableau-consistent if and only if it is satisfiable in a Kripke model.
