main_results:
- declaration: ExpChaotic.devaney_chaotic
  informal: The complex exponential is continuous, has dense periodic points, and the monoid action generated
    by its iterates is topologically transitive on the complex plane.
- declaration: ExpChaotic.juliaSet_exp
  informal: The Julia set of the complex exponential is the whole plane, where the Fatou set is defined
    by local normality of sphere-valued iterates with arbitrary locally uniform sphere-valued limits.
- declaration: ExpChaotic.dense_repellingPeriodicSet
  informal: Points p with a positive period n and derivative norm greater than one for the nth exponential
    iterate are dense in the complex plane.
- declaration: ExpChaotic.eventually_covers_compact
  informal: For every nonempty open set U in the complex plane and every compact set K omitting zero,
    all sufficiently large iterates of the exponential map send U onto a set containing K.
- declaration: ExpChaotic.dense_escapingSet
  informal: Points whose forward exponential orbit eventually leaves every centered Euclidean ball are
    dense in the complex plane.
- declaration: ExpChaotic.not_countable_denseOrbitSet
  informal: The set of complex points with dense forward exponential orbit is uncountable.
- declaration: ExpChaotic.not_tendstoLocallyUniformly_sphericalExpIterate
  informal: On every nonempty open set in the complex plane, no strictly increasing subsequence of exponential
    iterates converges locally uniformly to any function into the Riemann sphere.
