slug: exponential-chaos
title: Chaos and the Julia set of the complex exponential
summary: 'Formalizes the dynamics of z ↦ exp(z): escaping points, points with dense forward orbit, and
  repelling periodic points are dense in the complex plane; the map is chaotic in Devaney''s sense and
  its Julia set is the whole plane. The development proves eventual covering of every compact set omitting
  zero, constructs contracting inverse branches, and rules out every locally uniform spherical subsequential
  limit on nonempty open sets. It includes general normal-sequence restriction lemmas, quantitative open
  mapping, and a two-target obstruction for arbitrary separated uniform codomains. The Lean proofs were
  primarily generated by AI under Lasse Rempe''s direction. The initial six-lemma architecture adapts
  John Harrison''s HOL Light formalization, credited with its retained BSD notice in the entry module.'
