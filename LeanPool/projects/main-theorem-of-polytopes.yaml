main_results:
- declaration: MainTheoremOfPolytopes
  informal: The Minkowski–Weyl theorem — a set is a V-polytope iff it is a bounded H-polytope.
  source_ref: G. M. Ziegler, Lectures on Polytopes, GTM 152, Springer, 1995, Theorem 1.1.
- declaration: Vpolytope_of_Hpolytope
  informal: Every bounded H-polytope (finite intersection of half-spaces) is the convex hull of a finite
    point set.
