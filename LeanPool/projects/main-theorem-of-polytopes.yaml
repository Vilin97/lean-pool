slug: main-theorem-of-polytopes
title: The main theorem of polytopes
summary: Formalizes the Minkowski–Weyl theorem — the equivalence between V-polytopes (convex hulls of
  finite point sets) and bounded H-polytopes (finite intersections of half-spaces) in a finite-dimensional
  real vector space.
branch: convex geometry
