slug: erdos367
title: 'Erdős Problem #367'
summary: Formalizes upper and lower bound results for powerful parts of products of consecutive integers,
  including abc-conditional upper bounds, an unconditional odd r-full lower bound, a Pell-style limsup
  theorem, and polynomial arithmetic cores.
