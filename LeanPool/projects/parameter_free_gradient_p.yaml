slug: parameter_free_gradient_p
title: Parameter-Free Gradient Minimization in l_p Geometry
summary: Exact value-gradient query-complexity results for convex differentiable objectives on finite-dimensional
  real l_p spaces with attained minima and a positive global primal-to-dual Lipschitz-gradient bound.
  For finite real p > 1, the development proves strict-local scale-identification impossibility at LR/epsilon
  = 4 and a deterministic method family with three post-secant-initialization query-rate regimes. For
  p > 2 it also proves deterministic known-parameter upper and lower query exponents p/(p+2), with explicit
  horizon and dimension restrictions on the lower bound.
