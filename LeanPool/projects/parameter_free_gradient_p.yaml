main_results:
- declaration: V7.scaleIdentificationImpossibility
  informal: For finite real p > 1 and positive epsilon, measurable strict-local exact value-gradient methods
    satisfy scale-identification lower bounds on convex smooth one-dimensional objectives with unique
    minimizers, even at LR/epsilon = 4. The result includes deterministic and randomized finite-horizon
    statements and infinite worst-case expected queried-or-returned hitting time.
- declaration: V7.knownParameterAboveTwoOptimality
  informal: For finite real p > 2 and convex differentiable objectives with attained minima and a positive
    global primal-to-dual Lipschitz-gradient bound, deterministic known-parameter exact value-gradient
    methods have upper query exponent p/(p+2). The matching lower exponent concerns the first T queries,
    requires d >= 2 and 1 <= T <= d, and retains the explicit min(p, log d) dependence.
- declaration: V7.main
  informal: For convex differentiable objectives with attained minima and positive global L-Lipschitz
    gradients from l_p to its dual, one deterministic family works for every finite real p > 1 and positive
    epsilon after supplied nondegenerate secant initialization with 0 < M0 <= L. It returns a queried
    point with dual gradient norm at most epsilon. Writing R for distance to the minimizer set, the post-initialization
    oracle-call bound has polynomial dependence on max(1, LR/epsilon) with exponent 1/2 for 1 < p < 2
    and p = 2, and p/(p+2) for p > 2, plus additive log(e + L/M0) calibration cost. Constants depend only
    on p, with a universal constant at p = 2; discovering the secant pair is outside the count.
