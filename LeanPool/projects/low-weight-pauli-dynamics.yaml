main_results:
- declaration: Lean4LPD.PauliString.pauliNorm_layerStep_error_le_model_of_source_regime
  informal: For an observable supported on Pauli weights at most ko, a block of Γ positive-many disjoint-support
    layers of Hermitian rotations of weight at most kh, kh ≥ 2, and |sin θ| ≤ a ≤ αt/r with α > 0 and
    t ≥ 0, truncation to weight ko + m(kh - 1) after each of r blocks has Pauli 2-norm error at most (2Γ(kh
    - 1)αt)^(m+1) (e(m+1))^(ko/(kh-1)) times the input norm. The conditions include m ≥ 1, r ≥ 5, m ≤
    r, rΓ ≥ 8(m+1)^2, and r ≥ 8e^2(ko+kh-1)αt. Γ counts every layer of the actual block, including repeated
    product-formula layers.
  source_ref: Upstream STATEMENTS.md and Pauli/LayerError.lean at the pinned commit; norm-level counterpart
    of the revised supplement's truncation bound.
- declaration: Lean4LPD.l2_opNorm_le_schur
  informal: A finite rectangular matrix over any RCLike field, with absolute row sums bounded by nonnegative
    R and absolute column sums bounded by nonnegative C, has Euclidean operator norm at most sqrt(RC).
  source_ref: Upstream Schur.lean, finite-dimensional Schur test.
- declaration: Lean4LPD.PauliString.reachable_weight_le
  informal: Every Pauli string reachable through a list of disjoint-support kh-local layers, kh ≥ 1, has
    weight at most its initial weight times kh raised to the number of layers. Reachability is combinatorial;
    this theorem does not assert that a reachable coefficient is nonzero.
  source_ref: Upstream Pauli/LayerWitness.lean, effective-layer light cone.
- declaration: Lean4LPD.LayerCounterexample.actual_discard_exceeds_gamma_bound
  informal: For the explicit eight-qubit second-order word L1,L2,L2,L1 and angles 0 < θ < π/2, truncating
    the evolved weight-one input at weight one discards a nonzero coefficient of weight greater than four.
    Thus the two distinct layer types give an invalid bound 1*2^2; repetitions must be counted.
  source_ref: Upstream Pauli/LayerCounterexample.lean, exact symbolic witness.
