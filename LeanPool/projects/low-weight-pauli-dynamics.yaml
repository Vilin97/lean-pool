slug: low-weight-pauli-dynamics
title: Low-weight Pauli dynamics and truncation error
summary: Derives a normalized Pauli 2-norm truncation-error bound for concrete circuits of disjoint-support
  Hermitian Pauli rotations, with explicit locality, angle, step-count, and cutoff hypotheses. Develops
  a faithful matrix representation, Pauli coefficient reconstruction, finite Schur bounds, and reusable
  scalar multi-jump ladder estimates. Also proves a combinatorial light-cone bound and exact counterexamples
  showing why repeated product-formula layers must count toward the layer exponent. This is the norm-level
  analysis, not a formalization of expectation-value accuracy, Hamiltonian approximation, or the paper's
  full algorithm.
