slug: long-gaps-between-primes
title: Improved long gaps between consecutive primes
summary: Formalizes the unconditional lower bound showing that, for all sufficiently large X, the largest
  gap between consecutive primes below X is at least a positive constant times log X (log log X)^2 log
  log log log X / (log log log X)^2. The development includes the short-translates sieve proposition,
  divisor coefficient estimates, truncated product weights, moment bounds, and the Erdos--Rankin covering
  argument used to derive the headline result.
