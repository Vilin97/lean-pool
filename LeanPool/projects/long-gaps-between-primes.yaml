main_results:
- declaration: LongGapsBetweenPrimes.long_prime_gaps
  informal: There are a positive constant c and a real threshold X0 such that for every X at least X0,
    some pair of consecutive indexed primes below X has gap greater than c times log X (log log X)^2 log
    log log log X / (log log log X)^2.
- declaration: LongGapsBetweenPrimes.long_gap_theorem
  informal: For all sufficiently large X, there are consecutive primes p < q with q at most X and q -
    p at least a fixed positive multiple of the improved long-gap scale.
- declaration: LongGapsBetweenPrimes.short_translates
  informal: For all sufficiently large x, every sufficiently sparse subset S of an interval of length
    between x and x(log x)^2 has a translate b + Q(x)t + S consisting entirely of composite numbers, with
    1 <= t <= exp x.
