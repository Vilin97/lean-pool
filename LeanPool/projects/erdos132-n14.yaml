slug: erdos132-n14
title: A Conditional Fourteen-Point Case of Erdős Problem 132
summary: 'Formalizes the planar Hopf--Pannwitz diameter bound and proves the fourteen-point low-multiplicity
  conclusion conditional on exactly two remaining published interfaces: the known maximum-cardinality
  bound for planar sets with at most six distances and the Szöllősi--Östergård classification of thirteen-point
  planar six-distance sets. Internally derives the exact failure profile and endpoint deletion, constructs
  the three classified templates, eliminates the nonregular cases by multiplicity, and excludes the regular
  tridecagon extension by explicit second and fourth moments. The general Erdős problem remains open.'
