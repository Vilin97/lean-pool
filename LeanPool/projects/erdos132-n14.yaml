main_results:
- declaration: LeanPool.Erdos132N14.hopfPannwitzLowMultiplicityDistance14
  informal: Every injectively labelled fourteen-point planar configuration has a realized distance represented
    by at most fourteen unordered pairs; the proof chooses that distance to be a diameter.
  source_ref: The planar diameter bound, conventionally associated with Hopf--Pannwitz; Perles's clockwise-extreme
    endpoint proof.
- declaration: LeanPool.Erdos132N14.erdos132_for_fourteen_of_published_inputs
  informal: Assuming precisely the published planar few-distance cardinality and Szöllősi--Östergård classification
    interfaces, every injectively labelled fourteen-point planar configuration realizes at least two distances
    whose unordered-pair multiplicities are at most fourteen.
  source_ref: Erdős Problem 132; Hopf--Pannwitz's planar diameter bound; Wei, "A Proof of Erdős--Fishburn's
    Conjecture for g(6)=13," EJC 19(4) P38 (2012), doi:10.37236/2917; Szöllősi--Östergård, EJC 27(1) P1.23
    (2020), Table 1 and Theorem 16, doi:10.37236/8565.
