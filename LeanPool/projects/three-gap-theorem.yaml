slug: three-gap-theorem
title: The Three-Gap (Steinhaus) Theorem
summary: 'Formalizes the three-gap (Steinhaus, three-distance) theorem: for every real `a` and every `N`,
  the `N`-point orbit `{i·a mod 1 : i < N}` partitions `[0,1)` into gaps taking at most three distinct
  lengths, and when exactly three occur the largest is the sum of the other two. The proof works in `[0,1)`
  via `Int.fract` (not `AddCircle`) through the two first-return times `η⁺` and `η⁻`, and is uniform in
  the rotation number, covering rational and irrational `a` with no case split.'
