- declaration: SteinhausThreeGap.three_gap_lengths_eq
  informal: When the gaps take exactly three distinct lengths, those lengths are precisely the two first
    returns `η⁺`, `η⁻`, and their sum `η⁺ + η⁻`; in particular the largest gap is the sum of the other
    two.
