slug: komlos
title: The Komlós and Beck–Fiala bounds with constant 36
summary: Proves that finitely many real vectors of Euclidean norm at most one admit signs whose sum has
  every coordinate bounded by 36, and deduces the Beck–Fiala discrepancy bound 36 times the square root
  of the maximum vertex degree for finite hypergraphs. The Karingula–Lovett splitting argument is supported
  by reusable finite-distribution, total-variation, transport, convex-hull, and matrix-discrepancy infrastructure.
  The near-invariant distribution uses discrete squared tent weights, and real vectors are handled by
  coordinatewise truncation toward zero.
