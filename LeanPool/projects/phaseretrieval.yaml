slug: phaseretrieval
title: Stable phase retrieval for Hermite-Fock expansions
summary: Formalizes stable phase retrieval for finite Hermite-Fock polynomials and their Gaussian L2 closure
  in d complex dimensions, together with the quantitative one-dimensional Fock-space local stability estimate
  that underlies it.
branch: analysis
entry_module: LeanPool.PhaseRetrieval
authors:
- Susanna Bertolini
- Jaume de Dios Pont
source:
  title: Stable phase retrieval for Hermite-Fock expansions
  authors:
