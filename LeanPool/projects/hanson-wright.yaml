main_results:
- declaration: LeanPool.HansonWright.hanson_wright_inequality_hdp
  informal: For independent mean-zero real random variables with finite least global-MGF sub-Gaussian
    scales and positive maximum coordinate MGF scale, and a matrix with positive Frobenius and operator
    norms, the centered quadratic form satisfies the Hanson-Wright two-regime exponential tail bound with
    the fixed universal coefficient 1 / (256 * exp(1)^2).
- declaration: LeanPool.HansonWright.hasHansonWrightMGF_of_subgaussian
  informal: Given positive K and operator norm and C at least 64 * exp(1)^2, independent coordinates with
    global-MGF sub-Gaussian parameter K^2 satisfy the local quadratic cumulant-generating-function estimate
    needed for Hanson-Wright.
- declaration: LeanPool.bernstein_inequality
  informal: A finite family of independent, centered, uniformly bounded real random variables satisfies
    the classical scalar Bernstein tail inequality.
