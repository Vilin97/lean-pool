slug: hanson-wright
title: The Hanson-Wright inequality for sub-Gaussian quadratic forms
summary: Proves the finite-dimensional Hanson-Wright concentration inequality for quadratic forms of independent
  mean-zero sub-Gaussian real random variables whose maximum least global-MGF sub-Gaussian scale is positive,
  for matrices with positive Frobenius and operator norms. The bound uses the fixed universal coefficient
  1 / (256 * exp(1)^2). This is the MGF normalization of the usual result; no formal identification with
  an Orlicz psi-2 norm is claimed. The development derives the required moment-generating-function certificate
  instead of assuming it, and contributes reusable scalar Bernstein, Chernoff, cumulant, sub-Gaussian-process,
  and finite-maximum infrastructure.
