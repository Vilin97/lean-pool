slug: rado-theorem
title: Radó's theorem for Riemann surfaces
summary: Proves that every connected Hausdorff one-dimensional complex manifold is second countable. The
  development constructs a nonconstant harmonic function by Perron's method, builds the étale space of
  its harmonic-conjugate germs, and applies a formalized Poincaré-Volterra lemma to its discrete-fiber
  evaluation map.
