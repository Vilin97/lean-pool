main_results:
- declaration: rado_riemannSurface
  informal: Every connected Hausdorff topological space carrying the structure of a one-dimensional complex
    manifold has a second-countable topology.
- declaration: Rado.poincare_volterra
  informal: A connected Hausdorff, locally compact, locally connected and locally second-countable space
    is second countable whenever it admits a continuous, locally injective map into a second-countable
    Hausdorff space.
- declaration: Rado.exists_harmonic_extension
  informal: Every continuous real-valued function on a Euclidean circle extends continuously to its closed
    disk and harmonically to the open disk; unlike the existing LeanComplexAnalysis Poisson theorems,
    this constructs the harmonic function rather than assuming one.
- declaration: Rado.IsPerronFamily.surfaceHarmonicOn_perronSup
  informal: The pointwise upper envelope of a Perron family of surface subharmonic functions is harmonic
    on its open domain.
