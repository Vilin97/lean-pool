slug: polynomial-method-restricted-sums
title: The polynomial method and restricted sums of congruence classes
summary: Formalizes the polynomial method (Alon–Tarsi-style combinatorial Nullstellensatz arguments) and
  applies it to restricted sums of congruence classes, including Cauchy–Davenport, Dias da Silva–Hamidoune,
  and a Vandermonde coefficient formula.
branch: combinatorics
entry_module: LeanPool.PolynomialMethodRestrictedSums
authors:
- Nick Adfor
source:
  url: https://github.com/NickAdfor/The-polynomial-method-and-restricted-sums-of-congruence-classes
  github_repo: NickAdfor/The-polynomial-method-and-restricted-sums-of-congruence-classes
