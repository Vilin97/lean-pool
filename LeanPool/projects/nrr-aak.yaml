slug: nrr-aak
title: Equal-area and equal-perimeter convex partitions
summary: Formalizes the Akopyan–Avvakumov–Karasev theorem that every planar convex body can be partitioned
  into any prescribed positive number of convex pieces with equal area and equal perimeter. Area is Lebesgue
  measure and perimeter is Hausdorff measure of the boundary.
branch: convex geometry
main_declarations:
- HumanVerification.equalAreaEqualPerimeterPartition
main_results:
- declaration: HumanVerification.equalAreaEqualPerimeterPartition
  informal: Every compact convex planar set with nonempty interior admits a convex partition into any
    positive number of pieces whose areas and perimeters are all equal.
