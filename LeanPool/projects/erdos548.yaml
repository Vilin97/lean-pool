main_results:
- declaration: Erdos548.erdos_548
  informal: Let n ≥ k+1. Every simple graph on n vertices with at least (k−1)n/2 + 1 edges contains every
    tree on k+1 vertices as a subgraph (an injective graph homomorphism). This is Erdős Problem 548, the
    Erdős–Sós conjecture, in the benchmark phrasing.
- declaration: Erdos548.tree_free_edge_bound
  informal: If a tree T on t ≥ 2 vertices is not contained in a graph G on n ≥ 1 vertices, then 2·|E(G)|
    ≤ (t−2)·n. This is the classical sharp form of the Erdős–Sós bound.
- declaration: Erdos548.rooted_word_tree_bound
  informal: For a tree T on t ≥ 2 vertices rooted at r, a host graph G and a nonempty repetition-free
    host word of length n, the number of cut permutation words of that word whose cut ends at a neighbour
    of the first letter is at most the number supporting a rooted copy of T on the prefix plus (t−2)·n!.
- declaration: Erdos548.marked_word_gluing_count
  informal: For a permutation-closed family W of repetition-free words, all of the same length m, and
    families A, B, C of letter sets with C ⊆ A and A R ∧ B X → C (R ∪ X) for disjoint R, X, the marked
    cuts (l, k) with l ∈ W and k ≤ m qualifying for A plus those qualifying for B number at most the allowed
    cuts plus those qualifying for C.
