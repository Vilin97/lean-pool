slug: erdos548
title: The Erdős–Sós conjecture (Erdős Problem 548)
summary: 'Proves the Erdős–Sós conjecture (1962), Erdős Problem 548: every graph on n ≥ k+1 vertices with
  at least (k−1)n/2 + 1 edges contains every tree on k+1 vertices as a (not necessarily induced) subgraph.
  The headline statement is the FrontierMath Erdős benchmark statement, reviewed by Thomas Bloom and carried
  verbatim by Google DeepMind''s Formal Conjectures; the proof was found autonomously by GPT-6 Astra.
  It is a finite double counting over permutation words of the host vertices: rotating the first qualifying
  prefix of a cut word gives a gluing inequality for two rooted branches, and reversing the two blocks
  of a cut moves the root to a newly attached leaf. A strong induction on the order t of the tree bounds
  the adjacency-marked cut words by the rooted-copy count plus (t−2)·n!, so a tree-free host on n vertices
  has at most (t−2)n/2 edges, the sharp classical bound.'
