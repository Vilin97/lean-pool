main_results:
- declaration: MetricCodes.Johnson.main_binary_theorem
  informal: For every relative distance strictly between zero and one half, the combined variational upper
    bound on the asymptotic binary-code rate is valid and is strictly smaller than the MRRW rate.
- declaration: MetricCodes.Spherical.HigherHierarchy.main_general
  informal: Every feasible finite interlacing certificate gives an eventual exponential upper bound for
    spherical codes, while the spherical-code rate is bounded by the closed hierarchy's variational rate.
- declaration: MetricCodes.Spherical.HigherHierarchy.strict_hierarchy
  informal: At every angle parameter strictly between zero and one, successive levels of both the global
    and localized hierarchies improve strictly, with the localized hierarchy also strictly improving the
    row and classical bounds.
- declaration: MetricCodes.Spherical.HigherHierarchy.NumericalMaximum.eventually_kissingNumber_lt_published
  informal: In all sufficiently large dimensions, the kissing number is at most 2 raised to 0.39661 times
    the dimension.
