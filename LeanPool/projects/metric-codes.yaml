slug: metric-codes
title: Improved asymptotic bounds for binary and spherical codes
summary: Formalizes asymptotic coding bounds obtained from multilevel harmonic analysis, branching rules,
  and spectral decompositions. The development proves a binary-code exponent strictly below the MRRW rate,
  constructs a strict hierarchy of spherical-code bounds, and derives the published 0.39661 asymptotic
  kissing-number exponent. This import incorporates substantial proof and performance optimizations by
  Dean Cureton.
