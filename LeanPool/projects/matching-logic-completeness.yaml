main_results:
- declaration: MatchingLogic.locality
  informal: For a backward-closed subset of a matching-logic model, two valuations that agree inside the
    subset and both stay outside it otherwise give identical denotations after restriction to that subset.
- declaration: MatchingLogic.two_copies
  informal: The double-cover model over a nonempty backward-closed proper subset has exactly the denotation
    predicted by each of its two projections back to the original model.
- declaration: MatchingLogic.semantic_localization
  informal: For a closed theory and closed conclusion, global semantic consequence is equivalent to local
    consequence from the localized theory.
- declaration: MatchingLogic.strongLocalCompleteness
  informal: One-sorted basic matching logic has strong local completeness over an arbitrary one-sorted
    finitary signature when the element-variable type is countably infinite.
- declaration: MatchingLogic.global_completeness_entryIII
  informal: For a one-sorted finitary signature, closed premises and conclusion, and a countably infinite
    element-variable type, global semantic consequence is equivalent to derivability, with both soundness
    and local completeness discharged.
