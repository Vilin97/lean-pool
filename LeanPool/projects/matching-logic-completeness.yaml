slug: matching-logic-completeness
title: Global completeness of one-sorted definedness-free matching logic
summary: Formalizes the one-sorted case of Chen and Roșu's global-completeness argument and independently
  discharges its local-completeness oracle by mechanizing the canonical-model construction from their
  2019 Matching μ-Logic technical report (Theorem 73, Lemmas 80–81, and strong local completeness Theorem
  83). The resulting theorem supplies both local completeness and soundness for countably infinite variable
  types.
