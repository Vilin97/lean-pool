main_results:
- declaration: Sundog.SATReductionMain.sat_iff_decodes
  informal: 'The end-to-end reduction correctness: a formula is satisfiable iff its image under the composed
    3SAT-to-decoding reduction is a yes-instance of bounded-weight syndrome decoding.'
- declaration: Sundog.MatchingNPHard.threeDM_iff_X3C
  informal: The 3-dimensional matching instance has a perfect matching iff the reduced exact-cover-by-3-sets
    instance has an exact cover, both directions machine-checked.
- declaration: Sundog.Certificate.accept_sound
  informal: 'Soundness of the cheap syndrome-decoding verifier when it accepts: an exhibited light same-syndrome
    witness certifies the body is safe within the decoding radius.'
- declaration: Sundog.Certificate.reject_sound
  informal: 'Soundness of the verifier when it rejects: a sound column-weight lower bound on the minimum
    same-syndrome weight rules out every light witness, so the body is genuinely unsafe.'
