slug: list-edge-coloring-complete
title: Häggkvist–Janssen list edge colouring of complete graphs
summary: Proves that arbitrary lists of at least n colours on the edges of a complete graph with n vertices
  admit a proper list edge colouring. The proof constructs and proves uniqueness of the local rank certificate,
  identifies a nonzero extended-star polynomial coefficient, and applies Mathlib's combinatorial Nullstellensatz.
  This is an alternative proof presentation, not a literal translation of the article's argument. The
  conclusion uses Mathlib's actual edge type and line-graph colouring, with no certificate hypothesis
  and no restriction on the colour universe. This formalizes a classical theorem, not a new bound or a
  solution of the general list-edge conjecture.
