- declaration: LeanPool.ListEdgeColoringComplete.exists_listEdgeColoring_complete
  informal: For every finite vertex type V, arbitrary colour type and finite list on each edge of the
    complete graph, if every list has cardinality at least the number of vertices, there is a proper colouring
    of the line graph choosing a colour from each list. This includes orders zero and one.
  source_ref: Häggkvist–Janssen (1997), Theorems 1.1 and 3.1, complete-graph case.
