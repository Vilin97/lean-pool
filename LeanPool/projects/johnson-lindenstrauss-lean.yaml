main_results:
- declaration: JL.johnson_lindenstrauss
  informal: The abstract probabilistic-method union bound — if the summed per-pair distortion-failure
    probability is below one, a distortion-preserving map exists.
- declaration: JL.johnson_lindenstrauss_pointset
  informal: The end-to-end Johnson–Lindenstrauss lemma — a Gaussian random projection into k dimensions
    embeds any m-point set with (1 ± ε) distortion once k is logarithmic in m.
  source_ref: S. Dasgupta, A. Gupta, An elementary proof of a theorem of Johnson and Lindenstrauss, Random
    Structures and Algorithms 22 (2003), 60-65, doi:10.1002/rsa.10073.
- declaration: JL.qjlEstimator_unbiased
  informal: The QJL asymmetric 1-bit estimator is unbiased for the normalized inner product between key
    and query.
  source_ref: 'A. Zandieh, M. Daliri, I. Han, QJL: 1-Bit Quantized JL Transform for KV Cache Quantization
    with Zero Overhead, AAAI 2025, arXiv:2406.03482.'
- declaration: JL.qjlEstimator_concentration_exp
  informal: 'Sub-Gaussian distortion bound for the QJL 1-bit estimator: deviation at least ε has probability
    at most 2·exp(-m·ε²/(π·‖q‖²)).'
  source_ref: 'A. Zandieh, M. Daliri, I. Han, QJL: 1-Bit Quantized JL Transform for KV Cache Quantization
    with Zero Overhead, AAAI 2025, arXiv:2406.03482.'
