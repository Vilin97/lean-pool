slug: johnson-lindenstrauss-lean
title: The Johnson–Lindenstrauss Lemma and Quantized JL
summary: 'Formalizes the Johnson–Lindenstrauss lemma end to end — a Gaussian random projection preserves
  pairwise distances of a finite point set up to a (1 ± ε) factor, so a distortion-ε embedding of any
  m-point set exists once k is logarithmic in m — together with the quantized JL (QJL) one-bit sign sketch:
  unbiasedness of the asymmetric 1-bit estimator and its sub-Gaussian distortion bound.'
