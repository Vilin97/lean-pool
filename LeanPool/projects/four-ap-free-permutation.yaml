main_results:
- declaration: FourAP.exists_fourAPFree_positive_permutation
  informal: There exists a bijection of the positive integers such that no four increasing positions map
    to a nonconstant four-term arithmetic progression, including negative common differences.
- declaration: FourAP.explicitPositivePermutation_apFree
  informal: The explicit computable positive-integer permutation constructed in the development has the
    stated four-term progression avoidance property.
