main_results:
- declaration: BooleanIsoperimetry.harper_theorem
  informal: For every family of vertices in an n-dimensional Boolean cube, the simplicial initial segment
    of the same cardinality has a closed radius-one Hamming neighborhood no larger than that of the family.
- declaration: BooleanIsoperimetry.conwayGuyGapRigidity
  informal: In every dimension, any real row whose consecutive subset-sum gaps relative to the Conway--Guy
    reference row are at least one dominates that row coordinatewise.
