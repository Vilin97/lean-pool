slug: boolean-isoperimetry
title: Boolean Isoperimetry and Conway--Guy Coherent Gaps
summary: 'Formalizes Harper''s vertex-isoperimetric theorem for the Boolean cube: among all families of
  a fixed cardinality, the simplicial initial segment has the smallest closed radius-one Hamming neighborhood.
  Develops the supporting binomial-cascade identities, Kruskal--Katona shadow bounds, coordinate compressions,
  and the final dimension induction. Applies the coherent-gap certificate method to prove normalized consecutive-gap
  rigidity for the Conway--Guy sequence from its exact recurrence.'
