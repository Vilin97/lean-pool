main_results:
- declaration: BeckFialaMatrix.exists_rounding
  informal: Given a finite zero-one integer matrix with at most t ones per column, t at least one, and
    a rational vector in the unit cube, there is a zero-one integer vector whose discrepancy in every
    row is strictly less than t.
  source_ref: Rational unit-cube integer-making form with the stated strict discrepancy bound.
- declaration: BeckFialaMatrix.exists_rounding_preserving_integral
  informal: The strict rounding can additionally be chosen to leave every initially integral coordinate
    unchanged.
  source_ref: Strengthened conclusion of the floating-coordinate proof in the pinned source.
- declaration: BeckFialaMatrix.zero_bound_counterexample
  informal: The same universally quantified strict rounding claim without the assumption t at least one
    is false, already for a one-by-one zero matrix with t equal to zero.
  source_ref: Boundary-condition witness in the pinned formalization.
