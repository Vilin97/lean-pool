slug: beck-fiala-matrix
title: Strict Beck–Fiala rounding for incidence matrices
summary: Proves the rational integer-making form of Beck–Fiala rounding for finite zero-one incidence
  matrices with column degree bounded by a positive t. Every row has discrepancy strictly less than t,
  and initially integral coordinates are preserved. Includes the necessity of the positive-bound hypothesis.
  This is distinct from the Komlós discrepancy bound and from the non-strict hyperedge-selection rounding
  used in triangle packing.
