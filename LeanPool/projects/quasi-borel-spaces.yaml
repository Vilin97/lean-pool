main_declarations:
- QuasiBorelSpace
- OmegaQuasiBorelSpace
- QuasiBorelSpace.ProbabilityMeasure
main_results:
- declaration: QuasiBorelSpace
  informal: Defines a quasi-Borel space as a type with a set of random variables closed under constants,
    measurable precomposition, and gluing.
- declaration: QuasiBorelSpace.IsHom
  informal: Defines morphisms of quasi-Borel spaces as maps that preserve random variables under precomposition.
- declaration: OmegaQuasiBorelSpace
  informal: Combines the quasi-Borel and ω-complete partial order structures with the compatibility axiom
    of Vakar-Kammar-Staton.
- declaration: QuasiBorelSpace.ProbabilityMeasure
  informal: Defines the probability-measure monad on quasi-Borel spaces by quotienting pre-probability
    measures by integral equivalence.
