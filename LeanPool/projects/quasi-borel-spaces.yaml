slug: quasi-borel-spaces
title: Quasi-Borel Spaces
summary: Formalizes quasi-Borel spaces and quasi-Borel pre-domains, a category for higher-order probability
  theory.
branch: probability theory
entry_module: LeanPool.QuasiBorelSpaces
authors:
