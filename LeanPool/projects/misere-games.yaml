main_results:
- declaration: MisereGames.Form.Promain.of_universe
  informal: Shows that comparison modulo a universe is characterized by the maintenance-proviso test.
- declaration: MisereGames.IntegerInvertible.isPFree_of_propertyX
  informal: Proves that Property X makes the sum of two short p-free games p-free in an outcome-stable,
    hereditary, integer-invertible monoid.
- declaration: MisereGames.Form.Preservation.endLikeSeedToUniverse_bijective
  informal: Proves that universal closure gives a bijection from bounded end-like seeds to universes.
