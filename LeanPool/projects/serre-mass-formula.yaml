slug: serre-mass-formula
title: Serre's mass formula for totally ramified local-field extensions
summary: Proves both of Serre's mass formulas for totally ramified separable extensions of a nonarchimedean
  local field of any positive degree, together with the discriminant bound, tame-ramification criterion,
  finiteness dichotomy, convergence, and automorphism-weighted orbit count. The proof develops Eisenstein
  monogenicity, quantitative Newton-Hensel lifting, local constancy of root counts, and Haar measures
  of lattices over discrete valuation rings.
