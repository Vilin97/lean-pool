main_results:
- declaration: MassFormula.tsum_one_div_q_pow_c
  informal: For every nonarchimedean local field K with residue-field cardinality q and every positive
    integer n, the sum of q^(-c(L)) over the totally ramified degree-n subextensions L of a separable
    closure of K is n, where c(L) is the discriminant exponent minus n plus one.
- declaration: MassFormula.tsum_one_div_w_mul_q_pow_c
  informal: For every nonarchimedean local field K, positive n, and set of representatives of K-isomorphism
    classes of totally ramified separable degree-n extensions, the sum of 1/(|Aut_K(L)| q^c(L)) is one.
- declaration: MassFormula.sigma_infinite_iff
  informal: For positive n, the set of totally ramified separable degree-n subextensions is infinite exactly
    when K and its residue field have the same characteristic p and p divides n.
- declaration: MassFormula.sub_one_le_d
  informal: For positive n, the discriminant exponent of a totally ramified degree-n extension is at least
    n-1.
- declaration: MassFormula.c_eq_zero_iff
  informal: For positive n and a totally ramified degree-n extension, the wild discriminant exponent vanishes
    exactly when the residue characteristic does not divide n.
- declaration: MassFormula.summable_one_div_q_pow_c
  informal: For positive n, the real-valued series of the unweighted mass terms is summable.
- declaration: MassFormula.ncard_isomorphic_mul_w
  informal: For a nonarchimedean local field K and a totally ramified separable extension L of positive
    degree n, the number of K-isomorphic copies of L inside a separable closure, multiplied by |Aut_K(L)|,
    is n.
