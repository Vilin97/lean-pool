main_results:
- declaration: DirectedSpace
  informal: Definition of a directed topological space as a topological space with a class of directed
    paths closed under constant paths, concatenation, and monotone reparametrization.
- declaration: Dipath
  informal: A directed path in a directed space.
- declaration: Dipath.Dihomotopic
  informal: Dihomotopy equivalence relation on dipaths between fixed endpoints.
- declaration: DirectedVanKampen.directed_van_kampen
  informal: Proves the directed Van Kampen theorem, showing that the directed fundamental category functor
    sends the standard open cover square to a pushout in the category of categories.
