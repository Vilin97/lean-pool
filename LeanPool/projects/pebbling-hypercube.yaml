main_results:
- declaration: PebblingLean.Hypercube.Paper.optimalPebblingNumber_theta
  informal: 'The optimal pebbling number of Q_n has order (4/3)^n: there is a positive constant C with
    (4/3)^n <= o(Q_n) <= C * (4/3)^n for all n.'
- declaration: PebblingLean.Hypercube.Paper.lower_bound
  informal: The optimal pebbling number of Q_n is at least (4/3)^n, proved by a weight-function argument
    summing one-pebble weights over the cube.
- declaration: PebblingLean.Hypercube.Paper.upper_bound
  informal: The optimal pebbling number of Q_n is at most C * (4/3)^n for an explicit constant C, via
    a probabilistic recursive splitting construction.
