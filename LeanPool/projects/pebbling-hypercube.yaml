slug: pebbling-hypercube
title: Optimal Pebbling Number of the Hypercube
summary: Formalizes that the optimal pebbling number of the n-dimensional hypercube Q_n is Theta((4/3)^n).  Builds
  a weight-function lower bound of (4/3)^n and a probabilistic recursive upper bound C * (4/3)^n with
  an explicit constant, combining them into a two-sided big-Theta witness.
