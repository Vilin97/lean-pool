slug: chvatal-conjecture
title: Chvátal's conjecture and sharp Boolean correlation
summary: Formalizes Chang, Liu, and Liu's proof that a hereditary family on a finite nonempty ground set
  has a largest intersecting subfamily that is a star. Develops the sharp Boolean Fourier correlation
  inequality, its antipodal and quadratic forms, sharpness examples, and the weighted star theorem for
  nonnegative decreasing weights.
