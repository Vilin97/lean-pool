main_results:
- declaration: Chvatal.chvatal
  informal: Every intersecting subfamily A of a hereditary finite family D on a finite nonempty ground
    type has cardinality at most that of some star of D.
- declaration: Chvatal.exists_largest_intersecting_star
  informal: One star of D is itself intersecting and simultaneously dominates all intersecting subfamilies
    of the hereditary family D in size, on a finite nonempty ground type.
- declaration: Chvatal.sharp_correlation
  informal: For increasing Boolean functions f and g on any finite cube, the sum of squared Fourier coefficients
    of g weighted by the largest influence of f on each nonempty index is at most the harmonic mean of
    Cov(f,g) and Cov(f,g*), with zero-denominator value zero.
- declaration: Chvatal.two_spectral_le_quadratic_covariance
  informal: For increasing Boolean f and g and every real t, twice their squared Fourier energy over index
    pairs with odd intersection is bounded by t^2 Cov(f,g) + (1-t)^2 Cov(f,g*).
- declaration: Chvatal.antipodal_correlation
  informal: If g is also self-dual and the finite coordinate type is nonempty, Cov(f,g) is at least one
    quarter of f's minimum coordinate influence.
- declaration: Chvatal.andFunction_sharp
  informal: The AND function attains equality in the sharp correlation bound for every increasing Boolean
    second function, including constants.
- declaration: Chvatal.exists_largest_weighted_intersecting_star
  informal: For any nonnegative antitone real weight on subsets of a finite nonempty ground type, one
    full-cube star is intersecting and its total weight dominates every intersecting family.
