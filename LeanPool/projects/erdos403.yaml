slug: erdos403
title: Sums of Distinct Factorials That Are Powers of Two (Erdos Problem 403)
summary: 'Reconstructs the finiteness theorem for Erdos Problem 403: only finitely many sums of distinct
  factorials are powers of two, and every such power is at most 2^7 = 128 (the extremal solution 2! +
  3! + 5! = 128). The sharp bound is proved in the factorial number system via a single fixed modulus
  12!, with all computations kernel-pure.'
