slug: permanent-formula-lower-bound
title: Quartic-over-logarithmic lower bound for rational permanent formulas
summary: Proves that every valid rational arithmetic formula over the complex numbers computing the n-by-n
  permanent, for n at least 32, has at least n^4 / (192 log_2 n) variable leaves. The development derives
  the bound through coefficient-field transcendence degree, Jacobian minors, matching-polynomial identities,
  and a cyclic block decomposition.
