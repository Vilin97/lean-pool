slug: non-sofic-group
title: Existence of a finitely presented non-sofic group
summary: Constructs a finitely presented group that is not sofic, resolving the question whether every
  group admits arbitrarily accurate finite permutation approximations. The development combines an explicit
  elementary group with property T, a finite-table construction of a finitely presented group, finite-model
  expansion, and a local obstruction to sofic approximation.
