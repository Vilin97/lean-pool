main_results:
- declaration: PalomarCrouzeixPalencia.exists_unitary_power_dilation
  informal: Every contraction on a complex Hilbert space admits a unitary power dilation.
- declaration: PalomarCrouzeixPalencia.vonNeumann_inequality
  informal: Polynomial evaluation on a contraction is bounded by the polynomial supremum on the closed
    unit disk.
- declaration: PalomarCrouzeixPalencia.crouzeix_palencia
  informal: The closure of the numerical range is a polynomial spectral set with constant 1 + √2.
