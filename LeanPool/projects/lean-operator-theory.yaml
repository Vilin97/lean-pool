slug: lean-operator-theory
title: Unitary dilation and the Crouzeix–Palencia bound
summary: Proves unitary power dilation for Hilbert-space contractions, von Neumann’s polynomial inequality,
  and the Crouzeix–Palencia polynomial spectral-set estimate for the closed numerical range.
branch: operator theory
entry_module: LeanPool.OperatorTheory
authors:
- Ezzeri Esa
