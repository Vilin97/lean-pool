main_results:
- declaration: QuantumParallelRepetition.distributionUniformExponential
  informal: There is a universal positive constant giving an explicit exponential upper bound on the repeated
    entangled value of every finite game with positive gap and nonempty answer alphabets.
- declaration: QuantumParallelRepetition.standardQuantumParallelRepetition
  informal: Every finite two-player game whose entangled value is below one has exponentially decaying
    entangled value under parallel repetition.
