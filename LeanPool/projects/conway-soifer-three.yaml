slug: conway-soifer-three
title: Conway–Soifer covering conjecture for n = 3
summary: Proves that ten congruent closed equilateral triangles covering a filled equilateral triangle
  of side three have common side at least one, with arbitrary positions, rotations and overlaps. Consequently
  ten unit triangles cannot cover a triangle of side 3 + ε for ε > 0. Includes reusable finite halfspace
  and ray-endpoint geometry, orientation-independent support and area bounds, and verified Bernstein polynomial
  interval checkers. Four derived contact cases and 100 kernel-checked certificates close the proof without
  a certificate hypothesis.
