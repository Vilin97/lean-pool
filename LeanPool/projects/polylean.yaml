slug: polylean
title: Polylean Unit Conjecture Counterexample
summary: Formalizes Gardam's counterexample to Kaplansky's Unit Conjecture, including the Promislow group,
  group rings, torsion-freeness of the group, and the non-trivial unit in 𝔽₂[P].
branch: algebra
entry_module: LeanPool.Polylean
authors:
- Siddhartha Gadgil
- Anand Rao
source:
  arxiv: '2102.11818'
  doi: 10.4007/annals.2021.194.3.9
  github_repo: siddhartha-gadgil/Polylean
license: Apache-2.0
status: verified
provenance: human
main_declarations:
- LeanPool.Polylean.P.torsionFree
- LeanPool.Polylean.Gardam.GardamTheorem
main_results:
- declaration: LeanPool.Polylean.P.torsionFree
  informal: Proves that the Promislow group used in Gardam's construction is torsion-free.
- declaration: LeanPool.Polylean.Gardam.GardamTheorem
  informal: Proves Gardam's counterexample to Kaplansky's Unit Conjecture by constructing a non-trivial
    unit in the group ring 𝔽₂[P].
