main_results:
- declaration: LeanStationaryHarmonicMaps.StationaryHarmonicMap.StationaryW12LocMap
  informal: 'The public input package: a domain-variation stationary `W^{1,2}_{loc}` Sobolev map bundling
    a chosen weak gradient (`W12LocMapWitness`) with the vanishing domain first-variation identity. This
    is the object users construct to invoke the monotonicity theorem.'
- declaration: LeanStationaryHarmonicMaps.StationaryHarmonicMap.stationaryW12LocMonotonicity_euclidean
  informal: 'Witness-style monotonicity: from a stationary `W^{1,2}_{loc}` map package, the normalized
    weak energy `weakTheta` is monotone in the radius, `weakTheta Du a s <= weakTheta Du a r` for `0 <
    s <= r < R0`.'
- declaration: LeanStationaryHarmonicMaps.StationaryHarmonicMap.stationaryW12LocMonotonicityFormula_euclidean
  informal: 'Witness-style monotonicity formula: the increment of `weakTheta` equals the nonnegative annular
    radial-energy term, `weakTheta Du a r - weakTheta Du a s = weakMonotonicityRhs Du a s r` for `0 <
    s < r < R0`.'
- declaration: LeanStationaryHarmonicMaps.StationaryHarmonicMap.stationarySobolevMonotonicity_euclidean
  informal: 'Componentwise convenience wrapper: the same monotonicity inequality stated directly from
    the local `L^2`, measurability, weak-gradient, and first-variation hypotheses, without first constructing
    the witness package.'
