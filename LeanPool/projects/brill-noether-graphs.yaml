slug: brill-noether-graphs
title: Brill–Noether theory and gonality of finite graphs
summary: Formalizes Brill–Noether existence through genus five, chains of marked banana graphs and loops,
  the treewidth lower bound for gonality, and a tricycle example whose gonality drops under regular subdivision.
  Includes divisor and transmission infrastructure and the Demazure-product support used by vertex gluing.
branch: combinatorics and tropical geometry
main_declarations:
- Highlights.brill_noether_existence_through_five
main_results:
- declaration: Highlights.brill_noether_existence_through_five
  informal: Every finite connected loopless multigraph of genus g at most five has, for integers r and
    d, a divisor of degree d and rank at least r whenever (r + 1) * (g - d + r) ≤ g.
- declaration: Highlights.treewidth_le_gonality
  informal: On a finite connected loopless multigraph, for every natural number k, any degree-k divisor
    of rank at least one bounds the treewidth by k; this is the witness formulation of the treewidth lower
    bound for divisorial gonality.
- declaration: Highlights.gonality_drops_under_regular_subdivision
  informal: There is a graph whose divisorial gonality strictly decreases under a regular subdivision.
