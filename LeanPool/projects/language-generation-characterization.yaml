main_results:
- declaration: GenLimit.FiniteWitness.Simplified.ordinary_iff_finiteWitnesses
  informal: For any family H of infinite languages over a countably infinite universe, there exists one
    ordered-history generator that eventually outputs an unseen target element on every exact presentation
    of every target in H if and only if H admits a finite positive witness assignment whose nonempty active
    subfamilies always have infinite common intersection.
- declaration: GenLimit.FiniteWitness.Simplified.universal_normalization
  informal: Every ordered-history generator over a countably infinite universe has one set-driven normalization
    that locks on every infinite target on which the original generator succeeds on all exact presentations.
    The normalization is chosen before the target.
- declaration: GenLimit.FiniteWitness.ordinary_iff_width
  informal: A family of infinite languages over a countably infinite universe is generatable in the limit
    exactly when its separation width is at most omega.
- declaration: GenLimit.FiniteWitness.full_range
  informal: Over every countably infinite universe, every value in WithTop (WithTop Nat), representing
    0, 1, 2, ..., omega, omega+1, is the separation width of some family of infinite languages.
- declaration: GenLimit.FiniteWitness.bounded_capture
  informal: Over an arbitrary universe, every sequence of uniformly bounded finite sets has infinitely
    many terms contained in one set D such that D contains none of a prescribed countable list of infinite
    cores.
- declaration: GenLimit.FiniteWitness.executable_universal_normalization
  informal: The finite-search normalization on natural numbers locks on every infinite language on which
    the supplied generator eventually succeeds on every exact presentation. This is a semantic correctness
    theorem for the defined procedure, without a formal Turing-computability claim.
