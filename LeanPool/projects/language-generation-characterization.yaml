slug: language-generation-characterization
title: Finite witnesses and the width hierarchy for language generation
summary: Characterizes generation in the limit for arbitrary families of infinite languages over any countably
  infinite universe by finite positive witnesses. Ordered-history generators admit a single set-driven
  normalization, chosen before the target language. The separation-width invariant takes every value 0,
  1, 2, ..., omega, omega+1; generation is equivalent to width at most omega. Reusable infrastructure
  includes locking witnesses, positive separation, bounded diagonal capture over arbitrary universes,
  transport under equivalences, and finite-query normalization on natural numbers. The formalized scope
  is the semantic characterization and hierarchy, not the paper's additional density-one or Turing-computability
  results in Appendices D and E.
