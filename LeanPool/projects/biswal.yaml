main_results:
- declaration: Biswal.Theorem1.genFun_is_polynomial
  informal: Proves that the generating function attached to a partition is a polynomial whenever its parts
    are bounded by the parameter `m`.
- declaration: Biswal.Theorem1.genFun_coeff_eventually_pos
  informal: Proves that the coefficients of the generating function attached to a partition are eventually
    strictly positive.
- declaration: Biswal.Theorem23.thm_manifest_coeff_nonneg
  informal: Proves that every coefficient of the generating function is nonnegative, via the explicit
    Dyck-path lattice counting model.
