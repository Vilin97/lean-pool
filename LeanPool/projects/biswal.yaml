slug: biswal
title: Chebyshev Quotients and Demazure Multiplicities
summary: Formalizes positivity results for the coefficients of Chebyshev-type polynomial quotients attached
  to integer partitions, modelling Demazure multiplicities. Proves that the relevant generating function
  is a polynomial and that its coefficients are eventually positive (Theorem 1), gives explicit Cauchy-product
  and matrix-inverse formulas for the coefficients (Theorem 2), and establishes their nonnegativity through
  a Dyck-path lattice counting model (Theorem 3).
branch: algebraic combinatorics
