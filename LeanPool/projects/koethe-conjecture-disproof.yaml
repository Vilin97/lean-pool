slug: koethe-conjecture-disproof
title: Disproof of the Köthe conjecture (Krempa's matrix form)
summary: 'Refutes Köthe''s 1930 conjecture in Krempa''s matrix form: there is a ring R (the unitization
  of a nil algebra of three weighted backward shifts over the algebraic closure of F_2) with a nil two-sided
  ideal I such that the matrix ideal M_2(I) contains a non-nilpotent matrix. The compared theorem is exactly
  the negation of the research-open statement `Koethe.KotherConjecture.variants.general_matrix` from Google
  DeepMind''s Formal Conjectures, in every universe. The supporting library proves a multiprojective common-zero
  theorem via the Segre cone, the Nullstellensatz and Krull''s height theorem, a mask-mortality theorem
  for one-row matrix pencils, a diagonal construction of universal mortal sequences, and a linearization
  theorem reducing nilness of a three-generator algebra to nilness of its root-row pencils.'
