main_results:
- declaration: Koethe.KotherConjecture.variants.general_matrix.disproof
  informal: It is not the case that for every ring R, every nil two-sided ideal I of R and every finite
    index type n, the matrix ideal M_n(I) of M_n(R) is nil. This is the negation of Krempa's matrix form
    of Köthe's conjecture, stated verbatim as in Formal Conjectures.
- declaration: KoetheCounterexample.counterexample
  informal: In every universe there is a ring R with a nil two-sided ideal I such that some 2 x 2 matrix
    with entries in I is not nilpotent.
- declaration: KoetheMultiProjective.exists_common_zero
  informal: Over an algebraically closed field, at most 2N polynomials that are multihomogeneous of a
    common positive degree in each of N blocks of three variables have a common zero with no block equal
    to zero.
- declaration: KoetheCounterexample.maskMortality
  informal: Over an algebraically closed field, every one-row matrix pencil and every periodic mask with
    more than half of its residues free admit a mask-compatible word of nonzero letters whose forward
    product is the zero matrix.
- declaration: KoetheCounterexample.exists_universalMortalSequence
  informal: Over a countable field satisfying mask mortality there is a sequence of nonzero letter triples
    such that every pencil has all its windows of some fixed positive length equal to zero.
- declaration: KoetheCounterexample.nil_of_all_pencils_nil
  informal: If every root-row pencil lifted along three elements of an algebra is nilpotent, then the
    non-unital subalgebra they generate is nil.
