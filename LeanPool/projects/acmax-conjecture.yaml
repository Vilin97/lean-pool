main_results:
- declaration: ACMax.acmax_conjecture
  informal: For n ≥ 4, the algebraic connectivity of K₂,ₙ₋₂ is 2, and every simple graph on Fin n with
    exactly 2(n−2) edges has algebraic connectivity at most 2. Algebraic connectivity is the second-smallest
    eigenvalue of the combinatorial Laplacian, defined using Mathlib's ordered spectrum.
- declaration: ACMax.algConn_mul_sq_le
  informal: For a graph on any nonempty finite vertex type and any real vector whose coordinates sum to
    zero, algebraic connectivity times the squared norm is at most the Laplacian quadratic form.
- declaration: ACMax.algConn_le_two_of_testvector
  informal: A nonzero real vector with coordinate sum zero and Laplacian quadratic form at most twice
    its squared norm certifies algebraic connectivity at most 2.
- declaration: ACMax.algConn_completeBipartite_two
  informal: For n ≥ 4, the complete bipartite graph with parts of sizes 2 and n−2 has algebraic connectivity
    exactly 2.
