slug: acmax-conjecture
title: Kolokolnikov's ACMAX conjecture
summary: Proves that every simple graph on n ≥ 4 vertices with 2(n−2) edges has algebraic connectivity
  at most 2, attained by the complete bipartite graph K₂,ₙ₋₂. Develops Laplacian test-vector bounds, sparse
  cut certificates, and non-backtracking walk estimates used in the proof.
