main_results:
- declaration: MovingSofa.sofaConstant_eq_volume_gerversSofa
  informal: The supremum, in extended nonnegative real numbers, of the areas of all admissible moving
    sofas equals the area of the explicitly defined Gerver sofa.
  source_ref: Baek, Optimality of Gerver's Sofa, Theorem 1.1. Upstream Lean completion a0753860f1d2b4424e059c35e64ad611be71a415
    (2026-09-20 10:55:24 UTC), announced 2026-09-20 18:42:40 UTC at https://x.com/deancureton/status/2101743865392926967.
    The imported commit has identical Lean sources; its later change is documentation only.
- declaration: MovingSofa.GerversSofa.ABφθSpec.existsUnique
  informal: Gerver's four defining equations have exactly one quadruple of parameters with A and B nonnegative
    and 0 ≤ φ ≤ θ ≤ π/4.
  source_ref: Romik, Differential equations and exact solutions in the moving sofa problem, equations
    (1)-(4), arXiv:1606.08111. The GerverSofaLean v1.1.0 release archive (MIT, Dawid Trela) has SHA-256
    7c496150f709ac709ae01f4836e9a702a18f752450efa69f15cf44264c0c2f77.
- declaration: MovingSofa.isMovingSofa_gerversSofa
  informal: Gerver's sofa is closed and connected and admits a continuous rigid motion from the horizontal
    arm to the vertical arm, starting at the identity and remaining within the unit-width hallway throughout.
