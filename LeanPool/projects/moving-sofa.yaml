slug: moving-sofa
title: Optimality of Gerver's sofa
summary: 'Formalizes Baek''s solution of the moving sofa problem: Gerver''s sofa attains the supremum
  of the areas of closed connected shapes that can move continuously around a right-angled corner in a
  unit-width hallway. Includes certified Gerver parameters, admissibility, convex cap geometry, Stieltjes
  curve area, Jordan separation, polygon approximation, and the concave quadratic upper bound.'
