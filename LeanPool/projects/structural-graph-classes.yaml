slug: structural-graph-classes
title: Split, cograph and threshold graph structures
summary: Connects split partitions, cotrees and threshold creation sequences on Mathlib SimpleGraph. Proves
  the finite forbidden-induced-subgraph characterizations, split iff chordal and co-chordal, and completeness
  of cotrees and creation sequences. Supplies certificate-preserving operations, twins and nonempty union/join
  decompositions for cographs, maximum-clique split partitions, and induced/isomorphic transport of existing
  chordal elimination orders and clique trees. Classical graph theory is formalized; no new mathematical
  theorem, canonical certificate or recognition-time bound is claimed.
