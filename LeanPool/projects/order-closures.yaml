slug: order-closures
title: Order closure, order adherence and Fatou norms
summary: Formalizes order and unbounded-order adherence in vector lattices, the Gao-Leung characterization
  of order-continuous norms on sigma-order-complete Banach lattices, and the Solovay/Stone-space construction
  of order-complete C(K) spaces with arbitrarily large density and norm-closed separable sublattices whose
  only order-closed vector-sublattice extension is the whole C(K) space. Constructs solid sets with a
  prescribed infinite number kappa of solid generators whose adherence towers are strict below any ordinal
  at most kappa's successor cardinal. Constructs a complete weakly Fatou lattice norm with constant 2
  that is not equivalent to any Fatou lattice norm. Includes reusable vector-lattice, net-convergence,
  sublattice, seminorm, Boolean-algebra and transfinite-iteration infrastructure.
