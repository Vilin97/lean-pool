main_results:
- declaration: OrderClosures.gaoLeung_orderContinuous_characterization
  informal: 'For a sigma-order-complete Banach lattice X, the following are equivalent: every vector sublattice
    has order-closed order adherence; every vector sublattice has equal order and unbounded-order adherence;
    and the norm of X is order continuous.'
  source_ref: Paper Theorem 1.1, recalling Gao-Leung Theorem 2.7.
- declaration: OrderClosures.gao_counterexample
  informal: For every cardinal kappa there is a compact Hausdorff space K such that C(K, R) is order complete
    and has density at least kappa, with a norm-closed separable vector sublattice Y whose only order-closed
    vector-sublattice extension is all of C(K, R).
  source_ref: Paper Proposition 2.1, via the Solovay Boolean algebra.
- declaration: OrderClosures.solid_sets_require_arbitrarily_many_iterations
  informal: For every infinite cardinal kappa and ordinal xi at most the initial ordinal of kappa's successor
    cardinal, there is a vector lattice and a solid set with solid generator number kappa whose order-adherence
    tower has a proper step at every stage below xi. The witness and cardinal/ordinal parameters are lifted
    one universe in Lean.
  source_ref: Paper Theorem 2.6, with its explicit infinite-cardinal hypothesis. Lean strengthens the
    stated size-kappa generating-set conclusion to minimum solid generator number exactly kappa; this
    exact-minimum conclusion is proved in the formalization, not stated in the paper.
- declaration: OrderClosures.exists_weaklyFatou_not_equivalent_fatou
  informal: There is a real vector lattice with a complete lattice norm p satisfying the weak Fatou property
    with constant 2, such that no lattice norm q with the Fatou property is equivalent to p. Norms, completeness
    and equivalence are represented explicitly by PaperLatticeNorm, IsCompleteFor and EquivalentNorms.
  source_ref: Paper Theorem 3.1; self-contained construction of the result previously announced by Anthony
    Wickstead and credited to Michael Elliott. The paper credits Jaume de Dios Pont for an earlier Lean
    formalization of this result.
