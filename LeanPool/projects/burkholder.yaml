slug: burkholder
title: Burkholder Martingale Transform Inequality
summary: 'Formalizes Burkholder''s sharp Lp inequality for real-valued martingale transforms: if `f` is
  a discrete martingale and `w` a predictable multiplier bounded by `1`, then the Lp norm of the transform
  `w ⋆ₘ f` is at most `(pStar p - 1)` times the Lp norm of `f`, where `pStar p` is the maximum of `p`
  and its conjugate exponent. The proof builds the Burkholder special function as a majorant of the relevant
  payoff in each exponent regime (`1 < p < 2`, `p = 2`, `p > 2`).'
