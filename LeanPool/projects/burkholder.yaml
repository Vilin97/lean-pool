main_results:
- declaration: MeasureTheory.Lp_Burkholder_inequality_martingaleTransform
  informal: 'The sharp Lp Burkholder inequality: for a discrete martingale `f` and a predictable multiplier
    `w` with `|w n| ≤ 1`, the Lp norm of the martingale transform `(w ⋆ₘ f) n` is bounded by `(pStar p
    - 1)` times the Lp norm of `f n`.'
- declaration: MeasureTheory.martingaleTransform_martingale
  informal: The martingale transform of a martingale by a strongly predictable bounded multiplier is itself
    a martingale.
- declaration: Majorants.exists_majorant_p_g_1
  informal: For every exponent `p > 1` there exists a Burkholder majorant, the special function dominating
    the payoff and driving the inequality.
