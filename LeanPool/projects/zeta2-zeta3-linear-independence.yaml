main_results:
- declaration: Zeta32.one_zeta_two_zeta_three_linearIndependent
  informal: The three complex numbers 1, riemannZeta 2, and riemannZeta 3 are linearly independent over
    the rational numbers.
  source_ref: 'Upstream Zeta32/Final.lean and Solution.lean at the pinned commit. First public proof release:
    2026-09-30 03:47:38 UTC, commit ec4fcb5617126b0a861f9e0c16f95425b32d4638. The upstream README and
    NOTICE disclose substantial AI assistance. The polynomial argument is credited upstream to Fauzan;
    this card cites the Lean artifact, not a separately verified paper.'
- declaration: Zeta32Acceptance.one_zeta_two_zeta_three_linearIndependent_series
  informal: For rational a, b, and c, if a plus b times the real sum of 1/(k+1)^2 plus c times the real
    sum of 1/(k+1)^3 is zero, then all three coefficients are zero; both sums range over natural numbers
    k.
- declaration: Zeta32.zeta3_sub_rat_mul_zeta2_irrational
  informal: For every rational r, the real series for zeta(3) minus r times the real series for zeta(2)
    is irrational.
