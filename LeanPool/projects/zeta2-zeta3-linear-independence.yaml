slug: zeta2-zeta3-linear-independence
title: Linear independence of 1, zeta(2), and zeta(3)
summary: Proves that 1, the Riemann zeta function at 2, and its value at 3 are linearly independent over
  the rationals, using integer polynomial approximation, p-adic coefficient bounds, prime-edge nonvanishing,
  and logarithmic potential energy estimates for Hankel determinants. Includes reusable irrationality
  criteria, contour integration, Andreief identities, Newton-basis valuation bounds, and energy inequalities
  for finite measures. The cited source is the completed Lean proof; independent novelty of the informal
  argument is not claimed.
