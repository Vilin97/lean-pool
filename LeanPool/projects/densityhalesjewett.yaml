slug: densityhalesjewett
title: The density Hales–Jewett theorem and Szemerédi's theorem
summary: 'A Lean 4 formalization of the density Hales–Jewett theorem: for every finite alphabet α and
  every density δ > 0, all sufficiently large n have the property that any set of at least δ·|α|^n words
  of length n over α contains a combinatorial line. The basis for the formalization is the combinatorial
  proof of Dodos, Kanellopoulos, and Tyros. As a consequence, we also formalize Szemerédi''s theorem on
  the integers: for every k ≥ 3 and δ > 0, the following holds for all sufficiently large n. Any subset
  of {0, …, n−1} of size at least δ·n contains a nonconstant arithmetic progression of length k.'
