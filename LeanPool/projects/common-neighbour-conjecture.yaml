slug: common-neighbour-conjecture
title: Common-neighbour counterexamples for Saxl graphs
summary: Proves that for every base size B at least two and every prescribed degree bound, there is a
  finite faithful primitive permutation group of at least that degree and exact base size B whose generalized
  Saxl graph contains two nonadjacent vertices with no common neighbor. The supporting library constructs
  an explicit infinite family from binary deleted permutation modules over finite fields and proves the
  required base-size, irreducibility, primitivity, and graph-theoretic properties.
