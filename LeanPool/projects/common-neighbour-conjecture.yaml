main_results:
- declaration: SaxlCounterexamples.MainTheorems.mainTheorem
  informal: For every natural number B at least two and every degree bound, there exists a finite faithful
    primitive permutation group of degree at least the bound and base size exactly B whose generalized
    Saxl graph has two nonadjacent vertices with no common neighbor.
- declaration: SaxlCounterexamples.EveryBase.hq_coreFamily
  informal: For every odd d with 3 ≤ d and every tail, the explicit affine wreath-product family has exact
    base size tail + 2, acts primitively, and its displayed pair has no common neighbor in the corresponding
    generalized Saxl graph.
