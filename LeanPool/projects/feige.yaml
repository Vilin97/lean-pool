main_results:
- declaration: Feige.sharp_unit_slack_feige_complete
  informal: For every positive dimension n and every small-universe probability space, the sharp fixed-dimensional
    lower bound for the strict event that a sum of independent nonnegative random variables is below its
    expectation plus one is (n/(n+1))^n, and an explicit finite family proves optimality.
- declaration: VlassisThomas.exactCalibration
  informal: On every small-universe probability space, the Dirichlet statistic used in the proof is super-uniform
    for every independent family of measurable, integrable, nonnegative random variables whose coordinate
    means are at most one.
- declaration: Grunbaum.grunbaum_centroid_halfspace
  informal: Every closed halfspace containing the centroid of a positive-volume convex body in finite-dimensional
    Euclidean space contains at least the sharp Grünbaum fraction of the body's volume.
