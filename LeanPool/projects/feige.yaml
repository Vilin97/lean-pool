slug: feige
title: Feige's sharp unit-slack inequality
summary: 'For small-universe probability spaces, proves the sharp fixed-dimensional unit-slack lower bound
  for sums of independent nonnegative random variables: if each coordinate has mean at most one, then
  the probability that the sum lies below its mean plus one is at least (n/(n+1))^n, and this constant
  is optimal. The supporting library formalizes the Vlassis--Thomas exact distribution-free calibration
  theorem, Grünbaum''s centroid-halfspace inequality and sharp simplex example, and the normalized-exponential
  bridge joining them.'
