main_results:
- declaration: ChannelCapacity.exists_unique_capacity_achieving_prior_of_finite
  informal: For a Markov kernel between finite alphabets (nonempty input) whose rows are linearly independent
    (`Kernel.RowMatrixFullRank`), a capacity-achieving input prior exists and is unique.
  source_ref: R. G. Gallager, Information Theory and Reliable Communication, Wiley, 1968, Section 4.5.
- declaration: ChannelCapacity.exists_unique_capacity_achieving_prior_discharged
  informal: For compact-Polish channels with a common strictly positive jointly continuous density, given
    injectivity of the prior-pushforward map and upper semicontinuity of mutual information (the latter
    carried as a field of `Kernel.ContinuousPositiveDensity`, not derived), the capacity-achieving prior
    is unique.
- declaration: ChannelCapacity.exists_unique_capacity_achieving_prior
  informal: 'General measure-theoretic packaging: under abstract well-conditioning hypotheses, the capacity-achieving
    prior is unique.'
