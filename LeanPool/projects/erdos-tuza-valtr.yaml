slug: erdos-tuza-valtr
title: The Erdős–Tuza–Valtr conjecture
summary: Formalizes the Erdős–Tuza–Valtr conjecture, a sharp refinement of the Erdős–Szekeres happy-ending
  theorem, proving that any general-position point set of size at least C(n+2,2)+2 contains the target
  cup–cap configuration.
