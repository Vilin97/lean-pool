    Claude assistance and reviewed by rainrzk; the informal tutorial is rainrzk (2022).
- declaration: LeanPolyLog.Proofs.A002
  informal: Li_2(1/(1+i)) equals 5 pi^2/96 - log^2(2)/8 plus i times (pi log(2)/8 - G).
  source_ref: Upstream Statements.lean and Proofs/A002.lean at the pinned commit; README prior-appearance
    table and blueprint/ERRATA.md label classical sources and corrections. Lean proofs were written with
    Claude assistance and reviewed by rainrzk; the informal tutorial is rainrzk (2022).
- declaration: LeanPolyLog.Proofs.A003
