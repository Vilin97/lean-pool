- declaration: LeanPolyLog.Proofs.A015
  informal: The integral from 0 to pi/2 of x log^2(sin x) equals Li_4(1/2) - 19 pi^4/2880 + log^4(2)/24
    + pi^2 log^2(2)/12.
  source_ref: Upstream Statements.lean and Proofs/A015.lean at the pinned commit; README prior-appearance
