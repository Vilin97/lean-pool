slug: polylog-integrals
title: Polylogarithms and sixteen log-trigonometric integral identities
summary: Formalizes the sixteen A-series identities from rainrzk's PolyLog Integrals tutorial, together
  with reusable real and complex polylogarithm series, absolute convergence on the closed unit disk, differentiation,
  duplication, Euler reflection and Landen identities, logarithmic moments, Fubini kernels and radial
  integration machinery. The formulas involve Catalan's constant, zeta(3), Li_4(1/2) and Im Li_3((1+i)/2).
  These are classical identities, not new informal results. A004 uses the corrected factor pi^2/24; A014
  uses a proved expression entirely inside the unit disk, replacing the tutorial's invalid series expansion.
  A015 uses radial differentiation instead of a half-disc contour integral. The formalization was materially
  completed on 2026-10-01 at 00:01:57 UTC. The 2022 informal tutorial is older; the eligibility date is
  that of the completed Lean proofs.
