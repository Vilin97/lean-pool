- declaration: LeanPolyLog.Proofs.A016
  informal: The integral from 0 to 1 of Li_3(x)/(x sqrt(1-x^2)) equals Li_4(1/2)/2 + 41 pi^4/5760 + log^4(2)/48
    + pi^2 log^2(2)/6.
  source_ref: Upstream Statements.lean and Proofs/A016.lean at the pinned commit; README prior-appearance
    table and blueprint/ERRATA.md label classical sources and corrections. Lean proofs were written with
