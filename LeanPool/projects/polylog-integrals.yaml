- declaration: LeanPolyLog.Dilog.hasDerivAt_Li_succ
  informal: For every natural s and nonzero complex z in the open unit disk, Li_(s+1) has derivative Li_s(z)/z
    at z.
  source_ref: Upstream Lemmas/DilogComplex.lean, termwise differentiation.
- declaration: LeanPolyLog.Dilog.Li_two_add_Li_two_div_sub_one
  informal: For complex z of norm at most 1 and real part at most 1/2, Li_2(z) + Li_2(z/(z-1)) = -log^2(1-z)/2,
    with the principal logarithm.
  source_ref: Upstream Lemmas/DilogComplex.lean, complex Landen identity.
- declaration: LeanPolyLog.Arcsin.integral_Lir_div_mul_sqrt
  informal: For s at least 2 and a measurable nonnegative weight w on (0,1] with integrable moments equal
    to 1/(n+1)^s, the integral from 0 to 1 of Li_s(x)/(x sqrt(1-x^2)) equals the integral from 0 to pi/2
    of w(sin t) times (pi/2+t).
  source_ref: Upstream Lemmas/Arcsin.lean, moment representation and Fubini.
- declaration: LeanPolyLog.Radial.integral_im_logCube
  informal: If (log^3((1+r)/2)-log^3((1-r)/2))/r is interval integrable from 0 to 1, its integral equals
    the integral from 0 to pi of the imaginary part of the cube of the principal complex logarithm of
    (1+exp(i t))/2.
  source_ref: Upstream Lemmas/Radial.lean, radial differentiation and domination.
