main_results:
- declaration: KasamiCyclicAdditive.carlet_kasami_cyclic_additive_literature
  informal: For every finite field K of characteristic two with |K| = 2^n, every k coprime to n, and all
    distinct nonzero v₁ and v₂ in K, the coefficient triple count of the normalized Kasami derivative
    image is exactly 2^(2n-3).
- declaration: KasamiCyclicAdditive.carlet_kasami_cyclic_additive_core
  informal: In the normalized range 1 ≤ k < n, the same coefficient triple count is 2^(2n-3), assuming
    characteristic two, |K| = 2^n, coprimality, and distinct nonzero coefficients.
- declaration: KasamiCyclicAdditive.kasami_half_size
  informal: Under the normalized admissibility hypotheses, the image of the Kasami derivative has exactly
    half as many elements as the field.
