slug: kasami-cyclic-additive
title: Carlet's Kasami cyclic-additive conjecture
summary: 'Proves Carlet''s cyclic-additive conjecture for the Kasami power function: over every finite
  field of characteristic two with cardinality 2^n and every k coprime to n, the normalized derivative
  image has the exact coefficient triple count 2^(2n-3) for all distinct nonzero slopes. The development
  combines the Müller--Cohen--Matthews permutation theorem, multiplicative character sums, Fourier inversion,
  and a Fermat-cubic Frobenius-kernel argument.'
