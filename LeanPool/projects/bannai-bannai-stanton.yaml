slug: bannai-bannai-stanton
title: The Bannai-Bannai-Stanton Bound on Distance Sets
summary: 'Formalizes the Bannai-Bannai-Stanton theorem: a distance set `S` in `ℝ^d` realizing `s` distinct
  distances has size at most `Nat.choose (d + s) s`. Follows the short polynomial-method proof of Petrov
  and Pohoata via a generalized Croot-Lev-Pach rank lemma, with auxiliary results on the diagonal linear-independence
  argument for polynomials, monomial counting of bounded degree, and a rank bound for sums of matrices.'
branch: combinatorics
