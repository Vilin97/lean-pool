main_results:
- declaration: NavierStokes.Comparator.navier_stokes_breakdown_R3
  informal: For every positive viscosity, there are smooth divergence-free initial data and smooth forcing
    on ℝ³, with the prescribed spatial and temporal decay, admitting no global smooth Navier–Stokes solution
    with uniformly bounded kinetic energy.
- declaration: NavierStokes.Comparator.navier_stokes_breakdown_periodic
  informal: For every positive viscosity, there are smooth periodic divergence-free initial data and smooth
    periodic forcing with the prescribed temporal decay, admitting no global smooth periodic Navier–Stokes
    solution.
- declaration: Euler.euler_breakdown_R3
  informal: There exist smooth divergence-free initial data on ℝ³ whose spatial derivatives decay faster
    than every polynomial and which admit no global smooth unforced Euler solution with uniformly bounded
    kinetic energy.
- declaration: Euler.exists_compact_smooth_euler_singularity
  informal: There exist nonzero smooth compactly supported divergence-free initial data, a maximal time
    0 < Tstar ≤ 1, and an unforced Euler solution on [0, Tstar) in the all-order Sobolev class with bounded
    kinetic energy. Smooth Sobolev solutions on [0, T] exist exactly when T < Tstar. The velocity C¹ norm
    has infinite left limsup at Tstar, and the time integral of the spatial supremum of the vorticity
    norm diverges.
