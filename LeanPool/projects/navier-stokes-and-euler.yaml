slug: navier-stokes-and-euler
title: Finite-time breakdown for Navier–Stokes and Euler
summary: Formalizes forced three-dimensional Navier–Stokes breakdown on Euclidean space and the periodic
  torus for every positive viscosity, and finite-time singularity formation for unforced Euler from smooth,
  compactly supported, divergence-free initial data. The Euler result specifies maximal Sobolev lifespan,
  divergence of the velocity C¹ norm, and divergence of the time integral of the vorticity norm.
