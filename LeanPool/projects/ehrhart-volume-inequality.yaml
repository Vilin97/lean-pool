main_results:
- declaration: Ehrhart.Volume.ehrhart_volume_inequality_for_sets
  informal: In every positive dimension, a compact full-dimensional convex set with barycenter zero and
    origin as its unique interior lattice point has volume at most (n + 1)^n / n!.
- declaration: Ehrhart.SimplexVolume.normalizedVolume_centeredSimplex
  informal: The centered dilation of the standard n-simplex has normalized volume exactly (n + 1)^n /
    n!, so the volume bound is sharp.
- declaration: Ehrhart.SimplexVolume.barycenter_centeredSimplex
  informal: The centered dilation of the standard simplex has barycenter zero.
- declaration: Ehrhart.SimplexVolume.exists_centeredBody_sharp
  informal: In every positive dimension there exists a centered convex body with a unique interior lattice
    point that attains the sharp volume bound.
