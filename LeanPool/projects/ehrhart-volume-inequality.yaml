slug: ehrhart-volume-inequality
title: Ehrhart's sharp volume inequality
summary: Proves Ehrhart's sharp upper bound for the volume of a centered full-dimensional convex body
  whose origin is its unique interior lattice point. The development builds the weighted complex-analytic
  and variational machinery needed for the bound and verifies sharpness using the centered simplex, including
  its barycenter and exact volume.
