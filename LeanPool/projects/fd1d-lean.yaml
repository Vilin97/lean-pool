title: Optimal fully dynamic matching on the line
summary: Constructs a measurable hierarchical policy for fully dynamic matching of uniformly arriving
  demand and replenishment on the unit interval. Proves logarithmic-over-inventory bounds for long-run
  root-mean-square distance from every initial inventory and for initialized finite-horizon expected average
  cost.
branch: probability and optimization
main_declarations:
- FD1D.V5.Palomar.optimalDynamicMatchingUpperBound
main_results:
- declaration: FD1D.V5.Palomar.optimalDynamicMatchingUpperBound
  informal: For every inventory size m at least two, an online policy has long-run RMS cost at most (72000/log
    2) log(m+1)/m from every initial inventory, and the same expected-average-cost bound after initialization
    for horizons at least 2m².
