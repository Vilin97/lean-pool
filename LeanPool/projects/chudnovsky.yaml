- declaration: Chudnovsky.chudnovskySum_eq_pi_inv
  informal: 'Proves the Chudnovsky series identity, i.e. Mathlib''s `chudnovskySum = π⁻¹`: the series
    (12 / 640320^(3/2)) · ∑ₙ (-1)ⁿ (6n)! (545140134 n + 13591409) / ((3n)! (n!)³ 640320^(3n)) sums to
    1/π.'
