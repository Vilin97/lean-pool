main_results:
- declaration: SimpleGraph.IsChordal.exists_isPEO
  informal: Every finite chordal graph admits a perfect elimination order.
- declaration: SimpleGraph.isChordal_iff_nonempty_cliqueTree
  informal: A finite graph is chordal if and only if it has a rooted clique tree.
- declaration: SimpleGraph.IsChordal.exists_maximalCliqueTree_card_le
  informal: A nonempty finite chordal graph has a clique tree whose distinct bags are precisely its maximal
    cliques, with no more bags than vertices.
- declaration: SimpleGraph.CliqueTree.exists_parent_eq_of_isMinimalSeparator
  informal: In a clique tree, each minimal separator of two reachable vertices is the intersection of
    two adjacent bags.
- declaration: SimpleGraph.CliqueTree.card_eq_sum_card_bag_sub_sum_card_inter
  informal: The total bag size minus the total parent-child bag intersection size equals the number of
    graph vertices.
- declaration: SimpleGraph.CliqueTree.toSubtreeRepresentation
  informal: A finite rooted clique forest gives nonempty connected vertex sets of a finite host tree,
    with adjacency of distinct source vertices exactly equivalent to intersection of their assigned sets.
    Empty and disconnected source graphs are supported through one empty connector node.
  source_ref: Gavril, JCT B 16 (1974), 47–56, doi:10.1016/0095-8956(74)90094-X; constructor using the
    PR 579 adapter.
- declaration: SimpleGraph.isChordal_iff_nonempty_subtreeRepresentation
  informal: A finite graph on a vertex type in Type is chordal if and only if it has an exact representation
    by nonempty connected vertex sets of a finite tree.
  source_ref: Gavril, JCT B 16 (1974), 47–56, doi:10.1016/0095-8956(74)90094-X.
- declaration: SimpleGraph.IsTree.finite_subtree_helly
  informal: A finite pairwise-intersecting family of nonempty connected vertex sets of a finite tree has
    a common vertex; the empty family is also allowed.
- declaration: Utilities.Treewidth.TreeDecomposition.exists_clique_subset_bag
  informal: Every finite clique is contained in one bag of any tree decomposition.
- declaration: SimpleGraph.IsChordal.treewidth_succ_eq_cliqueNum
  informal: For every finite nonempty chordal graph on a vertex type in Type, its natural treewidth plus
    one equals its clique number.
- declaration: SimpleGraph.IsChordal.exists_optimal_treeDecomposition
  informal: A finite nonempty chordal graph admits a tree decomposition whose width plus one is its clique
    number.
- declaration: SimpleGraph.CliqueGluing.isChordal_iff
  informal: If two induced pieces cover a finite graph, their overlap is a clique, and no edge joins their
    exclusive parts, the graph is chordal exactly when both pieces are chordal. Overlap edges are retained.
  source_ref: New Lean Pool extension proved here using the existing Dirac and simplicial-elimination
    interfaces; not a claim from the frozen paper.
- declaration: SimpleGraph.CliqueGluing.card_vertices_add_overlap
  informal: The vertex count of the graph plus the overlap size equals the sum of the vertex counts of
    the two covering pieces.
  source_ref: New Lean Pool extension; finite-set inclusion-exclusion.
- declaration: SimpleGraph.CliqueGluing.card_edges_add_choose_overlap
  informal: The graph edge count plus the number of pairs in the retained clique overlap equals the sum
    of the induced pieces' edge counts.
  source_ref: New Lean Pool extension; induced-edge inclusion-exclusion.
