slug: paper-iv-clique-trees
title: Clique trees, subtree representations and chordal treewidth
summary: 'Develops rooted clique forests with the running-intersection property, constructs them from
  perfect elimination orders of finite chordal graphs, characterizes chordality by their existence, and
  obtains maximal-clique, separator, and counting results. Also characterizes chordality under retained-clique
  gluing of induced pieces, with exact vertex and edge inclusion-exclusion identities. The original library
  was extracted as a reusable byproduct of the published Paper IV formalization of the chordal-graph case
  of Erdős problem #81; this library is not by itself a proof of that paper''s partition bound. Gavril''s
  characterization supplies exact finite-tree subtree representations and the converse to chordality.
  Finite subtree Helly places every finite clique in a bag of any tree decomposition and gives optimal
  chordal treewidth. The supplied representation includes an empty connector; no minimal-host or runtime
  bound is claimed.'
