main_results:
- declaration: LeanPool.Erdos132ConvexK3.convex_top_three_degree_six
  informal: For every nonempty finite cyclically strictly convex planar configuration with three strictly
    ordered largest squared-distance classes d₁, d₂, and d₃, some vertex is incident to at most six pairs
    whose squared distance is one of those three classes.
  source_ref: 'Erdős--Lovász--Vesztergombi, printed p. 542, suggest the stronger convex bound degree at
    most 2k. Morić--Pritchard, "Counting large distances in convex polygons" (arXiv:1103.0412), Theorem
    1.4, prove m₁ + m₂ + m₃ ≤ 3n for sufficiently large n, which gives the same degree-six consequence
    in that range. The novelty here is the all-n theorem: it removes the sufficiently-large-n restriction.
    ErLV89 Theorem 2.7, printed p. 548, proves only degree at most 3k-1, which specializes to eight.'
- declaration: LeanPool.Erdos132ConvexK3.convex_top_three_draft_reduction_complete
  informal: Cyclic strict convexity and the three-largest-distance-class hypothesis construct the full
    maximal-gap, thirteen-word reduction package together with route-specific closure evidence, without
    any remaining coordinated-majorant or geometric-adapter assumption.
  source_ref: New proof-producing assembly theorem in this project. It combines the ErLV89 majorant framework
    with the project's maximal-gap tail, terminal-color, five-row, and thirteen-word transport lemmas.
- declaration: LeanPool.Erdos132ConvexK3.global_thirteen_word_closure_complete
  informal: Every one of the thirteen canonical maximal-gap cover words transports to its routed full-two-rung,
    anti-saturation, terminal-cage, or four-edge-cage realization, and hence supplies the corresponding
    degree bound.
  source_ref: New geometric transport theorem in this project. The thirteen-word classification and its
    four-predicate closure interface are not statements of ErLV89.
- declaration: LeanPool.Erdos132ConvexK3.concrete_word_closures
  informal: A thirteen-tag routing interface over four shared geometric realization predicates maps B:3→2
    and D:3→2 to Row1B32WordRealization, B:3→1, BA, D:3→1, and DC to OnePenultimateWordGeometry, DD to
    Row4DDWordRealization, and the remaining six tags to FullTwoRungGeometry. Each inhabited routed predicate
    supplies a vertex of degree at most six, with the one-penultimate route proving the stronger bound
    five.
  source_ref: New derived variant contributed and proved in this Lean Pool project. The thirteen-word
    classification and its closures are not statements of ErLV89.
- declaration: LeanPool.Erdos132ConvexK3.fullTwoRung_realization_degree_le_six
  informal: Every raw full-two-rung realization has its displayed vertex of degree at most six. A rigid
    normalization derives the canonical coordinates, the diameter branch is impossible, the long branch
    is counted from four raw boundary arcs, and the short branch contradicts the exact two-rung identity
    and metric dichotomy.
- declaration: LeanPool.Erdos132ConvexK3.convex_k3_degree_six_of_reduction
  informal: This implication from the abstract reduction interface is retained as the final assembly map.
    Its hypothesis is now discharged by convex_top_three_draft_reduction_complete, yielding the unconditional
    theorem convex_top_three_degree_six; ErLV89 itself proves only the degree-eight bound obtained from
    3k−1 when k=3.
  source_ref: 'Erdős--Lovász--Vesztergombi, printed p. 542: “Perhaps in the convex case there always exists
    an x_i such that the degree of x_i is at most 2k.” Alongside it, Theorem 2.7, printed p. 548, proves
    only: “If S is the set of vertices of a convex polygon then the graph G(S, k) has a point of degree
    at most 3k−1.” Thus degree six for k=3 is the stronger suggested variant; the proved source bound
    is eight, while this project''s global closure proves degree six.'
- declaration: LeanPool.Erdos132ConvexK3.coordinated_exceptional_count_rigidity
  informal: Every exceptional jointly minimal pair lies in case (1,2), (2,1), or (2,2). In (1,2), every
    first substitute has at least one right move while every second substitute has exactly two left moves
    and zero right moves. In (2,1), every first substitute has exactly two right moves and zero left moves
    while every second substitute has at least one left move. Only in (2,2) are those exact substitute
    counts proved on both sides.
- declaration: LeanPool.Erdos132ConvexK3.coordinated_exceptional_rank_and_exchange_obstruction
  informal: Assuming the three top distance classes and TopThreeAdjacent for both starting edges z–x and
    t–u, each forced two-move chain in an exceptional inner-move case has the rank ladder from the third-largest
    through the second-largest to the largest distance, while its proposed intermediate exchange edge
    remains nonterminal.
- declaration: LeanPool.Erdos132ConvexK3.heptagon_nondiameter_edge_is_majorant
  informal: In an explicit rational convex heptagon, a second-largest-distance edge is already terminal
    under both permitted cover moves, refuting the stronger claim that every non-diameter top-three edge
    admits a longer cover.
- declaration: LeanPool.Erdos132ConvexK3.Witnesses.ninePoint_top_three
  informal: An explicit rational nine-point regression configuration realizes squared-distance classes
    855625, 838525, and 811165 as its three largest classes.
- declaration: LeanPool.Erdos132ConvexK3.Witnesses.rationalHexagon_top_three
  informal: An explicit rational six-point regression configuration realizes the three stated rational
    squared-distance values as its largest classes.
