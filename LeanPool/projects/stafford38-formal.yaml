slug: stafford38-formal
title: Stafford 3.8
summary: Lean formalization of Stafford's Conjecture 3.8 for every characteristic-zero field and every
  Weyl-algebra rank, proving that each nonzero d admits F, R, and S with 1 = d*R + F*d*S. The development
  also proves an exact Bernstein-degree fixed-source strengthening and derived localization, adjoint,
  and evolutionary results.
