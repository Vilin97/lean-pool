slug: pentagonal-number-theorem-analytic
title: Euler's pentagonal number theorem, two independent proofs, and the Jacobi triple product
summary: 'Two independent proofs of Euler''s pentagonal number theorem that share no lemmas, so each confirms
  the result on its own. The primary development is combinatorial: Franklin''s sign-reversing involution
  on partitions into distinct parts, giving p_e(n) - p_o(n) = (-1)^|k| when n is the generalized pentagonal
  number k(3k-1)/2 and 0 otherwise, stated under a single integer index, together with the identification
  of that signed count with the coefficient of X^n in the truncated product over ℤ⟦X⟧. It builds on Mathlib''s
  Nat.Partition.genFun. The second route develops q-Pochhammer symbols, the Gaussian binomial coefficient,
  Euler''s two identities and the Cauchy identity, proves the Jacobi triple product both as a formal power
  series identity in (LaurentPolynomial ℂ)⟦X⟧ and analytically over ℂ for ‖q‖ < 1, and reaches the same
  theorem for the infinite product by specialization. The Lean proofs in both routes were largely generated
  by Aristotle; the Franklin route additionally has an author-written blueprint that the formalization
  follows lemma by lemma, and carries substantially more manual intervention and review, whereas the q-series
  route is machine-generated blueprint and all. The Franklin route and the analytic pentagonal number
  theorem overlap the pooled `pentagonal-number-theorem` development, which states its analytic form over
  RCLike fields rather than only over the complex numbers; the q-Pochhammer, Gaussian binomial and Euler
  identity definitions overlap arXiv:2607.01544. The project''s distinct contribution is the complex-analytic
  layer: an analytic Jacobi triple product over the complex numbers for norm q < 1, its extension to the
  punctured disc, the analytic Cauchy identity, and the summability and locally-uniform-convergence machinery
  they require. Neither the pooled entry nor the non-archimedean development of arXiv:2607.01544 covers
  that setting.'
