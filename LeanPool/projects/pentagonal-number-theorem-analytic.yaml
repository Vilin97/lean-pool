main_results:
- declaration: PentagonalNumberTheorem.Franklin.euler_pentagonal_number_theorem_packaged
  informal: The primary result. For every n, either n is a generalized pentagonal number k(3k-1)/2 for
    some integer k, in which case the number of partitions of n into an even number of distinct parts
    exceeds the number with an odd number of distinct parts by exactly (-1)^|k|; or n is not of that form,
    in which case the two counts are equal. Proved by Franklin's sign-reversing involution.
- declaration: PentagonalNumberTheorem.Franklin.coeff_prod_eq_pe_sub_po
  informal: The coefficient of X^n in the truncated product ∏_{k=1}^{n}(1 - X^k) over ℤ⟦X⟧ equals p_e(n)
    - p_o(n), the signed count of partitions of n into distinct parts. Truncating at n is harmless because
    the omitted factors are ≡ 1 mod X^{n+1}.
- declaration: QSeries.jacobiTripleProduct
  informal: For ‖q‖ < 1, ‖z‖ < 1 and z ≠ 0, the product (q;q)_∞ (-z;q)_∞ (-q/z;q)_∞ equals the bilateral
    theta series ∑_{k ∈ ℤ} z^k q^{k(k-1)/2}.
- declaration: QSeries.euler_pentagonal_number
  informal: For ‖q‖ < 1, the infinite product (q;q)_∞ equals ∑_{k ∈ ℤ} (-1)^k q^{ω(k)} over the generalized
    pentagonal numbers ω(k) = k(3k-1)/2, written as two one-sided sums. Obtained from the Jacobi triple
    product by specialization.
- declaration: QSeries.FormalPowerSeries.jacobiTripleProduct
  informal: 'The Jacobi triple product as an identity of formal power series in (LaurentPolynomial ℂ)-coefficient
    power series, with no convergence hypothesis: the product of q-Pochhammer symbols equals the bilateral
    theta series coefficientwise.'
