slug: fundamental-inequality
title: The Fundamental Inequality of Valued Fields
summary: Defines the ramification index and residue degree of an extension of valued fields and proves
  the fundamental inequality e * f ≤ finrank K L for finite extensions, via the valuation independence
  of products of coset representatives and residue-field basis lifts.
branch: number theory
entry_module: LeanPool.FundamentalInequality
