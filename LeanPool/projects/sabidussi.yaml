slug: sabidussi
title: Sabidussi's compatibility conjecture for Eulerian multigraphs
summary: Formalizes Sabidussi's compatibility conjecture for finite labelled endpoint multigraphs with
  loops and parallel edges, where a loop contributes two half-edge incidences to the degree of its vertex.
  Given an Euler tour and minimum degree at least four, the main theorem constructs a partition of all
  edges into nonempty, edge-connected, 2-regular ordinary circuits such that consecutive edges of the
  Euler tour never lie in the same circuit. The proof runs a four-colour (F_2^2) algebra over the cyclic
  transition word, uses an odd balancing parity lemma to choose compatible local frames, and transports
  the resulting colouring back to a compatible ordinary circuit decomposition.
