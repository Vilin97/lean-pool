main_results:
- declaration: Connes.theoremA
  informal: At any Hilbert-space universe, assuming property-(T) for EL₃(𝔽₂[t]), constructs two countable
    discrete ICC groups satisfying property-(T) at that universe which are nonisomorphic although their
    group von Neumann algebras are trace-preservingly normally star-isomorphic.
