slug: connes-rigidity
title: Conditional formalization of Zhou's Connes-rigidity counterexample
summary: Constructs Zhou's two countable discrete groups and, assuming the project's universe-polymorphic
  property-(T) predicate for EL₃(𝔽₂[t]), proves that both satisfy the same predicate, are ICC and nonisomorphic,
  while their group von Neumann algebras are trace-preservingly normally star-isomorphic.
