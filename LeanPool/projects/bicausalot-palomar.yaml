slug: bicausalot-palomar
title: 'BicausalOT: measurable selection and coupling strategies'
summary: Develops Kuratowski–Ryll-Nardzewski selection, Jankov–von Neumann uniformization, and finite-horizon
  Bellman identities for locally feasible coupling strategies. Exact Borel measurable optimal strategies
  and initial couplings are obtained on Polish Borel spaces for weakly continuous probability kernels
  and nonnegative extended-real lower semicontinuous costs. Equivalence with optimization over bicausal
  path laws is not established.
