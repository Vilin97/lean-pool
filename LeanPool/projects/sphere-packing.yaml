slug: sphere-packing
title: Sharp asymptotic upper bounds for sphere packing
summary: Formalizes the sharp high-dimensional asymptotics of the unrestricted Cohn--Elkies linear program
  and bridges them to sphere-packing density. The development constructs radial test functions through
  Mellin, saddle-point, and harmonic analysis, proves radialization preserves the unrestricted optimum,
  and certifies the exact natural- and base-two exponential rates.
