main_results:
- declaration: PackingBounds.FullMain.exact_limit
  informal: The d-th root of the unrestricted Cohn--Elkies linear-program bound converges to the sharp
    constant sqrt(e / (2 pi)).
- declaration: PackingBounds.FullMain.exact_binary_exponent
  informal: The base-two logarithm of the unrestricted linear-program bound, divided by dimension, converges
    to -1/2 log_2(2 pi / e).
- declaration: PackingBounds.PackingBridge.sphere_packing_sharp_asymptotic_upper
  informal: There is a vanishing error sequence such that, in every positive dimension, sphere-packing
    density is at most (sqrt(e / (2 pi)) plus that error) to the dimension.
- declaration: PackingBounds.sharpFullCohnElkiesManuscriptConclusions
  informal: Packages the complete sharp asymptotic conclusions for the unrestricted program, including
    quotient-root, natural-logarithmic, and base-two limits, vanishing-error formulas, a universal bound
    for all admissible functions, and a certified decimal exponent interval.
