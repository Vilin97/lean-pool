main_results:
- declaration: ZetaZeros.simple_proportion_d4
  informal: Assuming the stated Riemann--von Mangoldt and unconditional pair-correlation formulas, beyond
    some height more than 67.25% of nontrivial zeta zeros are simple and lie on the critical line.
- declaration: ZetaZeros.distinct_proportion_d5
  informal: Under the same two explicit analytic hypotheses, beyond some height more than 83.625% of nontrivial
    zeta zeros are distinct.
- declaration: ZetaZeros.card_simpleRealPart_lower
  informal: Bounds from below the number of multiplicity-one real points in a finite nonempty conjugation-invariant
    multiset using the squared test-kernel sum of any admissible function.
- declaration: ZetaZeros.card_lower
  informal: Bounds from below the number of distinct points in a finite nonempty conjugation-invariant
    multiset using the same Hilbert-space kernel method.
