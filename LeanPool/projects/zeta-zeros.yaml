slug: zeta-zeros
title: Simple zeros of the Riemann zeta function
summary: Formalizes Lamzouri's Hilbert-space proof of lower bounds for simple and distinct zeros of the
  Riemann zeta function. From explicit Riemann--von Mangoldt and unconditional pair-correlation hypotheses,
  the development proves that eventually more than 67.25% of nontrivial zeros are simple and on the critical
  line and more than 83.625% are distinct. It includes the finite-multiset Hilbert-space inequality, zeta-zero
  multiplicity symmetries, an admissible cutoff construction, and certified trigonometric estimates.
