slug: kahn-kalai
title: Kahn–Kalai expectation-threshold theorem
summary: Formalizes Tran and Vu's short proof of the Park–Pham theorem resolving the Kahn–Kalai expectation-threshold
  conjecture. For an ℓ-bounded family of subsets of a finite ground set, it proves the strengthened covering
  theorem with the explicit constant L = 1000 and derives the threshold bound p_c(F) ≤ K q(F) log₂ ℓ with
  the explicit witness K = 100000. The supporting library develops finite-set cover cost, level-density,
  double-counting, binomial-tail, and numeric estimates.
