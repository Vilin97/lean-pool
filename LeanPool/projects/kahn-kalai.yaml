main_results:
- declaration: KahnKalai.covering_theorem
  informal: If ℓ ≤ N, p lies in [0, 1], and an ℓ-bounded family H has cover cost at least 1/2 - 2^(-(ℓ+2)),
    then its upset has at least (2/3 + 2^(-(ℓ+2))) choose(N, m) members of cardinality m, where m = floor(1000
    p N log₂(ℓ+1)). For m ≤ N this is the corresponding level-density bound; for N < m both cardinalities
    are zero.
- declaration: KahnKalai.park_pham
  informal: There is an absolute positive constant K such that every ℓ-bounded finite family with ℓ at
    least two satisfies p_c(F) ≤ K q(F) log₂ ℓ; the proof supplies K = 100000.
