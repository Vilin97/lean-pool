main_results:
- declaration: SimpleGraph.lineGraphColoringEquivMatchingDecomposition
  informal: Proper colourings of the line graph on any palette are equivalent to partitions of the original
    edges into matching subgraphs indexed by that palette, with empty classes permitted.
  source_ref: New adapter proved in GraphColouringMatching/Basic.lean, using Mathlib's existing lineGraph,
    Coloring and Subgraph.IsMatching.
- declaration: SimpleGraph.MatchingDecomposition.edgeMatching_lineGraphColoring
  informal: Converting a matching decomposition to a colouring and extracting one colour class returns
    exactly its original matching subgraph.
- declaration: SimpleGraph.MatchingDecomposition.edgeEquivSigma
  informal: Original graph edges are in bijection with the disjoint union of the edge types of the palette-indexed
    matching subgraphs.
- declaration: SimpleGraph.MatchingDecomposition.card_edges_eq_sum
  informal: For a finite edge set and finite palette, the number of graph edges equals the sum of the
    numbers of edges in its matching classes, even when the vertex set is infinite.
- declaration: SimpleGraph.MatchingDecomposition.cardinal_edges_eq_sum
  informal: Without any finiteness assumption on vertices, edges, or colours, the cardinality of the graph
    edge set equals the indexed cardinal sum of the matching-class edge cardinalities, with a universe
    lift on the graph edge cardinality when required.
  source_ref: Cardinal.lean applies Mathlib's indexed cardinal sum to the existing edgeEquivSigma; no
    infinite graph-colouring theorem is assumed.
- declaration: SimpleGraph.lineGraph_colorable_iff_matchingDecomposition
  informal: The line graph is k-colourable if and only if the graph edges decompose into k matchings,
    allowing unused colours.
