slug: line-graph-colouring-matching
title: Line-graph colourings and matching decompositions
summary: 'Connects Mathlib line-graph colourings to palette-indexed partitions of actual graph edges into
  Mathlib matching subgraphs. Both conversions are inverse, preserve each matching exactly, and allow
  empty colours without a default colour or a finiteness assumption. An edge equivalence yields exact
  edge accounting: natural-number counts require only finite edges and a finite palette, while indexed
  cardinal counts allow arbitrary vertices, edges, and palettes. This is classical representation interoperability,
  not a new colouring bound or a claim of priority.'
