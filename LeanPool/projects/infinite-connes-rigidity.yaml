slug: infinite-connes-rigidity
title: Infinite counterexamples to Connes's rigidity conjecture
summary: Constructs one finitely generated property-(T) ICC group and an infinite family of finitely generated
  property-(T) ICC groups that are pairwise nonisomorphic and are each nonisomorphic to the first group,
  while all of their tracial group von Neumann algebras are normally star-isomorphic. This unconditional
  infinite-family result is independent of the pooled conditional two-group Connes-rigidity formalization.
