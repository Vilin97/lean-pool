- declaration: ConnesRigidity.exists_infinite_pairwise_nonisomorphic_propertyT_icc_groups_with_isomorphic_factors
  informal: There exist a finitely generated property-(T) ICC group and an infinite sequence of finitely
    generated property-(T) ICC groups such that all their tracial group von Neumann algebras are normally
    star-isomorphic, although the sequence is pairwise nonisomorphic and none of its groups is isomorphic
    to the distinguished group.
