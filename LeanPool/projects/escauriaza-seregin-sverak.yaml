slug: escauriaza-seregin-sverak
title: Escauriaza–Seregin–Šverák and Ladyzhenskaya–Prodi–Serrin regularity
summary: 'Endpoint and Serrin regularity criteria for three-dimensional incompressible Navier–Stokes Leray–Hopf
  solutions: bounded L-infinity-in-time L3 velocity implies L5 integrability, uniqueness, and a smooth
  representative on positive times including the final time. Includes local endpoint regularity, both
  Carleman inequalities, spatial unique continuation, and half-space backward uniqueness. Retains the
  complete ESS production formalization.'
