main_results:
- declaration: ESS.essSmooth
  informal: A Leray–Hopf solution whose spatial L3 mass is essentially bounded in time belongs to space-time
    L5, is unique among Leray–Hopf solutions with the same initial datum, and has an almost-everywhere
    equal smooth representative on all positive times through the final time.
- declaration: ESS.ladyzhenskayaProdiSerrin
  informal: A Leray–Hopf solution satisfying the critical Serrin mixed-norm condition with spatial exponent
    greater than three, including the L2-in-time L-infinity-in-space endpoint, is unique and has a smooth
    representative on positive times through the final time.
- declaration: ESS.serrinCriterion
  informal: The endpoint L-infinity-in-time L3 criterion and the Serrin criteria for all spatial exponents
    greater than three jointly imply uniqueness and existence of a smooth representative up to the final
    time.
- declaration: ESS.essLocal
  informal: A weak Navier–Stokes solution on the unit cylinder with finite energy, L3/2 pressure, and
    velocity essentially bounded in time in spatial L3 has an almost-everywhere equal parabolically Holder
    representative on the closure of the half cylinder.
- declaration: ESS.essGlobal
  informal: A Leray–Hopf solution whose spatial L3 mass is essentially bounded in time has no singular
    point at an interior positive time.
- declaration: ESS.essL5Unique
  informal: A Leray–Hopf solution whose spatial L3 mass is essentially bounded in time belongs to space-time
    L5 and is unique among Leray–Hopf solutions with its initial datum.
- declaration: ESS.uniqueContinuation
  informal: A vector field with explicit weak space-time derivatives obeying a parabolic differential
    inequality has unique continuation across a spatial boundary under the stated decay and boundary hypotheses.
- declaration: ESS.backwardUniqueness
  informal: A vector field on a three-dimensional half-space satisfying the heat differential inequality,
    growth bound, and zero initial trace vanishes.
- declaration: ESS.carlemanGaussian
  informal: The Gaussian Carleman inequality bounds weighted field and gradient energies by the weighted
    heat-operator energy under its support hypotheses.
- declaration: ESS.carlemanHalfSpace
  informal: The half-space Carleman inequality bounds weighted field and gradient energies by the weighted
    heat-operator energy under its support hypotheses.
