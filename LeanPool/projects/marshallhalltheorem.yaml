slug: marshallhalltheorem
title: Marshall Hall's theorem through finite cores
summary: Formalizes Marshall Hall's finite-index free-factor theorem for finitely generated subgroups
  of finite-rank free groups. The proof extracts the finitely many suffix states of a subgroup generating
  set, completes the resulting partial generator actions to permutations of a finite state set, identifies
  the connected orbit with a finite core, and extends a geodesic spanning tree to obtain an inclusion-compatible
  free-product decomposition. It also exposes an explicit finite permutation separator for every finitely
  generated subgroup and element outside it, yielding the LERF consequence. The repository also proves
  binary and finite-indexed free-group instances of Grushko--Neumann rank additivity, and the arbitrary-factor
  binary theorem. The arbitrary-factor proof is carried by a finite labelled-graph fold, source-unfold,
  and monochromatic-vertex contraction reduction.
