slug: brooks-subcubic
title: Brooks' theorem for subcubic graphs
summary: Proves that every finite simple graph of maximum degree at most three with no four-clique admits
  a three-colouring, without a connectedness assumption. Includes controlled greedy colouring, colouring
  across cut vertices, and a good-triple argument for cubic components. This is the subcubic case of Brooks'
  theorem, not the general-degree theorem.
