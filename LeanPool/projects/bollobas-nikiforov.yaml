slug: bollobas-nikiforov
title: The Bollobás–Nikiforov conjecture
summary: 'Proves the Bollobás–Nikiforov conjecture (2007): every finite noncomplete simple graph G on
  at least two vertices satisfies λ₁(G)² + λ₂(G)² ≤ 2 (1 - 1/ω(G)) |E(G)|, where λ₁ ≥ λ₂ are the two largest
  adjacency eigenvalues and ω(G) is the clique number. The inequality is derived from a weighted spectral
  inequality for symmetric entrywise nonnegative matrices supported on the edges of G, which in turn rests
  on a complete positivity theorem for planar Gram matrices and a rank-two Gram inequality. The rank-two
  Gram inequality also identifies the conic parameter of Coutinho, Spier and Zhang with the clique number.
  The supporting library develops the completely positive cone and its closedness, the Motzkin–Straus
  inequality in completely positive form, total nonnegativity of truncated-square and convex kernels via
  Cauchy–Binet, weighted Laplacian updates, Schur complements, Perron eigenvectors, the Schur product
  theorem and Cauchy interlacing over Mathlib.'
