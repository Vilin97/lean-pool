main_results:
- declaration: BollobasNikiforov.lambda1_sq_add_lambda2_sq_le
  informal: For every finite simple graph G on at least two vertices that is not complete, the two largest
    adjacency eigenvalues satisfy λ₁(G)² + λ₂(G)² ≤ 2 (1 - 1/ω(G)) |E(G)|, with ω(G) the clique number
    and |E(G)| the number of edges.
- declaration: BollobasNikiforov.weighted
  informal: If B is a real symmetric matrix, indexed by a finite type with at least two elements, that
    is entrywise nonnegative, has zero diagonal and vanishes off the edges of a graph G on that type,
    then the sum of the squares of its two largest positive eigenvalues is at most (1 - 1/ω(G)) times
    its squared Frobenius norm.
- declaration: BollobasNikiforov.matrix_theorem
  informal: If planar vectors z₁, …, zₙ lie in a closed half-plane through the origin and X is their Gram
    matrix, then X ∘ X plus the weighted Laplacian with weights X_ij² on the pairs i < j with X_ij < 0
    is completely positive.
- declaration: BollobasNikiforov.gram_le
  informal: For every real positive semidefinite matrix X of rank at most two, ∑_{i,j} (A_G)_ij (X_ij)₊²
    ≤ (1 - 1/ω(G)) ‖X‖_F², where (·)₊ is the positive part.
- declaration: BollobasNikiforov.chiVec3_eq_cliqueNum
  informal: For every graph G on a nonempty finite vertex type, the rank-two conic parameter χ''_{vec,3}(G)
    of Coutinho, Spier and Zhang, defined as the supremum of ‖X‖_F² over positive semidefinite X of rank
    at most two with nonnegative entries on the edges and unit off-edge mass, equals the clique number
    ω(G).
- declaration: BollobasNikiforov.motzkinStraus
  informal: Motzkin–Straus inequality; for every entrywise nonnegative vector y, yᵀ A_G y ≤ (1 - 1/ω(G))
    (∑ᵢ yᵢ)².
- declaration: BollobasNikiforov.posSemidef_hadamard
  informal: Schur product theorem over the reals; the Hadamard product of two positive semidefinite matrices
    is positive semidefinite.
- declaration: BollobasNikiforov.isClosed_isCompletelyPositive
  informal: The cone of completely positive real matrices is closed.
- declaration: BollobasNikiforov.IsTotallyNonneg.mul
  informal: Cauchy–Binet; the product of two totally nonnegative real matrices is totally nonnegative.
- declaration: BollobasNikiforov.exists_nonneg_eigenvector_lambdaMax
  informal: Perron; a real symmetric entrywise nonnegative matrix on a nonempty finite index type has
    an entrywise nonnegative unit eigenvector for its largest eigenvalue.
