slug: desargues
title: Axiomatic projective geometry (Faure–Frölicher)
summary: Develops, following Faure and Frölicher's Modern Projective Geometry, the axiomatic theory of
  projective geometries given by a ternary collinearity relation, with subspaces and subgeometries, proves
  that the central projection between two lines is a bijection, and exhibits every Mathlib projectivization
  as a projective geometry. Groundwork from the upstream desargues repository — Desargues' theorem itself
  is not formalized.
