main_results:
- declaration: Basic.ProjectiveGeometry
  informal: Axiomatizes a projective geometry as a typeclass (axioms L₁–L₃, Faure–Frölicher p. 26) on
    a ternary collinearity relation.
- declaration: Basic.centralProjection
  informal: Defines the central projection of a line onto another from a center point.
- declaration: Basic.cen_proj_bij
  informal: The headline theorem — the central projection between two lines is a bijection.
