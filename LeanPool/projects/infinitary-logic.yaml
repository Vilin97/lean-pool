slug: infinitary-logic
title: Infinitary logic and countable model theory
summary: 'Formalizes the syntax and semantics of infinitary logic and a broad collection of its classical
  theorems: Scott sentences and ranks, Karp''s theorem, model existence, the sharp Morley--Hanf bound,
  Craig, Lyndon, and Malitz interpolation, López--Escobar definability, undefinability of well-ordering,
  the Silver--Burgess and Morley counting dichotomies, and an honest coded-fragment interface whose HF
  compactness theorem is derived from first-order compactness.'
