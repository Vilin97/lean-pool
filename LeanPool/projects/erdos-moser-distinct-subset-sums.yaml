slug: erdos-moser-distinct-subset-sums
title: Leo Moser's finite distinct-subset-sums inequality
summary: 'Formalizes the exact finite sum-of-squares inequality that Guy''s 1982 account states as Theorem
  2 and attributes to Leo Moser: a finite set A of natural numbers with distinct subset sums satisfies
  4^|A| - 1 <= 3 * sum(a^2). It then derives direct and square-root lower bounds for the largest element
  of A. This does not claim the stronger historical asymptotic bound attributed jointly to Erdős and Moser,
  and Erdős Problem 1 remains open.'
