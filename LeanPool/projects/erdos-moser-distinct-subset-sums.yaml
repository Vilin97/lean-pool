main_results:
- declaration: LeanPool.ErdosMoser.leoMoserVarianceBound
  informal: If a finite set A of natural numbers has distinct subset sums, then 4^|A| - 1 is at most three
    times the sum of the squares of the elements of A.
  source_ref: Richard K. Guy, "Sets of Integers Whose Subsets Have Distinct Sums," Theorem 2 (credited
    there to Leo Moser), Annals of Discrete Mathematics 12 (1982), 141-154, doi:10.1016/S0304-0208(08)73500-X.
- declaration: LeanPool.ErdosMoser.erdosMoserMaxBound
  informal: For a nonempty finite set A of natural numbers with distinct subset sums, 4^|A| - 1 is at
    most 3|A| times the square of its largest element.
- declaration: LeanPool.ErdosMoser.erdosMoserMaxSqrt
  informal: 'The equivalent square-root lower bound on the largest element: sqrt((4^|A| - 1)/(3|A|)) is
    at most max(A).'
