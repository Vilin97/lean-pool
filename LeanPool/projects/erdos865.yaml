- declaration: Erdos865.erdos865_upper_bound
  informal: Every triple-free set A ⊆ [1,N] satisfies 8·|A| ≤ 5·N + 53, i.e. |A| ≤ (5/8)·N + O(1).
- declaration: Erdos865.erdos865_contains_triple
  informal: Every A ⊆ [1,N] with 5·N + 53 < 8·|A| contains a pairwise-sum triple (the paper's Theorem
    1.1 form).
- declaration: Erdos865.sharpness
  informal: For N = 8M with M ≥ 1 there is a triple-free A ⊆ [1,N] with 8·|A| = 5·N + 16, so the constant
    5/8 is optimal.
