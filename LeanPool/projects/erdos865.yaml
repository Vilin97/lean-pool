slug: erdos865
title: A sharp 5/8 bound for Erdős Problem 865
summary: Formalizes the resolution of Erdős Problem 865 on pairwise sums. For A ⊆ {1,…,N}, a pairwise-sum
  triple is a set of distinct a, b, c ∈ A with a+b, a+c, b+c all in A, and A is triple-free when it has
  none. The development proves that every triple-free A ⊆ [1,N] satisfies 8·|A| ≤ 5·N + 53, that any A
  exceeding this bound contains a triple, and — via the construction A = [M,2M] ∪ [4M,8M] for N = 8M —
  that the constant 5/8 is optimal, so f₃(N) = 5N/8 + O(1). The upper bound runs through a folded additive
  lemma over ℤ/mℤ (a four-set union bound) and a folding lemma, closed by strong induction on N.
