main_results:
- declaration: flt_regular
  informal: Fermat's Last Theorem holds for every odd regular prime exponent.
- declaration: FltRegular.caseI
  informal: 'The first case of Fermat''s Last Theorem holds for every regular prime: no primitive solution
    exists when the exponent does not divide the product of the three terms.'
- declaration: FltRegular.caseII
  informal: 'The second case of Fermat''s Last Theorem holds for every odd regular prime: no primitive
    nonzero solution exists when the exponent divides the product of the three terms.'
- declaration: eq_pow_prime_of_unit_of_congruent
  informal: A unit of the cyclotomic field of an odd regular prime that is congruent to an integer modulo
    the prime is itself a prime-th power.
