slug: flt-regular
title: Fermat's Last Theorem for regular primes
summary: Formalizes Kummer's proof of Fermat's Last Theorem for every odd regular prime exponent. The
  development proves both cases of the theorem and includes the required theory of cyclotomic integers,
  relative units, Hilbert 90 and 92, ramification, class groups, and Kummer's lemma.
