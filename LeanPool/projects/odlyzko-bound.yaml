slug: odlyzko-bound
title: Poitou's Explicit Odlyzko Bound for Root Discriminants
summary: Formalizes the unconditional explicit-formula argument for a lower bound on root discriminants
  of totally complex number fields. Develops the completed Dedekind zeta function and its functional equation,
  Poitou's explicit formula, the Tartar test function, and a certified numerical estimate proving that
  degree at least 18 forces root discriminant at least 8.25.
