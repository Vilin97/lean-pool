slug: asymptotic-triangle-packing
title: Finite hypergraph rounding and the asymptotic triangle-packing gap
summary: Formalizes a finite ceiling-carrying nibble theorem for uniform hypergraphs that are near-regular
  outside a small exceptional set and have suitably bounded codegrees, and derives the uniform subquadratic
  gap between fractional and integral triangle packing in finite graphs, together with its fractional-cover
  formulation.
