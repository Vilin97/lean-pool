main_results:
- declaration: LeanPool.AsymptoticTrianglePacking.nearRegularNibbleTheorem
  informal: For every uniformity and positive error tolerance, sufficiently large finite uniform hypergraphs
    with bounded codegrees, near-regular degrees outside a small exceptional set, and a global degree
    ceiling admit a matching covering the prescribed fraction of their vertices.
  source_ref: Finite near-regular hypergraph nibble theorem used in the Paper III development.
- declaration: LeanPool.AsymptoticTrianglePacking.trianglePackingGap
  informal: For every positive error tolerance, all sufficiently large finite graphs have fractional triangle-packing
    optimum at most their integral triangle-packing optimum plus the error tolerance times the square
    of the number of vertices.
  source_ref: Paper III AX1, fractional-integral triangle-packing gap.
- declaration: LeanPool.AsymptoticTrianglePacking.triangleCoverPackingGap
  informal: For every positive error tolerance, all sufficiently large finite graphs have fractional triangle-cover
    optimum at most their integral triangle-packing optimum plus the error tolerance times the square
    of the number of vertices.
  source_ref: Paper III AX1, cover-side formulation.
