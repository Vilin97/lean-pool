slug: krohn-rhodes
title: Aperiodic and simple-group wreath-division towers
summary: Constructs a finite recursive wreath-division tower for every finite monoid in universe zero,
  with finite aperiodic or finite simple-group factors and every simple-group factor a monoid divisor
  of the original monoid. Implements a variant of the Diekert–Kufleitner–Steinberg local-divisor argument,
  with reusable monoid and semigroup division, local divisors, action coverings, wreath reassociation,
  and the Krasner–Kaloujnine group embedding. The endpoint permits arbitrary aperiodic factors and recursive
  intermediate bases; it does not assert the three-element flip-flop reduction, a single transformation-monoid
  strong division, or quantitative decomposition bounds.
