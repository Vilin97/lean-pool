main_results:
- declaration: LeanPool.KrohnRhodes.krohn_rhodes_prime_decomposition
  informal: Every finite monoid M in universe zero admits a finite list of finite monoid factors, each
    witnessed to be aperiodic or a simple group, with DivTowerWreath M factors and every simple-group
    factor a monoid divisor of M. An empty tower means M divides the trivial monoid. At a nonempty step,
    M divides F wreath B for a finite action of a finite monoid B that itself has the tail tower.
  source_ref: Upstream PrimeDecomposition.lean, completed September 28, 2026 at 07:36:52 UTC and publicly
    released at 08:48:24 UTC. Variant of Diekert–Kufleitner–Steinberg, arXiv:1111.1585, Sections 3–4,
    with left actions, the larger local divisor cM intersect Mc, arbitrary aperiodic factors, and recursive
    semigroup divisions. The stronger flip-flop and transformation-monoid claims of Theorem 4.1 are not
    asserted. Upstream CITATION.cff attributes the proofs primarily to Claude Code under Aditya Rao's
    direction.
- declaration: LeanPool.KrohnRhodes.krasnerKaloujnine_injective
  informal: For any group G and normal subgroup N, the constructed monoid homomorphism from G to Mathlib's
    regular wreath product of N and G/N is injective. No finiteness assumption is required.
  source_ref: Upstream Foundations/KrasnerKaloujnine.lean; the classical Krasner–Kaloujnine embedding
    theorem.
- declaration: LeanPool.KrohnRhodes.LocalDivisor.localDivides
  informal: For any monoid M and c in M, the local divisor on cM intersect Mc, with its twisted multiplication
    and identity c, is a quotient of a submonoid of M.
  source_ref: Diekert–Kufleitner–Steinberg, arXiv:1111.1585, Section 2.5; uses the full local divisor
    rather than the smaller cMc union {c}.
