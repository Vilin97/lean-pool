slug: quadratic-carleson-palomar-submission
title: Endpoint estimates for Stein's purely quadratic Carleson operator
summary: 'A Lean 4 formalization of four principal endpoint assertions from Fragkos, Krause, and Lacey''s
  Endpoint Estimates for Stein''s Purely Quadratic Carleson Operator: two failures of modular estimates
  below t log₂ t, a full-modulation L log L endpoint estimate, and a lacunary L (log₂ L)² log₄ L endpoint
  estimate.'
