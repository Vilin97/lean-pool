slug: naslund-counterexample
title: Square-difference-free polynomials beyond Naslund's conjectured bound
summary: Constructs square-difference-free subsets of polynomials over the field with three elements that
  refute Naslund's Conjecture 13 at every degree bound divisible by four and at least eight. An explicit
  degree-eight lift multiplies cardinality by 810 and yields a lower bound of 16/21 for the lower limiting
  normalized logarithmic growth rate.
branch: additive combinatorics and number theory
