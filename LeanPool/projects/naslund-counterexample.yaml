main_results:
- declaration: NaslundCounterexample.exists_card_810
  informal: There is a square-difference-free set of 810 polynomials over F_3 with degree less than eight.
- declaration: NaslundCounterexample.conjecture_fails_at_eight
  informal: The upper bound 3^6 = 729 in Naslund's Conjecture 13 fails for square differences over F_3
    at degree bound eight.
- declaration: NaslundCounterexample.exists_card_pow
  informal: For every positive integer e, there is a square-difference-free set of 810^e polynomials over
    F_3 with degree less than 8e.
- declaration: NaslundCounterexample.exists_card_twenty_seven_mul_pow
  informal: For every natural number e, there is a square-difference-free set of 27 times 810^e polynomials
    over F_3 with degree less than 8e + 4.
- declaration: NaslundCounterexample.conjecture_fails
  informal: For every n divisible by four with n at least eight, there is a square-difference-free set
    of polynomials over F_3 of degree less than n whose cardinality exceeds 3^(3n/4).
- declaration: NaslundCounterexample.liminf_ge
  informal: If D(n) is the largest cardinality of a square-difference-free set of polynomials over F_3
    of degree less than n, then the lower limit of log D(n) divided by n log 3 is at least 16/21.
