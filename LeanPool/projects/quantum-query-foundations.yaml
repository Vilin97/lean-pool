slug: quantum-query-foundations
title: Adversary bounds and the polynomial method for quantum queries
summary: Develops finite quantum query algorithms, real adversary primal and dual programs, strong duality,
  exact Boolean block composition, explicit constant-factor bounded-error query characterizations, and
  degree bounds for output-probability polynomials. Query models include idle and blank sectors; bounds
  count queries, not gate complexity or running time. Uniform algorithm extraction assumes a supplied
  dual certificate.
