slug: polynomial-freiman-ruzsa
title: The polynomial Freiman–Ruzsa conjecture
summary: Formalizes Marton's polynomial Freiman–Ruzsa conjecture by the entropy method, including the
  characteristic-two bounds with exponents twelve and nine, the bounded-torsion theorem with an explicit
  exponent, and quantitative consequences for affine dimension and approximate homomorphisms. The supporting
  development builds entropic Ruzsa distance, multidistance, conditional entropy, and additive-energy
  machinery. This optimized import reuses the pooled Zhang–Yeung entropy and kernel library in place of
  duplicate upstream modules while preserving all six closed headline statements.
