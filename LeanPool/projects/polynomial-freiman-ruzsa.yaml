main_results:
- declaration: Marton.pfr_conjecture
  informal: A nonempty finite set A of doubling at most K in an abelian group of exponent two is covered
    by fewer than 2 K^12 cosets of a finite subgroup no larger than A.
- declaration: Marton.pfr_conjecture_nine
  informal: Strengthens the characteristic-two covering theorem to fewer than 2 K^9 cosets of a finite
    subgroup no larger than A.
- declaration: Marton.torsion_pfr_conjecture
  informal: In an abelian group of exponent m at least two, a nonempty finite set of doubling at most
    K is covered by fewer than m K^(256 m^3 + 1) cosets of a subgroup no larger than A.
- declaration: Marton.weak_pfr_int
  informal: A nonempty finite set of doubling at most K in a finite-rank free abelian group has a subset
    of relative size at least K^(-34) and affine dimension at most (80 / log 2) log K.
- declaration: Marton.homomorphism_pfr
  informal: A map between finite abelian groups of exponent two whose additive defects lie in S differs
    from a homomorphism by a map taking at most |S|^10 values.
- declaration: Marton.approx_hom_pfr
  informal: A map between finite abelian groups of exponent two that is additive on at least a 1/K fraction
    of pairs agrees with a homomorphism on at least (|G| / (2^144 K^122) - 1) / 2 points.
