slug: min-modulus-unique-multiset-sum
title: Minimum modulus for the unique multiset-sum problem
summary: 'Formalizes the exact minimum modulus `N_min(n) = 2^n - 2^{floor(log_2 n)}` for the unique multiset-sum
  problem on the super-increasing residue set `{2^i - 1 : 0 <= i < n}`, and proves the sharp elementary-abelian-2-group
  lower bound `k >= n - 1` for unique multiset sums in `(Z/2Z)^k`.'
branch: additive combinatorics
entry_module: LeanPool.MinModulusUniqueMultisetSum
authors:
- José A. R. Fonollosa
source:
