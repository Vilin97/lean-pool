main_results:
- declaration: MinModulus.nmin_eq
  informal: 'Proves that among moduli `N >= 2` the least one making the super-increasing residue set `{2^i
    - 1 : 0 <= i < n}` valid for the unique multiset-sum problem is `2^n - 2^{floor(log_2 n)}`, for every
    `n >= 2` (stated as `IsLeast`).'
- declaration: MinModulus.elementaryAbelianTwoGroups_optimal
  informal: 'Proves that if `g_0, ..., g_{n-1}` in `(Z/2Z)^k` have unique multiset sums, then `k >= n
    - 1`: an elementary abelian 2-group admitting such a family has order at least `2^(n - 1)`.'
