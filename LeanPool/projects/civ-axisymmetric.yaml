main_results:
- declaration: CIV.mainTheorem
  informal: A smooth suitable weak solution on the unit parabolic cylinder with globally finite energy,
    bounded C^2 spatially analytic force, anisotropic Type II bounds on its angular mean, and a positive
    axisymmetric core at every time is axisymmetric throughout the cylinder and bounded near the origin
    up to the terminal time.
- declaration: CIV.axisymmetricTheorem
  informal: An axisymmetric smooth suitable weak solution obeying the stated anisotropic Type II bounds
    and bounded C^2 force is bounded near the origin up to the terminal time.
- declaration: CIV.meridionalSmallness
  informal: Under the axisymmetric anisotropic hypotheses, the weighted meridional quantity tends uniformly
    to zero on a smaller cylinder as the terminal time approaches.
- declaration: CIV.interiorAnalyticity
  informal: Smooth solutions with locally uniformly spatially analytic forcing are locally uniformly spatially
    analytic in the interior.
- declaration: CIV.forceUnderCore
  informal: For a smooth suitable weak solution with globally finite energy, bounded C^2 forcing, angular-mean
    anisotropic bounds, and an axisymmetric core at every time, failure of boundedness near the origin
    implies that the force is not spatially analytic, is nonzero somewhere in the unit cylinder, and has
    a nonzero point in every smaller terminal cylinder.
