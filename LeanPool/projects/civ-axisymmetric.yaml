slug: civ-axisymmetric
title: Regularity of asymptotically axisymmetric Navier–Stokes solutions
summary: Proves the Constantin–Ignatova–Vicol regularity theorem for suitable weak solutions of the three-dimensional
  forced Navier–Stokes equations with analytic forcing, anisotropic Type II bounds on the angular mean,
  and an axisymmetric core at each time. Includes the fully axisymmetric theorem, meridional smallness,
  interior spatial analyticity, the nonanalyticity consequence for singular solutions, and the comparison,
  Serrin, and Gustafson–Kang–Tsai results used in their proofs. Reuses Lean Pool's Caffarelli–Kohn–Nirenberg
  suitable-solution and analysis library.
