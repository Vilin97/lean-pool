slug: multicolor-triangle-ramsey
title: Superexponential lower bounds for multicolor triangle Ramsey numbers
summary: Resolves Erdős problem 183 by proving that the k-color triangle Ramsey number has a k-th root
  tending to infinity. The development constructs saturated palette families and recursive edge colorings,
  derives an explicit superexponential lower bound, and proves matching order-of-growth bounds for the
  logarithm of the Ramsey number.
