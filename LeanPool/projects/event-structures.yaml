slug: event-structures
title: Event Structures and Causal-Consistent Reversibility
summary: Formalizes event structures with binary conflict, their configurations, computations, the trace
  monoid, and causal-consistent reversibility, proving correctness and causal-safety of rollback, uniqueness
  of minimal and maximal replays, and conditional replay-existence characterizations.
branch: concurrency theory
entry_module: LeanPool.EventStructures
authors:
- Vikraman Choudhury
source:
  doi: 10.1007/3-540-17906-2_31
  url: https://github.com/vikraman/event-structures
  github_repo: vikraman/event-structures
license: Apache-2.0
status: verified
provenance: human
main_declarations:
- EventStructures.EventStructure
- EventStructures.Conf
main_results:
- declaration: EventStructures.EventStructure
  informal: Defines an event structure as a partially ordered set of events with an irreflexive symmetric
    conflict relation.
  source_ref: M. Nielsen, G. Plotkin, G. Winskel, Petri nets, event structures and domains, part I, Theoretical
    Computer Science 13 (1981), 85-108, doi:10.1016/0304-3975(81)90112-2.
- declaration: EventStructures.Conf
  informal: Defines a configuration as a conflict-free, downward-closed set of events.
  source_ref: G. Winskel, Event structures, Advances in Petri Nets 1986, LNCS 255, Springer, 1987, 325-392,
    doi:10.1007/3-540-17906-2_31.
- declaration: EventStructures.Rollback.rollback_correctness_finite
  informal: Proves that the original configuration is reachable from the rollback of an event when the
    configuration is finitely representable.
  source_ref: Causal-consistent reversibility in the sense of V. Danos, J. Krivine, Reversible communicating
    systems, CONCUR 2004, LNCS 3170, Springer, 2004, 292-307, doi:10.1007/978-3-540-28644-8_19.
- declaration: EventStructures.Rollback.rollback_causal_safety
  informal: Proves causal safety of rollback - events causally after the rolled-back event are removed.
  source_ref: Causal-consistent reversibility in the sense of V. Danos, J. Krivine, Reversible communicating
    systems, CONCUR 2004, LNCS 3170, Springer, 2004, 292-307, doi:10.1007/978-3-540-28644-8_19.
- declaration: EventStructures.Replay.minReplay_unique
  informal: Proves uniqueness of the minimal replay of a log - any two minimal replays compatible with
    the log reach the same configuration.
- declaration: EventStructures.Trace.TraceMonoid
  informal: Defines the trace monoid as lists of events quotiented by the congruence generated by swapping
    adjacent concurrent events; paths in the configuration graph are quotiented by the same trace equivalence
    to form asynchronous paths.
  source_ref: A. Mazurkiewicz, Trace theory, Advances in Petri Nets 1986, LNCS 255, Springer, 1987, 278-324,
    doi:10.1007/3-540-17906-2_30.
