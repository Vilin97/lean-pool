main_results:
- declaration: GraphCoveringTheory.KuroshStatement.kurosh_decomposition_with_inclusions
  informal: Every subgroup H of an arbitrary indexed free product admits a free product decomposition
    into a free group and subgroups of H that are intersections with conjugates of the original factors.
    The isomorphism to H is induced by the actual subgroup inclusions and a homomorphism from the free
    factor.
  source_ref: Kurosh subgroup theorem; upstream inclusion-preserving statement.
- declaration: GraphCoveringTheory.Kurosh.kurosh_decomposition
  informal: H is isomorphic to the free product of its nontrivial vertex stabilizers in the quotient Bass–Serre
    graph and the free group of that graph.
- declaration: GraphCoveringTheory.schreier_basis_fintype
  informal: A finite-index subgroup H of a free group on any finite generator type of cardinality r has
    an explicit free basis of size d*r + 1 - d, where d is its index and subtraction is natural-number
    subtraction. This formulation also covers the empty generator type.
- declaration: GraphCoveringTheory.schreier_basis_fintype_proved
  informal: If the finite generator type is nonempty, the basis has the classical Schreier size 1 + d*(r
    - 1).
  source_ref: Schreier index formula; DOI 10.1007/BF02952517.
- declaration: GraphCoveringTheory.finiteIndexQuotientDeckGroupEquiv
  informal: For a finite-index normal subgroup H of a group G, the automorphism group of the finite regular
    Schreier G-action is isomorphic to G/H by right translations. This is a theorem about the action,
    not a classification of general topological covers.
- declaration: GraphCoveringTheory.Kurosh.kurosh_subgroup_is_free_of_trivial_stabilizers
  informal: A subgroup with trivial stabilizers at every vertex of its quotient Bass–Serre graph is a
    free group.
