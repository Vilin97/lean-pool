slug: kurosh
title: Kurosh and Schreier subgroup theorems via covering graphs
summary: Proves the Kurosh subgroup theorem for arbitrary subgroups of indexed free products, with factors
  given by actual intersections with conjugates of the original factors and with the decomposition maps
  induced by their inclusions. The development constructs Bass–Serre trees, quotient graphs, graph-of-groups
  covers, path lifting, and normal forms. It also gives an explicit finite Schreier basis and classifies
  automorphisms of a finite regular Schreier action by its quotient group. The finite-graph basis infrastructure
  is reused from LeanPool.FiniteGraphFundamentalGroup.
