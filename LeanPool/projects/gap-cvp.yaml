slug: gap-cvp
title: Polynomial-factor hardness of the closest vector problem
summary: Formalizes polynomial-factor NP-hardness of the closest vector problem through an explicit reduction
  from 3-SAT. The development also derives NP-hardness of binary nearest codeword, binary syndrome decoding,
  and finite p-norm variants of GapCVP. It includes machine-level polynomial-time bounds, binary encodings,
  affine systems, Reed--Solomon-style interpolation, and the lattice and coding-theory reductions needed
  by the final results.
