main_declarations:
- GapCVP.Comparator.gapCVP400IsNPHard
main_results:
- declaration: GapCVP.Comparator.gapCVP400IsNPHard
  informal: 'GapCVP in the Euclidean norm with approximation factor n^(1/400), where n is the lattice
    dimension, is NP-hard as a promise problem: every NP language reduces in polynomial time to the promise
    problem on encoded well-formed instances (positive dimension, nonsingular integer basis, positive
    rational radius) with an integer target, whose YES instances have a lattice vector within the radius
    of the target and whose NO instances have every lattice vector at distance greater than n^(1/400)
    times the radius.'
- declaration: GapCVP.Comparator.binaryNearestCodewordIsNPHard
  informal: Binary nearest codeword is NP-hard as a promise problem.
- declaration: GapCVP.Comparator.binarySyndromeDecodingIsNPHard
  informal: Binary syndrome decoding is NP-hard as a promise problem.
- declaration: GapCVP.Comparator.finitePNormGapCVPIsNPHard
  informal: For every rational p at least one, the finite p-norm version of GapCVP is NP-hard as a promise
    problem.
