slug: euclidean-jordan
title: Euclidean Jordan algebras and the frame Peirce decomposition
summary: 'The frame Peirce decomposition: relative to a Jordan frame, a Euclidean Jordan algebra is the
  internal direct sum of the blocks V_ij over unordered pairs of frame indices, and in finite dimension
  the diagonal blocks are lines, dim V_ii = 1 - the Faraut-Koranyi table entry. The frame is carried as
  data, so frame conjugacy is sidestepped and nothing here claims anything about the rank of J. Machine
  checked, not peer reviewed, no priority claim.'
