slug: egrs75
title: The Erdős–Graham–Ruzsa–Straus two-prime theorem
summary: A complete machine-checked proof that for any two distinct odd primes p and q there are infinitely
  many n with binom(2n,n) coprime to pq, including the iterated carry-controlled digit-clearing step that
  Bloom and Croot defer to the 1975 paper, via a per-move lexicographic measure, an elementary staircase
  lemma, and a Dirichlet-approximation seed.
