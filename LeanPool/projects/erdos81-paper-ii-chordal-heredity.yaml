main_results:
- declaration: SimpleGraph.IsChordal.comap
  informal: A graph that embeds as an induced subgraph of a chordal graph is itself chordal.
- declaration: SimpleGraph.IsChordal.induce
  informal: Every induced subgraph of a chordal graph is chordal.
- declaration: SimpleGraph.IsChordal.minimalSeparator_isClique
  informal: Every finite minimal separator of two fixed vertices in a chordal graph is a clique.
- declaration: SimpleGraph.IsChordal.exists_isSimplicial
  informal: Every nonempty finite chordal graph has a simplicial vertex.
- declaration: SimpleGraph.IsChordal.exists_two_nonadj_isSimplicial
  informal: Every connected non-complete finite chordal graph has two non-adjacent simplicial vertices.
