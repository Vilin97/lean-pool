slug: erdos81-paper-ii-chordal-heredity
title: 'Chordal graphs: minimal separators and simplicial vertices'
summary: 'A reusable formalization byproduct accompanying Paper II: defines chordal graphs through the
  cycle-and-chord characterization, proves induced-subgraph heredity and the clique property for finite
  minimal separators of fixed vertex pairs, proves Dirac''s simplicial-vertex theorem, and proves the
  connected non-complete case of the two-vertex conclusion.'
