slug: odd-prime-valuation-distribution
title: Exact odd-prime distributions of central-binomial valuations
summary: Formalizes the exact distribution of the p-adic valuation of the central binomial coefficient
  binom(2n,n) over every complete block 0 <= n < p^k for every odd prime p. The development proves Kummer
  correctness for padded digit words, constructs the two-state doubling carry enumerator, identifies it
  with the arithmetic valuation polynomial, derives its second-order recurrence, proves the rational bivariate
  generating function, and obtains closed formulas for valuations zero and one.
