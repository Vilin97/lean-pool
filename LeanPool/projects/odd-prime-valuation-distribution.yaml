main_results:
- declaration: OddPrimeValuationDistribution.oddPrimeValuationGeneratingSeries_identity
  informal: For every odd prime p = 2h+1, proves the denominator-cleared identity for the bivariate series
    whose coefficient of T^k X^r counts n < p^k with nu_p(binomial(2n,n)) = r; equivalently the series
    is (1-XT)/(1-(h+1)(1+X)T+pXT^2).
  source_ref: A. Straub, V. H. Moll, T. Amdeberhan, The p-adic valuation of k-central binomial coefficients,
    Acta Arith. 140 (2009), 31-42.
- declaration: OddPrimeValuationDistribution.oddPrimeValuationPolynomial_recurrence
  informal: Proves that the exact valuation polynomials satisfy F_{k+2}(X)+pX F_k(X)=(h+1)(1+X)F_{k+1}(X),
    with F_0=1 and F_1=(h+1)+hX.
- declaration: OddPrimeValuationDistribution.padicValNat_oddPrime_centralBinom_ofDigits_eq_carryCount
  informal: 'Proves Kummer correctness for every valid padded base-p word: the p-adic valuation of its
    central binomial coefficient equals the number of carries produced by doubling the word.'
- declaration: OddPrimeValuationDistribution.card_oddPrimeBlock_valuation_one
  informal: Gives a closed formula for the number of n below p^(k+2) whose central binomial coefficient
    has p-adic valuation exactly one.
