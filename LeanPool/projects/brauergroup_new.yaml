main_declarations:
- BrauerGroup.BruaerGroup
- BrauerGroupHom.Br
- WedderburnArtin
main_results:
- declaration: BrauerGroup.BruaerGroup
  informal: Constructs the Brauer group of a field from Brauer equivalence classes of central simple algebras.
- declaration: BrauerGroupHom.Br
  informal: Constructs the Brauer group functor from fields to commutative groups via scalar extension.
- declaration: WedderburnArtin
  informal: Proves a Wedderburn-Artin decomposition for simple Artinian rings as matrix algebras over
    division rings.
- declaration: trivialBrauer
  informal: Proves that every element of the Brauer group of a finite field is trivial.
- declaration: WedderburnArtin_algebra_version
  informal: Gives an algebra equivalence form of Wedderburn-Artin for finite-dimensional central simple
    algebras.
- declaration: IsCentralSimple.TensorProduct.simple
  informal: Proves simplicity of tensor products of central simple algebras over a field.
- declaration: IsCentralSimple.TensorProduct.isCentral
  informal: Proves centrality of tensor products of central algebras over a field.
- declaration: CSA_implies_CSA
  informal: Shows that the division algebra factor in a matrix presentation of a central simple algebra
    is central over the base field.
