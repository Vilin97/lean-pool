main_results:
- declaration: QuadraticIterates.section1_equiv
  informal: For each n, assuming -a is not a rational square, the Galois group of the n-th iterate of
    X² + a is the full n-fold iterated wreath product of C₂ exactly when either the first n terms of the
    signed sequence c₁ = -a, cₖ = fₖ(0) for k ≥ 2, or the first n integer Möbius factors of that sequence
    are independent modulo rational squares.
- declaration: QuadraticIterates.section1_squarefree
  informal: If -a is not a rational square and none of the absolute Möbius factors from levels 2 through
    n is a rational square, then the n-th iterate has the full iterated-wreath-product Galois group.
- declaration: QuadraticIterates.section3_main
  informal: The Galois group is the full iterated wreath product at every positive level when a is positive
    and congruent to 1 or 2 modulo 4, or when a is negative and divisible by 4 with -a nonsquare.
