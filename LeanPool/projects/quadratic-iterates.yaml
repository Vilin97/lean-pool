slug: quadratic-iterates
title: Galois groups of quadratic polynomial iterates
summary: Formalizes Stoll's criterion for when the Galois group of the n-th iterate of X² + a over the
  rationals is the full n-fold iterated wreath product of C₂. It proves the criterion in terms of two-independence
  of a signed critical-orbit sequence and its pairwise-coprime Möbius factors, and derives the paper's
  congruence families for which maximality holds at every level. The supporting library develops reusable
  multiquadratic-extension, iterated wreath-product, Möbius-factor, and valuation results.
