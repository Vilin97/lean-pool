main_results:
- declaration: Erdos132ThreeChain.nonDiameterSqDists_ne_chain
  informal: Let n be at least thirteen, let a be positive, and let X be a finite set of points of the
    real plane with exactly n elements. Suppose D is the squared diameter of X, meaning that D is realised
    by two distinct points of X and dominates every squared distance inside X. Then for every natural
    number h, the set of squared distances realised by distinct points of X and different from D is not
    equal to the geometric 3-chain consisting of a times 3^j for j below h.
- declaration: Erdos132ThreeChain.four_chain_adjacent
  informal: Let a be positive and let S be a four-element set of points of the real plane such that every
    squared distance between distinct points of S equals a times a nonnegative power of three. Then there
    is a positive r, itself equal to a times a nonnegative power of three, for which every squared distance
    between distinct points of S equals r or 3r.
- declaration: Erdos132ThreeChain.pair_classification
  informal: 'Let c be positive and let A, B, C, D be points of the real plane with the squared distance
    from A to B equal to c and every other pairwise squared distance equal to c times a nonnegative power
    of three. Then each of the four squared distances from A and B to C and to D equals c or 3c, at least
    one of the two squared distances from A and B to C equals c, likewise for D, the squared distance
    from C to D equals c or 3c, the squared distance from A to C equals c or that from B to D equals c,
    the squared distance from B to C equals c or that from A to D equals c, and the whole labelling is
    one of exactly seven explicit patterns: five with a single edge of squared length 3c, and two in which
    the three edges of squared length 3c form a triangle.'
- declaration: Erdos132ThreeChain.no_five_chain_finset
  informal: Let a be positive. There is no five-element set of points of the real plane in which every
    squared distance between distinct points equals a times a nonnegative power of three.
- declaration: Erdos132ThreeChain.no_four_on_circle
  informal: Let c be positive. There are no four points of the real plane, each at squared distance c
    from a common point, whose six pairwise squared distances all equal c or 3c.
- declaration: Erdos132ThreeChain.carowei
  informal: Let adj be a symmetric irreflexive relation with decidable adjacency on a type, and let V
    be a finite set of vertices. Then V has a subset S, no two elements of which are adjacent, whose cardinality
    is at least the sum over v in V of one divided by one plus the number of neighbours of v inside V.
- declaration: Erdos132ThreeChain.exists_independent_five
  informal: Let adj be a symmetric irreflexive relation with decidable adjacency on a type, and let V
    be a finite set of at least thirteen vertices whose degrees inside V sum to at most twice the cardinality
    of V. Then V has a five-element subset no two elements of which are adjacent.
- declaration: Erdos132ThreeChain.chainTwo_nonDiameter_support
  informal: There is a five-element set of points of the real plane whose squared diameter is 4 and whose
    set of non-diameter squared distances is exactly the two-term geometric 3-chain consisting of 1 and
    3. The configuration that the headline forbids for at least thirteen points is therefore realisable
    at five points with chain length two.
