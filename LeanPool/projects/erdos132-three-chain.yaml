slug: erdos132-three-chain
title: Planar Point Sets Whose Non-Diameter Distances Form a Geometric 3-Chain
summary: "Formalizes a support theorem about planar point sets whose non-diameter squared distances are\
  \ confined to a geometric progression of ratio three. The chain-quadruple theorem shows that no planar\
  \ quadruple with all six squared distances in such a chain can span two chain steps, and classifies\
  \ the seven labelled patterns that do occur: the rhombus of two glued equilateral triangles, in five\
  \ positions of its long edge, and the equilateral triangle with its centroid, in two. A Gram obstruction\
  \ then rules out any five-point chain configuration. The lift to n at least thirteen runs through the\
  \ diameter graph: the Caro--Wei independence bound, proved here, produces an independent five-set once\
  \ the diameter graph is known to have at most as many edges as the set has points. That edge bound is\
  \ the Hopf--Pannwitz theorem of 1934, and it already exists in the pool; this project reproves it in\
  \ its own model as a supporting lemma, claiming no novelty for it, and the overlap is set out in full\
  \ below. The result is unconditional.\nThere is no prior write-up behind this development. The restriction\
  \ to ratio 3 is ad hoc: the 3-chain statement was produced by the author's automated research pipeline\
  \ in August 2026, while the cited source poses the ambient Erdos problem and does not state this restriction\
  \ or result. This theorem does not resolve Erdos 132, whose distance spectra need not be geometric 3-chains.\
  \ The descriptive labels used in the Lean docstrings are internal to this development and refer to no\
  \ numbered result elsewhere.\nOverlap disclosure. Erdos132ThreeChain.hopfPannwitz is NOT offered as\
  \ a new result. The pooled project Erdos132N14 already contains the same diameter bound, and the version\
  \ here exists only so that this project is self-contained. Its statement, verbatim from LeanPool/Erdos132N14/HopfPannwitz.lean,\
  \ is\n\n    theorem diameterEdges_card_le\n        (P : Configuration ι) (S : Finset ι) {d : ℝ}\n  \
  \      (hd : 0 < d)\n        (hmax : ∀ f ∈ pairs S, P.pairDistance f ≤ d) :\n        (diameterEdges\
  \ P S d).card ≤ S.card\n\nwhere, from LeanPool/Erdos132N14/Basic.lean, `Configuration ι` is a structure\
  \ carrying an injective `point : ι → ℂ`, `pairs S = (S ×ˢ S).filter fun e ↦ e.1 < e.2` for a `LinearOrder\
  \ ι`, `pairDistance P e = dist (P.point e.1) (P.point e.2)`, and `diameterEdges P S d = (pairs S).filter\
  \ fun e ↦ P.pairDistance e = d`. The corresponding statement here is\n\n    theorem hopfPannwitz {X\
  \ : Finset Point} {D : ℝ} (hD : IsSqDiameter X D) :\n        ∑ v ∈ X, degree (DiameterAdj D) X v ≤ 2\
  \ * X.card\n\nwith `Point = ℝ × ℝ`, `sqDist` the squared Euclidean distance, `DiameterAdj D p q = (p\
  \ ≠ q ∧ sqDist p q = D)`, `degree adj X v = (X.filter (adj v)).card`, and `IsSqDiameter X D` asserting\
  \ that `D` is realised by two distinct points of `X` and dominates every squared distance inside `X`.\
  \ The two are the same mathematical theorem — a positive maximal distance is realised at most as often\
  \ as there are points — carried by different models: an injective map from a linearly ordered index\
  \ type into the complex plane, counting a Finset of unordered pairs, against a Finset of points of the\
  \ real plane, in squared distances and degree-sum form. Neither statement is an instance of the other\
  \ without a model bridge: a LinearOrder on ℝ × ℝ, a dist-to-sqDist transfer, and a handshake lemma.\
  \ The proofs differ too, Perles charging there against pendant deletion driven by Cramer's rule here.\
  \ No project in the pool imports another, and CONTRIBUTING.md records that independence as the property\
  \ the fast per-project build relies on, so this project reproves the bound rather than importing it.\
  \ It is a supporting lemma of this development, not one of its results, and it is therefore not listed\
  \ among the main results below.\nTwo supporting identities also exist elsewhere in the pool. From LeanPool/Erdos97ConvexOctagon/CayleyMenger.lean,\n\
  \n    theorem cm4_sqDist_eq_zero (a b c d : Plane) :\n        cm4 (sqDist a b) (sqDist a c) (sqDist\
  \ a d)\n          (sqDist b c) (sqDist b d) (sqDist c d) = 0\n\nover `Plane = EuclideanSpace ℝ (Fin\
  \ 2)` is the same four-point Cayley--Menger vanishing as this project's\n\n    theorem gramDet_eq_zero\
  \ (a b c d : Point) :\n        gramDet (sqDist a b) (sqDist a c) (sqDist a d) (sqDist b c) (sqDist b\
  \ d) (sqDist c d) = 0\n\nover `Point = ℝ × ℝ`; both are one-line `ring` identities in the coordinates.\
  \ From LeanPool/DistanceGeometry/SchoenbergHard.lean,\n\n    theorem schoenberg {D : Matrix (Fin n)\
  \ (Fin n) ℝ} (hD : IsPreDistMatrix D) :\n        EmbedsIn D k ↔ (centeredGram D).PosSemidef ∧ (centeredGram\
  \ D).rank ≤ k\n\ncharacterizes Euclidean distance matrices in general dimension. This project never\
  \ invokes it: the four-point condition is used directly as a `ring` identity and the five-point obstruction\
  \ is a sum-of-squares contradiction, so no positive-semidefiniteness criterion is needed."
