main_results:
- declaration: SyntheticEuclid4.IncidenceGeometry
  informal: The axiomatic class of synthetic Euclidean geometry, bundling points, lines, circles, and
    the incidence, betweenness, congruence, and area primitives with Euclid's axioms.
- declaration: SyntheticEuclid4.square_of_len
  informal: Constructs a square on a given segment off a given line.
- declaration: SyntheticEuclid4.pythagoras_construct
  informal: Constructs the three squares and parallelograms on the sides of a triangle used in the proof
    of the Pythagorean theorem.
- declaration: SyntheticEuclid4.pythagoras
  informal: Euclid I.47, the Pythagorean theorem, that the square on the hypotenuse of a right triangle
    equals the sum of the squares on the other two sides.
- declaration: SyntheticEuclid4.pythagoras_converse
  informal: Euclid I.48, the converse of the Pythagorean theorem, that a triangle whose square areas satisfy
    the Pythagorean relation has a right angle.
