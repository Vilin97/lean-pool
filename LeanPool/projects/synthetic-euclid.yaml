slug: synthetic-euclid
title: 'Synthetic Euclidean geometry: Euclid''s Elements Book I'
summary: Formalizes Book I of Euclid's Elements via an axiomatic synthetic-geometry system (incidence,
  betweenness, congruence, and area), culminating in the Pythagorean theorem and its converse.
