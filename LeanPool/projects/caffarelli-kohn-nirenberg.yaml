slug: caffarelli-kohn-nirenberg
title: Caffarelli–Kohn–Nirenberg partial regularity
summary: 'Partial regularity for three-dimensional incompressible Navier–Stokes suitable weak solutions
  with locally L^q forcing, q > 5/2: quantitative epsilon regularity and vanishing parabolic one-dimensional
  Hausdorff measure of the singular set. Includes the supporting Sobolev, singular integral, pressure,
  heat-potential and parabolic Morrey infrastructure, equivalence of suitable-solution formulations, and
  a nonzero shear-flow example. Includes the completed Leray, pressure, and linear regularity support
  needed by further Navier–Stokes regularity projects.'
