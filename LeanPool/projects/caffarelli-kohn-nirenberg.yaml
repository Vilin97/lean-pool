main_results:
- declaration: CKN.epsilonRegularityL3
  informal: For q > 5/2, sufficiently small unit-cylinder L^3 velocity, L^(3/2) pressure and L^q force
    masses give an almost-everywhere equal quantitatively bounded parabolic Holder representative on the
    closed half-cylinder and regularity at each point of its open interior.
- declaration: CKN.epsilonRegularityGradient
  informal: A sufficiently small extended nonnegative limsup of the normalized squared weak-gradient mass
    implies regularity at an interior point of a suitable weak solution.
- declaration: CKN.caffarelliKohnNirenberg
  informal: The singular set of a suitable weak solution with locally L^q forcing, q > 5/2, has zero one-dimensional
    Hausdorff measure in the parabolic metric.
- declaration: CKN.isSuitableWeakSolution_iff_integrable
  informal: The manuscript's suitable weak-solution predicate is equivalent to the predicate that explicitly
    requires integrability of all tested weak-equation and local-energy integrands.
- declaration: CKN.isSuitableWeakSolutionIntegrable_shearFlow
  informal: The nonzero decaying sinusoidal shear flow with zero pressure and force is a suitable weak
    solution on all space and times in (0,1).
