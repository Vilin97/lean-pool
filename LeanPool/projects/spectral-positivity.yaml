slug: spectral-positivity
title: Spectral positivity
summary: Perron-Frobenius theory, Jentzsch's theorem, and matrix/operator positivity in Lean 4. At the
  matrix level it proves that nonnegative matrices have nonnegative powers, the Metzler decomposition
  and positivity of the matrix exponential of a Metzler matrix, M-matrix inverse positivity, and the Perron-Frobenius
  theorem for irreducible nonnegative matrices (a positive dominant eigenvalue with a strictly positive
  eigenvector). At the operator level it proves Jentzsch's theorem for compact self-adjoint positivity-improving
  operators on L2 — a simple, strictly positive ground state with a spectral gap — together with a kernel
  positivity criterion.
