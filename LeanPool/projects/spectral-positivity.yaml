main_results:
- declaration: allpos_has_pos_eigenvec
  informal: A matrix with all strictly positive entries has a positive eigenvalue with a strictly positive
    eigenvector (Perron-Frobenius for positive matrices, via the Collatz-Wielandt characterization).
- declaration: perron_frobenius
  informal: An irreducible (primitive) nonnegative matrix has a positive eigenvalue with a strictly positive
    eigenvector.
- declaration: ground_state_strictly_positive
  informal: The ground eigenfunction of a compact self-adjoint positivity-improving operator on L2 is
    strictly positive almost everywhere (Jentzsch).
- declaration: SpectralPositivity.Matrix.MMatrix.inverse_pos
  informal: The inverse of a nonsingular irreducible M-matrix is entrywise strictly positive.
