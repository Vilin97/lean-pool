- declaration: PalomarHS.nbc_region_real_volume_le_fork_factor
  informal: For a spanning tree in three dimensions, its no-broken-circuit region has volume at most (17/32)
    to the maximum disjoint compatible-fork packing size times the unit-ball volume to the number of tree
    edges.
