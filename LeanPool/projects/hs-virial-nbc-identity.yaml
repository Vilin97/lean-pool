slug: hs-virial-nbc-identity
title: Hard-sphere Mayer NBC identity and fork-packing volume bound
summary: A kernel-checked Lean formalization of the exact no-broken-circuit volume identity for hard-sphere
  Mayer cluster integrals and the stronger dimension-three fork-packing upper bound for each tree-owned
  NBC region. The development proves finite broken-circuit cancellation, the measurable finite-region
  decomposition, the anchored Euclidean product-measure theorem, and its explicit flat-coordinate transport.  Its
  geometric result is the attachment-aware estimate Vol(NBC_T) <= (17/32)^hardSphereNu T * hardSphereKappa^(k-1),
  where hardSphereNu T is the maximum cardinality of a packing of pairwise vertex-disjoint, order-compatible
  forks in T.  A formal fork is an ordered triple (a,b,c) with a < b < c, center a, leaves b,c, and tree
  edges {a,b} and {a,c}.  The central contribution is the complete pointwise-to-integral bridge together
  with the orientation-aware measure-preserving factorization that realizes the per-fork volume suppression.
