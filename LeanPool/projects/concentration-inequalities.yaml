main_results:
- declaration: Contrib.Bennett.hasSubgammaMGF_of_bounded_above
  informal: A centered real random variable bounded above by a positive constant, with bounded second
    moment, satisfies a Bennett--Bernstein sub-gamma moment-generating-function estimate.
- declaration: Contrib.Freedman.subgamma_bernstein_tail
  informal: A finite adapted sum of conditionally sub-gamma increments satisfies the corresponding variance-sensitive
    Freedman--Bernstein upper-tail bound.
- declaration: Contrib.ConditionalHoeffding.hasCondSubgaussianMGF_of_mem_Icc
  informal: A bounded random variable with zero conditional expectation satisfies a conditional Hoeffding
    sub-Gaussian moment-generating-function estimate.
- declaration: Contrib.Hoeffding.hoeffding_upper
  informal: A sum of finitely many independent random variables valued in the unit interval exceeds its
    mean by t with probability at most exp(-2 t squared divided by the number of terms).
