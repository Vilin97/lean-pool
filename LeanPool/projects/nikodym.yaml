slug: nikodym
title: The sharp finite-field Nikodym exponent
summary: Proves a lower bound for Nikodym sets over arbitrary finite fields and a matching exponent upper
  construction over sufficiently large prime fields, using interpolation, algebraic degree bounds, and
  multiquadratic constructions.
branch: additive combinatorics
