main_declarations:
- Nikodym.card_ge_pow_sub
- Nikodym.exists_isNikodym_card_le
main_results:
- declaration: Nikodym.card_ge_pow_sub
  informal: Every Nikodym set in dimension d ≥ 2 over a finite field of size q has size at least q^d −
    (8d²+1)q^(d−2^(1−d)).
- declaration: Nikodym.exists_isNikodym_card_le
  informal: For every positive ε and dimension d ≥ 2, sufficiently large prime fields admit a Nikodym
    set of size at most q^d − q^(d−2^(1−d)−ε).
