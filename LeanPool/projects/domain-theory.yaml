slug: domain-theory
title: DomainTheory
summary: Formalizes Dana Scott's domain theory through Scott information systems and PRG-19 neighbourhood
  systems, including approximable maps, products, function spaces, fixed points, recursive presentations,
  and initial-algebra constructions for denotational semantics.
branch: domain theory
