main_results:
- declaration: InfoSys
  informal: Defines Scott information systems, with a distinguished bottom token, finite consistency predicate,
    entailment relation, and Scott's six axioms.
- declaration: Domain.Neighborhood.NeighborhoodSystem
  informal: Defines PRG-19 neighbourhood systems, Scott's neighbourhood presentation of domains.
- declaration: Domain.Neighborhood.ApproximableMap
  informal: Defines approximable maps between neighbourhood systems as relations preserving finite approximations.
- declaration: Domain.Neighborhood.trianglelefteq_of_isInitial
  informal: Proves that an initial algebra for a functor embeds into every other solution through Scott's
    subdomain relation.
- declaration: ScottMap.fix_eq
  informal: Proves the fixed-point equation for Scott-continuous self maps on complete lattices.
