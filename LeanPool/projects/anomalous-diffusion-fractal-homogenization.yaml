slug: anomalous-diffusion-fractal-homogenization
title: Anomalous diffusion by fractal homogenization
summary: For each positive Hölder exponent below one third, constructs a divergence-free periodic drift
  on the two-dimensional torus exhibiting anomalous dissipation for every mean-zero periodic H1 initial
  datum. The same drift admits uniform Hölder time estimates along a sequence of diffusivity intervals
  and two distinct vanishing-diffusivity limits for an explicit nonempty class of smooth data. Includes
  weak existence and uniqueness, Sobolev and Fourier/Galerkin infrastructure, flow derivatives, quantitative
  homogenization, and the multiscale construction. The no-selection result is the corrected version documented
  upstream, not the printed generality of the original paper's Proposition 5.5.
