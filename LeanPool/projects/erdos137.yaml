main_results:
- declaration: Erdos137.erdos137_finite
  informal: Under the Granville–Langevin radical bound RadLB k (an abc-conditional hypothesis) and k ≥
    3, the set of n ≥ 1 for which F(k,n) is powerful is finite.
- declaration: Erdos137.erdos137_eventually_not_powerful
  informal: Under RadLB k and k ≥ 3, there is a threshold beyond which F(k,n) is never powerful.
- declaration: Erdos137.lemma_star
  informal: Unconditionally, the radical squared times the powerful part of m is at most m squared (rad
    m ^ 2 * B2 m ≤ m ^ 2).
- declaration: Erdos137.powerful_rad_sq_le
  informal: A nonzero powerful number N satisfies rad N ^ 2 ≤ N.
