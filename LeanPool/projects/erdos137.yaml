slug: erdos137
title: 'Erdős Problem #137: powerful products of consecutive integers'
summary: 'Formalizes the abc-conditional finiteness results for Erdős Problem #137 (Erdős–Selfridge):
  a number N is powerful if every prime dividing N has its square dividing N, and the question is whether
  the product F(k,n) = n(n+1)⋯(n+k-1) of k ≥ 3 consecutive integers can be powerful for infinitely many
  n. Each route isolates its abc input (a radical lower bound) as a single explicit hypothesis and proves
  everything else outright, concluding that, conditionally, F(k,n) is powerful for only finitely many
  n for each fixed k ≥ 3.'
