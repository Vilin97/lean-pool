main_results:
- declaration: PalomarSpectralStone.spectral_theorem_intrinsic
  informal: Every self-adjoint partial linear operator on a complex Hilbert space has a real projection-valued
    measure representing its domain and scalar moments, unique on Borel sets.
- declaration: PalomarSpectralStone.stone_theorem_intrinsic
  informal: Every strongly continuous one-parameter unitary group has a self-adjoint generator, and every
    self-adjoint operator generates such a group.
