slug: lean-spectral-theory
title: lean-spectral-theory
summary: The spectral theorem for possibly unbounded self-adjoint operators on complex Hilbert spaces,
  formalized through the Cayley transform and real projection-valued measures. The selected spectral theorem
  constructs a PVM whose scalar measures give the exact finite-second-moment domain and first-moment quadratic
  form, with measurable-set uniqueness, and is proved equivalent to equality with the unbounded coordinate
  spectral integral. The selected Stone theorem proves both that strongly continuous one-parameter unitary
  groups have self-adjoint generators and that every self-adjoint operator generates such a group.
