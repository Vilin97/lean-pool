slug: hasse-minkowski
title: The Hasse–Minkowski theorem over ℚ
summary: 'Proves the local–global principle for quadratic forms over the rationals: a form is isotropic
  over ℚ exactly when it is isotropic over ℝ and over every p-adic completion, together with Meyer''s
  theorem that an indefinite rational form in at least five variables is isotropic. The development builds
  the Hilbert symbol at every place of ℚ with Serre''s explicit formulas (including the 2-adic case),
  proves Hilbert reciprocity and the existence theorem for prescribed local symbols, the Hasse invariant
  and the rank-two and rank-three local representability criteria, Legendre''s ternary descent, and the
  rank-four and rank-≥5 inductions.'
