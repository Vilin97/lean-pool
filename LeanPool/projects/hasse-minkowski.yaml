- declaration: HasseMinkowski.hasseMinkowski
  informal: A quadratic form over ℚ is isotropic if and only if it is isotropic over ℝ and over every
    p-adic completion ℚ_[p] (the Hasse–Minkowski local–global principle, in isotropy form).
- declaration: HasseMinkowski.meyer
  informal: Every indefinite quadratic form over ℚ in at least five variables is isotropic (Meyer's theorem).
