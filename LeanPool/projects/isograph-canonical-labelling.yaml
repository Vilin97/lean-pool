slug: isograph-canonical-labelling
title: Verified canonical labelling of finite graphs
summary: Implements an individualisation-refinement canonical-labelling algorithm in the style of nauty
  and proves that its canonical adjacency form is invariant under vertex relabelling and classifies finite
  graphs up to isomorphism. The imported core includes the executable search, refinement, orbit-pruning
  and backjumping machinery together with its equivariance, termination, soundness and optimality proofs.
branch: graph theory and verified algorithms
