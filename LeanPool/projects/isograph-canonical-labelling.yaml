main_results:
- declaration: IsoGraph.Canon.canonAdj_eq_iff
  informal: Two Boolean adjacency functions on Fin n have equal canonical forms exactly when one is a
    relabelling of the other by a vertex permutation.
- declaration: IsoGraph.Canon.canonAdj_relabel
  informal: Relabelling a finite graph by any permutation leaves its canonical adjacency form unchanged.
- declaration: IsoGraph.Canon.exists_relabel_of_canonAdj_eq
  informal: Equality of canonical adjacency forms yields an explicit permutation relating the original
    adjacency functions.
