slug: viscosity-solution-theory
title: Viscosity solutions, Aleksandrov differentiability and harmonic Dirichlet problems
summary: Develops second-order semijets, smooth test-function equivalence, Jensen contact sets, convex
  Aleksandrov differentiability, the quadratic-penalty Ishii lemma and compact-domain comparison for degenerate
  elliptic equations. Perron assembly retains explicit comparison, barrier and bumping assumptions; these
  are discharged for classical harmonic Dirichlet existence on bounded open domains satisfying a uniform
  exterior sphere condition.
