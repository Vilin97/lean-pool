main_results:
- declaration: Erdos346.intended_problem_if_limit_exists
  informal: Existence of any limit greater than one for the quotient sequence forces convergence to the
    golden ratio, the intended Erdős–Graham conclusion.
- declaration: Erdos346.ratio_limit_eq_goldenRatio
  informal: If the quotient sequence converges to a limit greater than one under the completeness and
    incompleteness deletion hypotheses, that limit equals the golden ratio.
- declaration: Erdos346.ratio_tendsto_goldenRatio_of_limit_exists
  informal: Under the same hypotheses, the quotient sequence converges to the golden ratio itself.
