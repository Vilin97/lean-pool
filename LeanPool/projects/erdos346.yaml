slug: erdos346
title: 'Erdős Problem 346: Ratio Limit Forces the Golden Ratio'
summary: 'Formalizes the limit-exists interpretation of Erdős Problem 346: for a strictly increasing positive
  integer sequence with a uniform ratio gap whose finite deletions are complete but whose infinite deletions
  are not, if the consecutive quotient sequence converges to some real limit greater than one, then that
  limit must equal the golden ratio and the quotient sequence tends to it.'
