- declaration: NFChoice.Foundation.NFStandard.NF_proves_not_WPP
  informal: Standard New Foundations formally derives the negation of WPP. WPP says that, for all sets
    x and y, if a function maps y onto x and an injective function maps y into x, then an injective function
    maps x into y.
  source_ref: 'Upstream Proof/NFStandard/NotWPP.lean and the exact source formulation documented in README.md
    at the pinned commit. Standard-NF completion: commit a9f9867ee379835f91a4f05f9c4a352d44ca1775, 2026-08-25
    00:16:27 UTC. Palomar registration PALOMAR-2026-08-27-000005 is dated 2026-08-27, without a verified
    time of day. The responsible public maintainer is Elliot Glazer. Upstream Flypitch4 credits Ian Klatzco
    and Claude for its Lean 4 port; this import also includes AI-assisted porting and proof repairs, hence
    mixed provenance. The deterministic Metamath replay is not by itself evidence of AI mathematical authorship.
    Independent novelty is not claimed by this card.'
- declaration: NFChoice.Foundation.NFStandard.nf_hailperin_deductivelyEquivalent
  informal: Extensionality together with every integer-stratified comprehension instance and Metamath's
    Hailperin-derived finite first-order presentation, including its added singleton axiom, derive exactly
    the same sentences.
  source_ref: 'Upstream Proof/NFStandard/Equivalence.lean at the pinned commit. Metamath''s ax-sn entry
    credits the singleton addition to SF on 2015-01-12 and distinguishes it from Hailperin''s original
    presentation: https://us.metamath.org/nfeuni/ax-sn.html.'
