slug: nf-weak-partition
title: New Foundations refutes the Weak Partition Principle
summary: Constructs a formal first-order derivation of the negation of the Weak Partition Principle from
  New Foundations, with extensionality and the full integer-stratified comprehension schema. Proves full
  deductive equivalence with Metamath's Hailperin-derived finite presentation, including its added singleton
  axiom. Replays the source proof through nominal syntax, explicit freshness certificates, and a de Bruijn
  calculus. Includes reusable first-order soundness and completeness, stratification, lowering, and proof-translation
  infrastructure. This is a derivability theorem; it does not assert the consistency of New Foundations.
