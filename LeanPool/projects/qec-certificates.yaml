slug: qec-certificates
title: Quantum code certificates and hypergraph-product theory
summary: Formalizes general binary row reduction, kernel bases and rank certificates; quantum-code distance
  bounds from witnesses and exhaustive low-weight enumeration; arbitrary-matrix hypergraph-product dimension
  and X/Z cleaning bounds; and CSS orthogonality of lifted products over finite groups. Includes a Pauli
  expression translation modulo global phase, a Boolean encoding with proved soundness and model extension,
  and sound checking of RUP additions in LRAT certificates, bridged to matrix-level distance bounds. Concrete
  code-family datasets, large certificate replays and measurement protocols are outside this import.
branch: quantum information and coding theory
