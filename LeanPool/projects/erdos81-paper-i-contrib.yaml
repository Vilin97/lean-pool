main_results:
- declaration: LeanPool.Erdos81PaperIContrib.fg_cone_isClosed
  informal: The cone generated by a finite family in a real normed vector space is a closed set.
- declaration: LeanPool.Erdos81PaperIContrib.farkas_ge
  informal: An infeasible finite system of nonnegative linear inequalities admits a nonnegative separating
    Farkas certificate.
- declaration: LeanPool.Erdos81PaperIContrib.covering_packing_duality
  informal: Given a finite nonnegative matrix with a strictly positive entry in every column and nonnegative
    capacities, there is a feasible nonnegative packing whose unit-objective value is maximal and equals
    the infimum cost of nonnegative coverings with unit demand.
