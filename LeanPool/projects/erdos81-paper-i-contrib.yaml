slug: erdos81-paper-i-contrib
title: Finitely generated cones and finite LP duality
summary: Proves that finitely generated cones in real normed spaces are closed, including a conic Carathéodory
  reduction and PointedCone API forms. Derives a finite-dimensional inequality form of Farkas' lemma and
  proves packing attainment with equality to the covering infimum for finite covering and packing linear
  programs. The Farkas and LP statements overlap the pooled Duality development; the generic cone-closedness
  results provide the project's distinct reusable API.
