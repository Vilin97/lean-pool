slug: lean-quantumalg
title: Lean-QuantumAlg
summary: Provides a Mathlib-based library of formally verified quantum-algorithm definitions, primitives,
  and endpoints, including QFT, QSP, quantum kernels, amplitude amplification, Grover search, phase estimation,
  order finding, teleportation, and a Lie-algebraic barren-plateau witness.
branch: quantum computing
entry_module: LeanPool.LeanQuantumAlg
authors:
- QudeLeap Team
