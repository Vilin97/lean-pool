  github_repo: QudeLeap/Lean-QuantumAlg
license: Apache-2.0
status: verified
provenance: human
main_declarations:
- QuantumAlg.GroverSearch.main_success_probability
main_results:
- declaration: QuantumAlg.QuantumFourierTransform.main
  informal: Proves the QFT action on computational-basis states and records exact circuit counts.
- declaration: QuantumAlg.ReflectionBasedQuantumSignalProcessing.main
  informal: Characterizes reflection-based single-qubit QSP transforms in the Chebyshev basis.
- declaration: QuantumAlg.TrigonometricQuantumSignalProcessing.main
  informal: Characterizes trigonometric single-qubit QSP transforms in the YZZYZ form.
- declaration: QuantumAlg.QuantumKernel.main
  informal: Proves that fidelity quantum-kernel Gram matrices are positive semidefinite.
- declaration: QuantumAlg.QuantumKernelAdvantage.separation
  informal: States the conditional quantum-kernel learning separation from discrete-log hardness.
- declaration: QuantumAlg.fullControllability_hasBarrenPlateau
  informal: Exhibits an exponentially vanishing loss-variance family for a fully controllable dynamical
    Lie algebra, conditional on the assumed Ragone second-moment variance law (the Haar/Weingarten averaging
    identity Var = P_g(rho)*P_g(O)/dim, taken as a hypothesis rather than derived from a circuit twirl).
- declaration: QuantumAlg.GroverSearch.main_success_probability
  informal: Derives Grover search success probability from the amplitude-amplification closed form.
