slug: kaltonpeck
title: Rank parity and complex structures on the Kalton–Peck space
summary: Develops symplectic Fredholm theory and the real Kalton–Peck space to prove rank parity of finite-rank
  perturbations and rule out a complex structure on a hyperplane.
