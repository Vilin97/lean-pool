- declaration: KaltonPeck.rankParityGeneral
  informal: The abstract symplectic Fredholm construction yields a rank-parity theorem.
- declaration: KaltonPeck.rankParityZ2
  informal: On the real Kalton–Peck space, T² + 1 has even rank whenever its rank is finite.
- declaration: KaltonPeck.noHyperplaneComplexStructure
  informal: A hyperplane of the real Kalton–Peck space cannot carry a complex structure.
