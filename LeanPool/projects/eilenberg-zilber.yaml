slug: eilenberg-zilber
title: Eilenberg–Zilber theorem for bisimplicial objects
summary: For a bisimplicial object X in an abelian category, constructs a chain homotopy equivalence between
  the total complex of the alternating face map double complex of X and the alternating face map complex
  of its diagonal. The equivalence is built from the shuffle map and the Alexander–Whitney map. On normalized
  complexes, shuffle followed by Alexander–Whitney is the identity, and the other composite is homotopic
  to the identity via the Eilenberg–Mac Lane recursive homotopy. The result is then transported to the
  unnormalized complexes along the Moore normalization comparisons. The development includes the combinatorics
  of (p, q)-shuffles, their signs, and the cancellation of diagonal boundary terms.
