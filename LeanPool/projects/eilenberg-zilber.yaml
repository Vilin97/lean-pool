main_results:
- declaration: LeanPool.EilenbergZilber.BisimplicialObject.eilenbergZilber
  informal: For every bisimplicial object X in an abelian category, the total complex of the double complex
    obtained by taking alternating face map complexes in both simplicial directions is chain homotopy
    equivalent to the alternating face map complex of the diagonal simplicial object of X.
  source_ref: 'Generalized Eilenberg–Zilber theorem for bisimplicial objects in an abelian category: Dold–Puppe,
    "Homologie nicht-additiver Funktoren. Anwendungen", Ann. Inst. Fourier 11 (1961), 201–312, Satz 2.9
    (Eilenberg–Zilber–Cartier); the homology-level statement is Weibel, An Introduction to Homological
    Algebra (1994), Theorem 8.5.1. The product case X_{p,q} = K_p ⊗ L_q is Eilenberg–Zilber, "On products
    of complexes", Amer. J. Math. 75 (1953), 200–204.'
- declaration: LeanPool.EilenbergZilber.BisimplicialObject.eilenbergZilberNormalized
  informal: The total complex of the bi-normalized Moore double complex of X is chain homotopy equivalent
    to the normalized Moore complex of the diagonal, via the shuffle and Alexander–Whitney maps; shuffle
    followed by Alexander–Whitney is the identity.
  source_ref: Eilenberg–Mac Lane, "On the groups H(Π, n), II", Ann. of Math. 60 (1954), 49–139, Theorem
    2.1a, stated there for products of complexes and generalized here to an arbitrary bisimplicial object
    in an abelian category.
