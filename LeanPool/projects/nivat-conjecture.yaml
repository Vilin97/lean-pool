main_results:
- declaration: Nivat.nivat
  informal: For every finite alphabet A and configuration c from the integer lattice to A, if for some
    positive m and n the number of distinct patterns of c on the m-by-n rectangle, counted over all integer
    translations, is at most m times n, then there is a nonzero lattice vector h with c(z + h) = c(z)
    for every z.
- declaration: NivatSubmission.nivat
  informal: The same statement written with Mathlib vocabulary only, as registered with Palomar. The pattern
    set is the range of the restriction of translates of c to the product of the integer intervals [0,
    m) and [0, n), its natural cardinality is at most m times n, and the conclusion is a lattice vector
    h different from (0, 0) with c(z + h) = c(z) for all z.
- declaration: Nivat.nivat_rational
  informal: A finite-range rational-valued configuration whose pattern count on some m-by-n rectangle
    with m, n positive is at most m times n is periodic. This is proved by strong induction on the area
    of the rectangle.
- declaration: Nivat.two_factors
  informal: If a finite-range rational configuration has pattern count at most m times n on an m-by-n
    rectangle with m, n positive and is annihilated by the product of two difference operators in nonzero
    directions h and t, then it is periodic.
- declaration: Nivat.Descent.exists_smaller_low_complexity_rectangle
  informal: If two pointwise limits x and y of translates of a finite-range rational configuration c have
    nonzero difference whose Laurent annihilator ideal is generated by a nonzero polynomial, and c has
    pattern count at most m times n on an m-by-n rectangle, then applying that polynomial to c yields
    a configuration with pattern count at most its area on some rectangle of strictly smaller positive
    area.
- declaration: Nivat.Algebra.exact_line_in_basis
  informal: A nonzero rational configuration that vanishes on the open lower half-plane of a lattice basis
    and is periodic with positive period q along the first basis direction has Laurent annihilator ideal
    generated by a single line-supported polynomial, obtained from a monic divisor of X^q - 1 of positive
    degree.
