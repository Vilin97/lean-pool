slug: nivat-conjecture
title: Nivat's conjecture
summary: Formalizes the proof of Nivat's conjecture found by GPT-6 Pro. A configuration on the integer
  lattice over a finite alphabet whose number of distinct patterns on some m-by-n rectangle is at most
  m times n has a nonzero period. Develops rational alphabet labelings, the Laurent-polynomial shift action
  and its annihilator ideals, the exact line ideal of a half-plane-supported difference of orbit-closure
  points, complexity descent to a smaller rectangle, and Szabados's two-factor theorem for finite-range
  configurations.
